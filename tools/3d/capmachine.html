<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>カプセルマシン 3D の 検査</title>
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/motion3d.css">
<style>
 body{margin:0;background:#101a33;color:#eaf0ff;font-family:sans-serif;min-height:0}
 .row{display:flex;gap:12px;padding:10px;align-items:flex-end;flex-wrap:wrap}
 .cell{background:#16224a;border:2px solid #2b3a6b;border-radius:10px;padding:6px;text-align:center}
 h2{font-size:11px;margin:0 0 4px;color:#9fb2dd;font-weight:normal}
 .scene{perspective:1100px;display:flex;align-items:flex-end;justify-content:center}
 .fig{transform-style:preserve-3d}
 .dbg{font:10px/1.4 monospace;color:#9fb2dd;text-align:left;padding:6px 12px;white-space:pre}
</style></head><body><div id="out"></div>
<script src="../../js/core/util.js"></script><script src="../../js/core/blocks.js"></script>
<script src="../../js/core/vox.js"></script><script src="../../js/content/capsule3d.js"></script>
<script>
/* #big＝300px で 4角度（-22 / 0 / 22 / 60）＋ ハンドルを 90度 回した ところ・玉が はねた ところ
   #side＝真横（90度）で 飛び出しの 検査 */
const q = (location.hash || '#big').slice(1).split(':');
const out = document.getElementById('out');
function show(title, ry, px, tweak) {
  const c = document.createElement('div'); c.className = 'cell';
  const h = document.createElement('h2'); h.textContent = title; c.appendChild(h);
  const s = document.createElement('div'); s.className = 'scene';
  s.style.width = (px + 60) + 'px'; s.style.height = (px + 30) + 'px';
  const f = document.createElement('div'); f.className = 'fig';
  f.style.transform = 'rotateX(8deg) rotateY(' + ry + 'deg)';
  const hold = document.createElement('div');
  hold.style.cssText = 'width:96px;height:96px;margin-top:' + (px - 96) + 'px;transform-style:preserve-3d';
  const v = MQ.vox.capsuleMachine({ unit: 2 });
  if (tweak) tweak(v);
  const k = px / 96;
  const sc = document.createElement('div');
  sc.style.cssText = 'width:96px;height:96px;transform-style:preserve-3d;transform-origin:center bottom;transform:scale3d(' + k + ',' + k + ',' + k + ')';
  sc.appendChild(v); hold.appendChild(sc); f.appendChild(hold); s.appendChild(f); c.appendChild(s);
  return { cell: c, v: v };
}
const row = document.createElement('div'); row.className = 'row';
if (q[0] === 'look') {
  /* #look … ゲームと 同じ 大きさ（ステージ 400×712）で、夜空と まほうじんの 上に 置く：そのまま／金／にじ */
  row.style.cssText = 'display:flex;gap:16px;padding:12px';
  [['そのまま', ''], ['金に 光る', 'gold'], ['にじいろ', 'rainbow']].forEach(function (st) {
    const fr = document.createElement('div');
    fr.style.cssText = 'position:relative;width:400px;height:712px;overflow:hidden;border-radius:18px;background:radial-gradient(120% 70% at 50% 100%, #2a1f6b 0%, #141a44 45%, #0a0e24 100%)';
    let stars = '';
    let sd = 11; const rn = function () { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
    for (let i = 0; i < 60; i++) { const r = rn() < 0.2 ? 3 : 2; stars += '<i style="position:absolute;left:' + Math.round(rn() * 396) + 'px;top:' + Math.round(rn() * 430) + 'px;width:' + r + 'px;height:' + r + 'px;background:#fff;opacity:' + (0.3 + rn() * 0.6).toFixed(2) + '"></i>'; }
    fr.innerHTML = stars;
    const ringCol = st[1] === 'gold' ? '#ffd447' : st[1] === 'rainbow' ? '#ffffff' : 'rgba(159,178,221,.35)';
    [[340, 86], [264, 66], [190, 48]].forEach(function (z, i) {
      const c = document.createElement('div');
      const on = st[1] === 'rainbow' || (st[1] === 'gold' && i === 0);
      c.style.cssText = 'position:absolute;left:' + (200 - z[0] / 2) + 'px;top:' + (560 - z[1] / 2) + 'px;width:' + z[0] + 'px;height:' + z[1] + 'px;border-radius:50%;box-sizing:border-box;border:' + (on ? '5px solid ' + ringCol : '3px dashed rgba(159,178,221,.3)') + ';' + (on ? 'box-shadow:0 0 22px ' + ringCol + ', inset 0 0 18px ' + ringCol + ';' : '');
      fr.appendChild(c);
    });
    const sc = document.createElement('div');
    sc.style.cssText = 'position:absolute;left:50px;top:230px;width:300px;height:300px;perspective:900px';
    const fig = document.createElement('div');
    fig.style.cssText = 'position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(8deg) rotateY(-18deg)';
    const hold = document.createElement('div');
    hold.style.cssText = 'position:absolute;left:102px;top:204px;width:96px;height:96px;transform-style:preserve-3d;transform-origin:center bottom;transform:scale3d(3.125,3.125,3.125)';
    const v = MQ.vox.capsuleMachine({ unit: 2 });
    if (st[1]) {
      /* 光は 3D の 面に つけない（面の 影が 画面の よこに のびて 帯に 見えた）→ マシンの うしろの 2D の 光＋ガラスの 色 */
      const glow = document.createElement('div');
      glow.style.cssText = 'position:absolute;left:30px;top:150px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle, ' + (st[1] === 'gold' ? 'rgba(255,212,71,.75)' : 'rgba(255,255,255,.8)') + ' 0%, rgba(0,0,0,0) 62%)';
      fr.appendChild(glow);
      v.querySelectorAll('.v3glass__front').forEach(function (f) {
        f.style.background = st[1] === 'gold' ? 'linear-gradient(115deg, rgba(255,255,255,0) 18%, rgba(255,255,255,.6) 19% 25%, rgba(255,255,255,0) 26%), rgba(255,226,120,.30)'
          : 'linear-gradient(115deg, rgba(255,94,122,.32), rgba(255,212,71,.32), rgba(99,217,79,.32), rgba(79,211,255,.32), rgba(180,140,255,.36))';
      });
      ['ball2', 'ball4', 'ball8', 'ball9'].forEach(function (b, i) { const p = v.querySelector('.p--' + b); p.style.translate = '0 ' + (-5 - i * 2) + 'px'; p.style.rotate = (i % 2 ? 18 : -14) + 'deg'; });
      v.querySelector('.p--knob').style.transform = 'rotateZ(' + (st[1] === 'gold' ? 60 : 160) + 'deg)';
    }
    hold.appendChild(v); fig.appendChild(hold); sc.appendChild(fig); fr.appendChild(sc);
    const t = document.createElement('div');
    t.textContent = st[0];
    t.style.cssText = 'position:absolute;left:0;right:0;top:40px;text-align:center;font:700 22px sans-serif;color:#fff';
    fr.appendChild(t);
    row.appendChild(fr);
  });
} else if (q[0] === 'side') {
  [90, -90, 45].forEach(function (ry) { row.appendChild(show('真横 ' + ry + '度', ry, 300).cell); });
} else {
  [-22, 0, 22, 60].forEach(function (ry) { row.appendChild(show(ry + '度', ry, 300).cell); });
  row.appendChild(show('ハンドル 90度・玉 はねる', -22, 300, function (v) {
    v.querySelector('.p--knob').style.transform = 'rotateZ(90deg)';
    ['ball1', 'ball3', 'ball5'].forEach(function (b, i) { v.querySelector('.p--' + b).style.transform = 'translateY(' + (-6 - i * 3) + 'px) rotateZ(' + (20 - i * 15) + 'deg)'; });
  }).cell);
  const r = show('0度（数字）', 0, 140);
  row.appendChild(r.cell);
  const d = document.createElement('div'); d.className = 'dbg';
  d.textContent = 'parts: ' + r.v.dataset.parts + '\nfaces: ' + r.v.querySelectorAll('.f').length + '  boxes: ' + r.v.dataset.boxes;
  out.appendChild(d);
}
out.appendChild(row);
</script></body></html>
