<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>主人公 3D しらべ</title>
<style>
  body { margin: 0; background: #101a33; color: #eaf0ff; font-family: sans-serif; }
  .row { display: flex; gap: 16px; padding: 12px; align-items: flex-end; }
  .cell { background: #16224a; border: 2px solid #2b3a6b; border-radius: 10px; padding: 8px; text-align: center; }
  .cell h2 { font-size: 11px; margin: 0 0 6px; color: #9fb2dd; font-weight: normal; }
  .scene { perspective: 1200px; display: flex; align-items: flex-end; justify-content: center; }
  .fig { transform-style: preserve-3d; }
  .v3 { position: relative; transform-style: preserve-3d; }
  .v3 .b { position: absolute; transform-style: preserve-3d; }
  .v3 .f { position: absolute; left: 0; top: 0; }
  img.flat { image-rendering: pixelated; }
</style></head>
<body><div id="out"></div>
<script src="../../js/core/util.js"></script>
<script src="../../js/core/pixel.js"></script>
<script src="../../js/core/blocks.js"></script>
<script src="../../js/content/monsterart.js"></script>
<script src="../../js/content/monstergen.js"></script>
<script src="../../js/content/face.js"></script>
<script src="../../js/content/enemies.js"></script>
<script src="../../js/content/hero.js"></script>
<script src="../../js/content/art.js"></script>
<script src="vox.js"></script>
<script>
const out = document.getElementById('out');
const player = { level: 30, look: {}, equipped: {} };
const src = MQ.hero.sprite(player);
const img = new Image();
img.onload = function () {
  [[-34, '左から 34度'], [-16, '左から 16度'], [0, 'まっすぐ'], [22, '右から 22度']].forEach(function (a) {
    const row = document.createElement('div');
    row.className = 'row';
    [84, 150, 300].forEach(function (size) {
      const c = document.createElement('div'); c.className = 'cell';
      const h = document.createElement('h2'); h.textContent = a[1] + ' / ' + size + 'px'; c.appendChild(h);
      const s = document.createElement('div'); s.className = 'scene';
      s.style.width = (size + 30) + 'px'; s.style.height = (size + 20) + 'px';
      const f = document.createElement('div'); f.className = 'fig';
      f.style.transform = 'rotateX(8deg) rotateY(' + a[0] + 'deg)';
      const v = VOX.fromHero(img, src);
      v.style.transform = 'scale3d(' + [(size / 96),(size / 96),(size / 96)].join(',') + ')';
      v.style.transformOrigin = 'center bottom';
      const hold = document.createElement('div');
      hold.style.cssText = 'width:' + size + 'px;height:' + size + 'px;display:flex;align-items:flex-end;transform-style:preserve-3d';
      hold.appendChild(v);
      f.appendChild(hold); s.appendChild(f); c.appendChild(s); row.appendChild(c);
    });
    // くらべる ため 2Dも
    const c2 = document.createElement('div'); c2.className = 'cell';
    const h2 = document.createElement('h2'); h2.textContent = 'いま（2D）150px'; c2.appendChild(h2);
    const im = document.createElement('img'); im.src = src; im.className = 'flat';
    im.style.width = '150px'; im.style.height = '150px';
    c2.appendChild(im); row.appendChild(c2);
    out.appendChild(row);
  });
};
img.src = src;
</script></body></html>
