<!doctype html>
<meta charset="utf-8">
<div id="host" style="width:400px;height:300px"></div>
<pre id="log">wait</pre>
<script>window.MQ = {};</script>
<script>
// ?src=<fxcanvas の ファイル>
const src = new URLSearchParams(location.search).get('src');
const s = document.createElement('script');
s.src = src;
s.onload = function () {
  const fxc = MQ.ui.fxc, host = document.getElementById('host');
  fxc.attach(host);
  const out = [];
  ['fire', 'leaf', 'ice', 'wind', 'bolt', 'star', 'nova', 'starburst'].forEach(function (id) {
    const times = [];
    fxc.seek(1, id, { foe: { x: 318, y: 150, w: 84, h: 84 }, hero: { x: 92, y: 180, w: 84, h: 84 }, height: 300 });
    let maxParts = 0;
    for (let t = 17; t < 2600; t += 1000 / 60) {
      const a = performance.now();
      const r = fxc.seek(t);
      times.push(performance.now() - a);
      if (r) maxParts = Math.max(maxParts, r.parts);
    }
    times.sort(function (p, q) { return p - q; });
    const avg = times.reduce(function (p, q) { return p + q; }, 0) / times.length;
    out.push(id + ': avg ' + avg.toFixed(2) + 'ms  p95 ' + times[Math.floor(times.length * 0.95)].toFixed(2) + 'ms  max ' + times[times.length - 1].toFixed(2) + 'ms  parts≤' + maxParts);
  });
  document.getElementById('log').textContent = out.join('\n');
};
document.head.appendChild(s);
</script>
