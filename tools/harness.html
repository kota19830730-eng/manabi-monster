<body>
<!--
  画面の 通しテスト／スクリーンショット用。
  パスは 相対（../）なので フォルダを 動かしても そのまま 使えます。

  ハッシュで モードを えらぶ：
    #start   タイトル
    #maker   なまえ・見た目えらび
    #look    すがたを かえる（あとから）
    #map     マップ（#map:600 で その いちまで／#map:-1 で いちばん下）
    #battle  たたかい（1問目で 止める）
    #note    正解の ふきだし（長い 補足つき）
    #fx:fire #fx:bolt #fx:star  ひっさつわざの エフェクト
    #graph   ぼうグラフの 問題（カードが 高い ケース）
    #boss    ボス戦で 止める
    #last    さいごの塔（ラスボス）で 止める
    #roma    ローマ字の「うつ」問題で 止める
    #write   かん字を「書く」問題で 止める
    #result  けっか画面（ボス討伐＋レベルアップ）／#result2 にげられて ★0
    #dex     図かん（主人公）
    #treasure たからばこ
    #parent  おうちの人ページ
    #flow    ぜんぶ 自動で 通す（ログを #log に 出す）

  例:
  chrome --headless=new --disable-gpu --virtual-time-budget=400000 \
    --dump-dom "file:///.../tools/harness.html#flow"
  画像は --screenshot=x.png --window-size=520,1000 --hide-scrollbars
-->
<div id="stage" class="stage">
<main id="screen-start"  class="screen is-active"></main>
<main id="screen-map"    class="screen"></main>
<main id="screen-battle" class="screen"></main>
<main id="screen-result" class="screen"></main>
<main id="screen-dex"    class="screen"></main>
<div id="toast" class="toast" role="status"></div>
</div>
<pre id="log" style="position:fixed;left:0;bottom:0;max-height:0;overflow:hidden;opacity:0;margin:0"></pre>
<script>
window.__log = [];
window.onerror = function (m, s, l) { window.__log.push('ERROR ' + m + ' @' + String(s || '').split('/').pop() + ':' + l); };
window.addEventListener('unhandledrejection', function (e) { window.__log.push('REJECT ' + e.reason); });
</script>

<script>
(function () {
  const L = window.__log;
  const mode = (location.hash || '#flow').slice(1);
  const $ = function (s, root) { return (root || document).querySelector(s); };
  const $$ = function (s, root) { return Array.prototype.slice.call((root || document).querySelectorAll(s)); };
  function say(t) { L.push(t); }
  function dump() { document.getElementById('log').textContent = L.join('\n'); }

  // 音は 切っておく（headless では 鳴らない）
  MQ.stage.fit();
  MQ.save.load();
  MQ.save.setSetting('sfx', false);
  MQ.save.setSetting('bgm', false);
  MQ.sfx.setEnabled(false);
  MQ.bgm.setEnabled(false);
  MQ.ui.setTextures();

  function fresh(opts) {
    opts = opts || {};
    try { localStorage.clear(); } catch (e) {}
    MQ.save.load();
    MQ.save.setSetting('sfx', false);
    MQ.save.setSetting('bgm', false);
    const p = MQ.save.createPlayer('こうた', { hair: 'gold', skin: 'mid', style: 'short' });
    MQ.save.update(function (pl) {
      pl.xp = opts.xp != null ? opts.xp : 1400;
      MQ.hero.gear.forEach(function (g) {
        if (opts.allGear || (!MQ.hero.isDensetsu(g.id) && g.gradeNo <= (opts.grade || 3))) {
          pl.gear.push(g.id);
          pl.equipped[g.slot] = g.id;
        }
      });
      pl.stars = opts.stars || { 'sansu3-1': 3, 'sansu3-2': 3, 'sansu3-3': 2, 'sansu3-4': 2, 'kokugo3-1': 3, 'kokugo3-2': 2, 'rikashakai3-1': 2, 'eigo3-1': 1 };
      pl.best = { 'sansu3-6': { correct: 8, total: 12, time: 260 } };
      pl.treasure = opts.treasure || { 'tr-kake': 2, 'tr-wari': 2, 'tr-jikoku': 1, 'tr-yomi': 1 };
      pl.frags = opts.frags || { sansu: true, kokugo: true };
      pl.coins = 7;
      pl.bag = Object.keys(pl.treasure).slice(0, 3);   // もちもの（どうぐ）
      // ずかんの 見た目を たしかめられるように、さいしょの 20体ぐらいは 見つけた ことに する
      pl.dex = {};
      MQ.enemies.list.slice(0, 20).forEach(function (e, i) { pl.dex[e.id] = 3 + (i % 4); });
      ['skullhorse', 'zukan', 'boss-dragon'].forEach(function (id) { pl.dex[id] = 1; });
      pl.dexNew = { 'slime-green': true, 'robot-gray': true };
      pl.battles = 12; pl.defeated = 96;
      MQ.hero.checkTitles(pl);
      pl.title = 't-ryu';
      MQ.save.addLog(pl, 'あまりのあるわり算：8/12　★2　4:20');
      MQ.save.addLog(pl, 'かけ算のきまり：12/12　★3　3:41');
    });
    MQ.ui.syncCustom();
    return p;
  }

  function correctValue(q) {
    if (q.type === 'number') return q.answer;
    if (q.type === 'choice') return q.answer;
    if (q.type === 'roma') return q.answer;
    if (q.type === 'write') return true;
    return { q: q.answer.q, r: q.answer.r };
  }
  function wrongValue(q) {
    if (q.type === 'number') return q.answer + 1;
    if (q.type === 'choice') return (q.answer + 1) % q.choices.length;
    if (q.type === 'roma') return 'zzz';
    if (q.type === 'write') return false;
    return { q: q.answer.q + 1, r: q.answer.r };
  }

  // 画面の ボタンを 押して 答える（UIも まとめて ためす）
  function answerViaUI(good) {
    const q = MQ.battle.current();
    if (!q) return false;
    if (q.type === 'choice') {
      const btns = $$('#screen-battle .choice');
      const want = good ? q.answer : (q.answer + 1) % q.choices.length;
      if (!btns[want]) { say('NO CHOICE BUTTONS'); return false; }
      btns[want].click();
      return true;
    }
    if (q.type === 'write') {
      const keys = $$('#screen-battle .keys--write .key');
      if (!keys.length) { say('NO WRITE BUTTON'); return false; }
      keys[0].click();                       // 「かけた！」
      const k2 = $$('#screen-battle .keys--write .key');
      (good ? k2[0] : k2[1]).click();        // ○ / ✕
      return true;
    }
    const keys = $$('#screen-battle .key');
    if (!keys.length) { say('NO KEYS for ' + q.type); return false; }
    function press(label) {
      const b = keys.filter(function (k) { return k.textContent === label; })[0];
      if (b) b.click(); else say('NO KEY ' + label);
    }
    if (q.type === 'roma') {
      String(good ? q.answer : 'zzz').split('').forEach(press);
      press('こたえる');
      return true;
    }
    if (q.type === 'divrem') {
      String(good ? q.answer.q : q.answer.q + 1).split('').forEach(press);
      press('こたえる');
      String(q.answer.r).split('').forEach(press);
      press('こたえる');
      return true;
    }
    String(good ? q.answer : q.answer + 1).split('').forEach(press);
    press('こたえる');
    return true;
  }

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /* いま 画面に 出ている 一瞬（ふきだし・ひっさつの エフェクト）を
     スクリーンショットに のこす ため、これいじょう タイマーを 進めない。 */
  function freeze() { window.setTimeout = function () { return 0; }; }
  function fakeDrawing() {
    const W = 900, H = 1200;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(380, 480, 80, 450, 600, 900);
    g.addColorStop(0, '#f7f4ec'); g.addColorStop(1, '#c9c4b6');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    for (let i = 0; i < 6000; i++) { x.fillStyle = 'rgba(0,0,0,' + (Math.random() * 0.06) + ')'; x.fillRect(Math.random() * W, Math.random() * H, 2, 2); }
    x.fillStyle = '#6f6a60'; x.fillRect(0, 1130, W, 70);   // つくえの ふち
    const d = document.createElement('canvas'); d.width = W; d.height = H;
    const y = d.getContext('2d');
    y.lineJoin = 'round'; y.lineCap = 'round';
    function blob(cx, cy, rx, ry, fill) { y.beginPath(); y.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); y.fillStyle = fill; y.fill(); y.lineWidth = 3.2; y.strokeStyle = '#2a2622'; y.stroke(); }
    blob(450, 620, 210, 190, 'rgba(242,162,58,.85)');   // 体（オレンジの マーカー）
    y.fillStyle = 'rgba(255,200,120,.5)'; for (let i = 0; i < 40; i++) y.fillRect(300 + Math.random() * 300, 480 + Math.random() * 280, 30, 6);
    [[300, 440], [400, 400], [500, 400], [600, 440]].forEach(function (p) { y.beginPath(); y.moveTo(p[0] - 30, p[1] + 20); y.lineTo(p[0], p[1] - 90); y.lineTo(p[0] + 30, p[1] + 20); y.closePath(); y.fillStyle = 'rgba(76,175,80,.9)'; y.fill(); y.lineWidth = 3; y.strokeStyle = '#2a2622'; y.stroke(); });
    blob(380, 590, 38, 42, '#fbfbf7'); blob(520, 590, 38, 42, '#fbfbf7');
    y.fillStyle = '#1e1c1a'; y.beginPath(); y.arc(388, 598, 14, 0, 7); y.fill(); y.beginPath(); y.arc(528, 598, 14, 0, 7); y.fill();
    y.beginPath(); y.moveTo(380, 690); y.quadraticCurveTo(450, 760, 520, 690); y.lineWidth = 4; y.strokeStyle = '#c2322d'; y.stroke();
    for (let i = 0; i < 4; i++) { y.beginPath(); y.moveTo(395 + i * 36, 700 + (i % 2) * 6); y.lineTo(413 + i * 36, 728); y.lineTo(431 + i * 36, 700 + (i % 2) * 6); y.closePath(); y.fillStyle = '#fff'; y.fill(); y.lineWidth = 1.5; y.strokeStyle = '#2a2622'; y.stroke(); }
    [[360, 800], [520, 800]].forEach(function (p) { y.fillStyle = 'rgba(63,127,214,.9)'; y.fillRect(p[0], p[1], 60, 110); y.lineWidth = 3; y.strokeStyle = '#2a2622'; y.strokeRect(p[0], p[1], 60, 110); });
    y.beginPath(); y.moveTo(650, 640); y.bezierCurveTo(760, 600, 780, 720, 700, 760); y.lineWidth = 1.6; y.strokeStyle = '#4a4540'; y.stroke();   // えんぴつの 細い しっぽ
    y.lineWidth = 1.2; y.strokeStyle = '#7a746c'; y.beginPath(); y.moveTo(230, 950); y.lineTo(300, 990); y.lineTo(250, 1010); y.stroke();   // よこの らくがき（小さい）
    try { x.filter = 'blur(0.9px)'; } catch (e) {}
    x.drawImage(d, 0, 0);
    return c.toDataURL('image/jpeg', 0.82);
  }

  /* AIが かえしそうな 絵（太い 線・ベタ塗り・白い 背景）。#ai の にせの こたえ */
  function fakeAiArt() {
    const S = 1024;
    const c = document.createElement('canvas'); c.width = S; c.height = S;
    const y = c.getContext('2d');
    y.fillStyle = '#fff'; y.fillRect(0, 0, S, S);
    y.lineJoin = 'round'; y.lineCap = 'round';
    function blob(cx, cy, rx, ry, fill) { y.beginPath(); y.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); y.fillStyle = fill; y.fill(); y.lineWidth = 16; y.strokeStyle = '#1c1a18'; y.stroke(); }
    // あし
    [[380, 700], [560, 700]].forEach(function (p) { y.fillStyle = '#3f7fd6'; y.fillRect(p[0], p[1], 90, 170); y.lineWidth = 16; y.strokeStyle = '#1c1a18'; y.strokeRect(p[0], p[1], 90, 170); y.fillStyle = '#2b5aa0'; y.fillRect(p[0] + 8, p[1] + 120, 74, 40); });
    // つの
    [[300, 330], [420, 280], [560, 280], [680, 330]].forEach(function (p) { y.beginPath(); y.moveTo(p[0] - 44, p[1] + 40); y.lineTo(p[0], p[1] - 130); y.lineTo(p[0] + 44, p[1] + 40); y.closePath(); y.fillStyle = '#4caf50'; y.fill(); y.lineWidth = 16; y.strokeStyle = '#1c1a18'; y.stroke(); });
    blob(500, 520, 250, 220, '#f2a23a');
    y.fillStyle = '#c9782a'; y.beginPath(); y.ellipse(560, 600, 150, 90, 0, 0, Math.PI); y.fill();   // かげ（セルシェード）
    blob(410, 480, 52, 58, '#fff'); blob(590, 480, 52, 58, '#fff');
    y.fillStyle = '#1c1a18'; y.beginPath(); y.arc(420, 490, 22, 0, 7); y.fill(); y.beginPath(); y.arc(600, 490, 22, 0, 7); y.fill();
    y.beginPath(); y.moveTo(400, 610); y.quadraticCurveTo(500, 700, 600, 610); y.lineWidth = 16; y.strokeStyle = '#1c1a18'; y.stroke();
    y.fillStyle = '#c2322d'; y.beginPath(); y.moveTo(408, 614); y.quadraticCurveTo(500, 690, 592, 614); y.closePath(); y.fill();
    for (let i = 0; i < 4; i++) { y.beginPath(); y.moveTo(420 + i * 44, 620); y.lineTo(442 + i * 44, 656); y.lineTo(464 + i * 44, 620); y.closePath(); y.fillStyle = '#fff'; y.fill(); y.lineWidth = 6; y.strokeStyle = '#1c1a18'; y.stroke(); }
    y.beginPath(); y.moveTo(740, 540); y.bezierCurveTo(880, 480, 900, 660, 790, 700); y.lineWidth = 26; y.strokeStyle = '#1c1a18'; y.stroke(); y.lineWidth = 12; y.strokeStyle = '#f2a23a'; y.stroke();   // しっぽ
    return c.toDataURL('image/png');
  }
  // にせの AI（transport）。kind = ok / wait / err / safety / busy
  function fakeAi(kind) {
    return function (url, init) {
      say('ai call: ' + url.replace(/^.*\/v1beta\//, '') + ' ' + (init.method || 'GET') + ' key=' + (init.headers['x-goog-api-key'] || '') + ' body=' + (init.body ? init.body.length : 0));
      if (kind === 'wait') return new Promise(function () {});
      if (kind === 'err') return Promise.resolve({ status: 400, json: { error: { code: 400, message: 'API key not valid. Please pass a valid API key.', status: 'INVALID_ARGUMENT' } } });
      if (kind === 'busy') return Promise.resolve({ status: 429, json: { error: { code: 429, message: 'You exceeded your current quota, please check your plan and billing details.', status: 'RESOURCE_EXHAUSTED' } } });
      if (kind === 'safety') return Promise.resolve({ status: 200, json: { candidates: [{ finishReason: 'IMAGE_SAFETY', content: { parts: [{ text: 'no' }] } }] } });
      if ((init.method || 'GET') === 'GET') return Promise.resolve({ status: 200, json: { name: 'models/x' } });
      const png = fakeAiArt().split(',')[1];
      return Promise.resolve({ status: 200, json: { candidates: [{ finishReason: 'STOP', content: { parts: [{ text: 'Here is your monster.' }, { inlineData: { mimeType: 'image/png', data: png } }] } }] } });
    };
  }

  async function playBattle(label, opts) {
    opts = opts || {};
    let guard = 0;
    while (!MQ.battle.isOver() && guard < 120) {
      guard++;
      const q = MQ.battle.current();
      if (!q) break;
      if (opts.stopAtBoss && q.boss) { say(label + ': ボスで 停止'); return 'boss'; }
      const good = opts.missFirst && guard === 1 ? false : true;
      answerViaUI(good);
      await wait(60);
      if (MQ.battle.isRetry()) { answerViaUI(true); await wait(60); }
      await wait(opts.slow ? 3400 : 3300);
    }
    say(label + ': おわり guard=' + guard + ' over=' + MQ.battle.isOver());
    return 'done';
  }

  async function run() {
    if (mode === 'start') { fresh(); MQ.ui.start.render(); MQ.ui.show('screen-start'); return; }
    if (mode === 'maker') { try { localStorage.clear(); } catch (e) {} MQ.save.load(); MQ.ui.start.maker(); return; }
    if (mode === 'look') { fresh(); MQ.ui.look.edit(); return; }
    if (mode === 'map' || mode.indexOf('map:') === 0) {
      fresh(); MQ.ui.goMap(); await wait(200); MQ.ui.map.paint();
      const n = parseInt(mode.slice(4), 10);   // #map:600 で その いちまで スクロール（-1 は いちばん下）
      if (!isNaN(n)) { const sc = $('#screen-map .map__scroll'); if (sc) sc.scrollTop = n < 0 ? 99999 : n; }
      return;
    }
    // #figs … 小2「かたち」「ぶんすう」の 図を ぜんぶ ならべて 見る
    if (mode === 'figs') {
      const box = document.createElement('div');
      box.style.cssText = 'position:absolute;inset:0;background:#FFF8E6;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px;z-index:99;align-content:start;';
      ['tri', 'rtri', 'quad', 'rect', 'square', 'box'].forEach(function (k) {
        const d = document.createElement('div'); d.innerHTML = MQ.sansu2.fig(k); box.appendChild(d);
      });
      const d1 = document.createElement('div'); d1.innerHTML = MQ.sansu2.fig('rect', true); box.appendChild(d1);
      const d2 = document.createElement('div'); d2.innerHTML = MQ.sansu2.fig('box', true); box.appendChild(d2);
      const d3 = document.createElement('div'); d3.innerHTML = MQ.sansu2.fracSvg(3, 1); box.appendChild(d3);
      const d4 = document.createElement('div'); d4.innerHTML = MQ.sansu2.fracSvg(4, 1); box.appendChild(d4);
      const d5 = document.createElement('div'); d5.style.gridColumn = '1 / -1'; d5.innerHTML = MQ.sansu2.figPair('へんが 3ぼんの かたちは どっち？', 'tri', 'quad'); box.appendChild(d5);
      document.getElementById('stage').appendChild(box);
      return;
    }
    // 小2ワールド（v2.3）：#map2(:-1) マップ／#battle2:N さんすうN／#kokugo2 かん字を かく／#treasure2／#upd お知らせ
    if (mode === 'map2' || mode.indexOf('map2:') === 0 || mode.indexOf('battle2') === 0 || mode === 'kokugo2' || mode === 'treasure2' || mode === 'upd') {
      fresh({
        stars: { 'sansu2-1': 3, 'sansu2-2': 2, 'sansu2-3': 3, 'sansu2-4': 1, 'kokugo2-1': 3 },
        treasure: { 'tr2-hyou': 2, 'tr2-tashi': 1, 'tr2-hiki': 2, 'tr2-yomi': 1 },
        frags: {}
      });
      MQ.save.update(function (pl) { pl.grade = 2; pl.best = {}; });
      if (mode.indexOf('battle2') === 0) {
        const bn = parseInt(mode.slice(8), 10);
        MQ.ui.battle.start('sansu2-' + (isNaN(bn) ? 1 : bn)); await wait(600); return;
      }
      if (mode === 'kokugo2') { MQ.ui.battle.start('kokugo2-2'); await wait(600); return; }
      if (mode === 'treasure2') { MQ.ui.dex.render('treasure'); MQ.ui.show('screen-dex'); return; }
      if (mode === 'upd') { MQ.ui.dex.render('set'); MQ.ui.show('screen-dex'); MQ.ui.updateReady(); return; }
      MQ.ui.goMap(); await wait(200); MQ.ui.map.paint();
      const n2 = parseInt(mode.slice(5), 10);
      if (!isNaN(n2)) { const sc = $('#screen-map .map__scroll'); if (sc) sc.scrollTop = n2 < 0 ? 99999 : n2; }
      return;
    }
    // 小1ワールド（v2.2）：#map1 マップ／#battle1 さんすう1／#kokugo1 かん字を かく／#treasure1 ずかんの たからもの
    if (mode === 'map1' || mode.indexOf('map1:') === 0 || mode.indexOf('battle1') === 0 || mode === 'kokugo1' || mode === 'treasure1') {
      fresh({
        stars: { 'sansu1-1': 3, 'sansu1-2': 2, 'sansu1-3': 1, 'kokugo1-1': 3 },
        treasure: { 'tr1-kazu': 2, 'tr1-banme': 1, 'tr1-hira': 1 },
        frags: {}
      });
      MQ.save.update(function (pl) { pl.grade = 1; pl.best = {}; });
      if (mode.indexOf('battle1') === 0) {   // #battle1:8 で ステージ8（とけい）
        const bn = parseInt(mode.slice(8), 10);
        MQ.ui.battle.start('sansu1-' + (isNaN(bn) ? 1 : bn)); await wait(600); return;
      }
      if (mode === 'kokugo1') { MQ.ui.battle.start('kokugo1-4'); await wait(600); return; }
      if (mode === 'treasure1') { MQ.ui.dex.render('treasure'); MQ.ui.show('screen-dex'); return; }
      MQ.ui.goMap(); await wait(200); MQ.ui.map.paint();
      const n1 = parseInt(mode.slice(5), 10);   // #map1:-1 で いちばん下
      if (!isNaN(n1)) { const sc = $('#screen-map .map__scroll'); if (sc) sc.scrollTop = n1 < 0 ? 99999 : n1; }
      return;
    }
    if (mode === 'dex') { fresh(); MQ.ui.dex.render('hero'); MQ.ui.show('screen-dex'); return; }
    if (mode === 'treasure') { fresh(); MQ.ui.dex.render('treasure'); MQ.ui.show('screen-dex'); return; }
    if (mode === 'mons') { fresh(); MQ.ui.dex.render('mons'); MQ.ui.show('screen-dex'); return; }
    // 学期（v2.6）：#term1 1学期に した 地図／#parent1 おうちの人ページ（1学期）
    if (mode.indexOf('term1') === 0 || mode === 'parent1') {
      fresh();
      MQ.save.update(function (pl) { pl.term = 1; pl.units = {}; });
      if (mode !== 'parent1') {
        MQ.ui.goMap(); await wait(300); MQ.ui.map.paint();
        const n = parseInt(mode.slice(6), 10);   // #term1:-1 で いちばん下
        if (!isNaN(n)) { const sc = $('#screen-map .map__scroll'); if (sc) sc.scrollTop = n < 0 ? 99999 : n; }
      }
      else { MQ.ui.dex.render('parent'); MQ.ui.show('screen-dex'); }
      const open = [];
      MQ.content.subjectAreas().forEach(function (a) { a.stages.forEach(function (st) { if (MQ.content.isAvailable(st)) open.push(st.id); }); });
      say('term1 open: ' + open.join(' '));
      return;
    }
    if (mode === 'parent') { fresh(); MQ.ui.dex.render('parent'); MQ.ui.show('screen-dex'); return; }
    if (mode === 'set') { fresh(); MQ.ui.dex.render('set'); MQ.ui.show('screen-dex'); return; }
    if (mode === 'photo') { fresh(); MQ.ui.photo.render(); return; }
    // 写真から モンスター（v2.7）：#photo2 = 子どもの 絵に 見せかけた 画像／#photo3:<file URL> = 本物の 画像
    if (mode.indexOf('photo2') === 0 || mode.indexOf('photo3:') === 0) {
      fresh();
      const sz = parseInt(mode.split(':')[mode.indexOf('photo2') === 0 ? 1 : 2] || '0', 10);
      if (sz) MQ.ui.photo.setOptions({ size: sz });
      MQ.ui.photo.render();
      let url = null;
      if (mode.indexOf('photo2') === 0) url = fakeDrawing();
      else {
        const blob = await fetch(decodeURIComponent(mode.slice(7))).then(function (r) { return r.blob(); });
        url = await new Promise(function (res) { const fr = new FileReader(); fr.onload = function () { res(String(fr.result)); }; fr.readAsDataURL(blob); });
      }
      await new Promise(function (res) { MQ.ui.photo.render.load(url, function (info, out) { say('photo: ' + JSON.stringify(info) + ' png=' + (out ? out.length : 0) + ' crop=' + JSON.stringify(MQ.ui.photo.crop())); res(); }); });
      await wait(200);
      dump();
      return;
    }

    // AIで かっこよく（v2.8）：#ai = にせの AIで できあがりまで／#ai:wait = まっている 幕／#ai:err = かぎが ちがう／
    //   #ai:safety = AIが かけない／#ai:busy = 無料わくが ない／#ai:off = かぎ なし（ボタンが 出ない）／#ai:back = もどした あと
    if (mode.indexOf('ai') === 0 && mode !== 'aiparent') {
      fresh();
      const parts = mode.split(':');
      const kind = parts[1] || 'ok';
      const down = parts[2] === 'down';   // #ai:ok:down = できあがりの みほんまで スクロール
      MQ.ai._reset();
      if (kind !== 'off') MQ.ai.setConfig({ key: 'AIzaTEST', limit: 20 });
      MQ.ai.transport = fakeAi(kind === 'back' ? 'ok' : kind);
      MQ.ui.photo.render();
      await new Promise(function (res) { MQ.ui.photo.render.load(fakeDrawing(), function () { res(); }); });
      say('ai before: btn=' + ($('.photo__ai') && !$('.photo__ai').hidden ? 'shown' : 'hidden') + ' note=' + ($('.photo__ainote') && !$('.photo__ainote').hidden ? 'shown' : 'hidden') + ' left=' + MQ.ai.left());
      if (kind === 'off') { dump(); return; }
      MQ.ui.photo.render.askAi();
      let n = 0;
      while (MQ.ui.photo.aiState().busy && n < 40 && kind !== 'wait') { await wait(50); n++; }
      if (kind === 'wait') { await wait(50); freeze(); }
      const st = MQ.ui.photo.aiState();
      say('ai after: ' + JSON.stringify(st) + ' info=' + JSON.stringify(MQ.ui.photo.info()) + ' used=' + MQ.ai.usedToday() + ' left=' + MQ.ai.left());
      say('ai ui: btn=' + ($('.photo__ai').hidden ? 'hidden' : 'shown') + ' row=' + ($('.photo__airow').hidden ? 'hidden' : 'shown') + ' err=' + ($('.photo__empty:not([hidden])') ? $('.photo__empty:not([hidden])').textContent : '') + ' wait=' + ($('.photo__wait').hidden ? 'hidden' : 'shown'));
      if (kind === 'back') { MQ.ui.photo.render.restore(); await wait(50); say('ai back: ' + JSON.stringify(MQ.ui.photo.aiState()) + ' info=' + JSON.stringify(MQ.ui.photo.info())); }
      if (down) { const wrap = $('#screen-dex .wrap'); const tgt = $('.photo__preview'); if (wrap && tgt) wrap.scrollTop = tgt.offsetTop - 90; }
      await wait(200);
      dump();
      return;
    }
    if (mode === 'aiparent') {
      fresh();
      MQ.ai._reset();
      MQ.ai.setConfig({ key: 'AIzaTESTTESTTESTTESTTESTTESTTESTTESTTES', limit: 20 });
      MQ.ai.transport = fakeAi('ok');
      MQ.ui.dex.render('parent'); MQ.ui.show('screen-dex');
      await wait(100);
      const sec = $('.ai');
      say('aiparent: ' + (sec ? 'ok' : 'MISSING') + ' status=' + ($('.ai__status') ? $('.ai__status').textContent : ''));
      const chk = Array.prototype.filter.call(document.querySelectorAll('.ai__row .btn'), function (b) { return b.textContent === 'しらべる'; })[0];
      if (chk) { chk.click(); await wait(100); say('aiparent check: ' + $('.ai__status').textContent); }
      if (sec) { const wrap = $('#screen-dex .wrap'); wrap.scrollTop = sec.offsetTop - 8; }
      dump();
      return;
    }

    // 正解の ふきだし（いちばん 長い 補足）。画面に おさまるか 見る
    if (mode === 'note') {
      fresh();
      let pool = [];
      [MQ.kokugo3.questions, MQ.rikashakai3.questions, MQ.eigo3.questions].forEach(function (list) {
        pool = pool.concat(list.filter(function (q) { return q.note && q.choices; }));
      });
      pool.sort(function (a, b) { return b.note.length - a.note.length; });
      const long = pool[0];
      const st = MQ.content.findStage('rikashakai3-2').stage;
      const orig = st.make;
      st.make = function (n) {
        const out = [];
        for (let i = 0; i < n; i++) {
          out.push({
            id: 'note-test-' + i, type: 'choice', unit: long.unit,
            prompt: long.text, choices: long.choices.slice(), answer: 0,
            hint: long.hint, note: long.note
          });
        }
        return out;
      };
      void orig;                       // テスト用なので もとに もどさない
      MQ.ui.battle.start('rikashakai3-2');
      await wait(300);
      freeze();                        // 先に 止めてから 答える（ふきだしが 消えない）
      answerViaUI(true);
      const el = $('#screen-battle .feedback__note');
      say('note(' + (el ? el.textContent.length : 0) + '): ' + (el ? el.textContent : 'なし'));
      return;
    }
    // ひっさつわざの エフェクト（v2.5）：#fx:<わざ>[:<秒>]  わざ＝fire leaf ice wind bolt star nova、秒＝何秒めで 止めて 撮るか（0.3）
    if (mode.indexOf('fx') === 0) {
      const want = mode.split(':')[1] || 'fire';
      const at = parseFloat(mode.split(':')[2] || '0.3');
      fresh(); MQ.ui.battle.start('rikashakai3-1'); await wait(400);
      freeze();
      const sp = MQ.ui.battle.demoSpecial(want);
      // アニメを at 秒めで 止めて 撮る（delay も ふくめた 本当の 時間）
      void document.body.offsetWidth;   // スタイルを 確定させてから アニメを 取る（freeze 後は wait が 使えない）
      document.getAnimations().forEach(function (a) { a.pause(); try { a.currentTime = at * 1000; } catch (e) {} });
      say('fx: ' + want + ' → ' + sp.name);
      return;
    }
    // どうぐ（v2.0）：#bag＝シートを 開いた ところ／#bagfx:<power>＝使った ときの 演出
    //                 #bagguard＝たてが まもった ところ／#bagdex＝ずかんの もちもの
    const ITEM_OF = { burst: 'tr-wari', shield: 'tr-ookii', freeze: 'tr-jikoku', guide: 'tr-hissan', golden: 'tr-graph', chest: 'tr-amari', power: 'tr-kake', charge: 'tr-omosa' };
    if (mode === 'bag' || mode.indexOf('bagfx') === 0 || mode === 'bagguard' || mode === 'bagre') {
      const want = mode.split(':')[1] || 'burst';
      fresh({ treasure: { 'tr-wari': 2, 'tr-ookii': 1, 'tr-graph': 1, 'tr-jikoku': 1, 'tr-hissan': 2, 'tr-amari': 1, 'tr-kake': 1, 'tr-omosa': 1 } });
      MQ.save.update(function (pl) {
        pl.bag = mode === 'bag' ? ['tr-wari', 'tr-ookii', 'tr-graph'] : [ITEM_OF[mode === 'bagguard' ? 'shield' : want] || 'tr-wari'];
      });
      MQ.ui.battle.start('sansu3-6');
      await wait(400);
      const pause = function () {
        const st = document.createElement('style');
        st.textContent = '.fx, .fx *, .hero, .hero::after, .enemy__img, .combo, .bagbtn__dot { animation-delay: -.3s !important; animation-play-state: paused !important; }';
        document.head.appendChild(st);
      };
      if (mode === 'bag') { MQ.ui.battle.openBag(); say('bag: ' + $$('.bagrow').length + ' items'); return; }
      if (mode === 'bagre') {
        // つかいおわった アイテムに「もう1回」（コイン2まい）が 出る ところ
        MQ.ui.battle.demoItem('burst');
        await wait(1100);
        MQ.ui.battle.openBag();
        say('bagre: ' + ($('.bagrow__re') ? 'ok' : 'MISSING') + ' / coins: ' + ($('.bagcard__coins') ? $('.bagcard__coins').textContent : 'なし'));
        return;
      }
      if (mode === 'bagguard') {
        MQ.ui.battle.demoItem('shield');
        await wait(1200);
        answerViaUI(false); await wait(900);
        freeze();
        answerViaUI(false);
        pause();
        say('guard: ' + $('.arena__msg').textContent);
        return;
      }
      freeze();
      const it = MQ.ui.battle.demoItem(want);
      pause();
      say('bagfx: ' + want + ' → ' + (it ? it.powerName : 'なし') + ' / ' + $('.arena__msg').textContent);
      return;
    }
    if (mode === 'bagdex') { fresh(); MQ.ui.dex.pick('tr-wari'); MQ.ui.dex.render('treasure'); MQ.ui.show('screen-dex'); return; }
    // メモ欄に ゆびで 書く（v2.7.1）：#memo ふつう／#memo2 ひろげた あと／#memo3 ひろげて もどした あと
    if (mode.indexOf('memo') === 0) {
      const memoRect = mode.indexOf(':rect') > 0;   // #memo:rect＝赤い 四角も 描く（headless で canvas が 写るか）
      const mm = mode.split(':')[0];
      fresh({ stars: { 'sansu2-1': 3 }, treasure: {}, frags: {} });
      MQ.save.update(function (pl) { pl.grade = 2; pl.best = {}; });
      MQ.ui.battle.start('sansu2-2'); await wait(400);
      if (mm !== 'memo') { $('.memo__btn').click(); await wait(120); }
      if (mm === 'memo3') { $('.memo__btn').click(); await wait(120); }
      const cv = $('.memo__canvas'); const r = cv.getBoundingClientRect();
      function pe(type, x, y) { cv.dispatchEvent(new PointerEvent(type, { pointerId: 1, pointerType: 'touch', isPrimary: true, clientX: r.left + x, clientY: r.top + y, bubbles: true, cancelable: true })); }
      // 「2」のような 線を 書く
      const pts = [[0.3, 0.25], [0.45, 0.15], [0.6, 0.3], [0.45, 0.55], [0.3, 0.85], [0.65, 0.85]];
      pe('pointerdown', r.width * pts[0][0], r.height * pts[0][1]);
      for (let i = 1; i < pts.length; i++) { const a = pts[i - 1], b = pts[i]; for (let t = 0.1; t <= 1.001; t += 0.1) pe('pointermove', r.width * (a[0] + (b[0] - a[0]) * t), r.height * (a[1] + (b[1] - a[1]) * t)); }
      pe('pointerup', r.width * 0.65, r.height * 0.85);
      // 書いた ところに 線が あるか（画面px → ビットマップ）
      const cx = cv.getContext('2d'); const sx = cv.width / r.width, sy = cv.height / r.height;
      let inked = 0;
      pts.forEach(function (p) { const dd = cx.getImageData(Math.round(r.width * p[0] * sx), Math.round(r.height * p[1] * sy), 1, 1).data; if (dd[3] > 0) inked++; });
      say('memo: inked ' + inked + '/' + pts.length + ' bitmap=' + cv.width + 'x' + cv.height + ' rect=' + Math.round(r.width) + 'x' + Math.round(r.height) + ' scale=' + MQ.stage.size().scale.toFixed(2));
      // 少し あとでも 線が のこっているか（大きさ合わせで 消えていないか）。結果は ふきだしにも 出す（スクショで 見える）
      await wait(400);
      let inked2 = 0;
      pts.forEach(function (p) { const dd = cx.getImageData(Math.round(r.width * p[0] * cv.width / r.width), Math.round(r.height * p[1] * cv.height / r.height), 1, 1).data; if (dd[3] > 0) inked2++; });
      say('memo after: inked ' + inked2 + '/' + pts.length + ' bitmap=' + cv.width + 'x' + cv.height);
      $('.arena__msg').textContent = 'memo ' + inked + '→' + inked2 + ' / ' + cv.width + 'x' + cv.height;
      if (memoRect) {
        /* headless Chrome（virtual-time）では、あとから 描いた canvas の 中身が スクショに 写らない（新しく 作った canvas でも 同じ）。
           そこで ビットマップの 写し（img・緑わく）を おいて、線が どう 書けたかを 目で 見られる ように する。線の 有無は 上の inked で 検査ずみ。 */
        cx.save(); cx.setTransform(1, 0, 0, 1, 0, 0); cx.fillStyle = '#e8443a'; cx.fillRect(10, 10, 140, 60); cx.restore();
        const im = document.createElement('img'); im.src = cv.toDataURL(); im.style.cssText = 'position:absolute;left:150px;top:6px;width:120px;height:32px;z-index:5;outline:3px solid #4caf50;';
        cv.parentNode.appendChild(im);
      }
      dump();
      return;
    }
    // メモを ひろげる（v2.4.1）：#wide 小2 ひっさん／#wide3 小3 わりざん
    if (mode === 'wide' || mode === 'wide3') {
      if (mode === 'wide') {
        fresh({ stars: { 'sansu2-1': 3 }, treasure: {}, frags: {} });
        MQ.save.update(function (pl) { pl.grade = 2; pl.best = {}; });
        MQ.ui.battle.start('sansu2-2');
      } else { fresh(); MQ.ui.battle.start('sansu3-6'); }
      await wait(600);
      const b = $('.memo__btn'); b.click(); await wait(200);
      const m = $('.memo');
      say('wide: ' + m.classList.contains('memo--wide') + ' memo=' + Math.round(m.getBoundingClientRect().height) + 'px btn=' + b.textContent);
      return;
    }
    if (mode === 'battle') { fresh(); MQ.ui.battle.start('sansu3-6'); await wait(600); return; }
    if (mode === 'graph')  { fresh(); MQ.ui.battle.start('sansu3-5'); await wait(600); return; }  // ぼうグラフ（せの高い 問題）
    if (mode === 'roma') {
      fresh();
      MQ.ui.battle.start('kokugo3-5');
      for (let i = 0; i < 30; i++) {
        await wait(200);
        const q = MQ.battle.current();
        if (q && q.type === 'roma') { say('roma question shown'); return; }
        answerViaUI(true); await wait(3400);
      }
      return;
    }
    if (mode === 'write') {
      fresh();
      MQ.ui.battle.start('kokugo3-2');
      for (let i = 0; i < 30; i++) {
        await wait(200);
        const q = MQ.battle.current();
        if (q && q.type === 'write') { say('write question shown'); return; }
        answerViaUI(true); await wait(3400);
      }
      return;
    }
    if (mode === 'boss') {
      fresh();
      MQ.ui.battle.start('sansu3-6');
      await wait(400);
      await playBattle('boss', { stopAtBoss: true });
      await wait(2200);
      return;
    }
    if (mode === 'last') {
      fresh({ frags: { sansu: true, kokugo: true, rikashakai: true, eigo: true } });
      MQ.ui.battle.start('tower3');
      await wait(3200);
      say('tower: ' + (MQ.battle.current() ? MQ.battle.current().unit : 'none'));
      return;
    }
    if (mode === 'result' || mode === 'result2' || mode === 'result3') {
      // #result  … ボスを たおして レベルアップも する にぎやかな ケース
      // #result2 … ボスに にげられて ★0 の さみしい ケース
      fresh();
      MQ.save.update(function (pl) {
        // つぎの 1戦で かならず レベルアップ するように、あと 40 で 上がる XP に する
        let xp = pl.xp;
        while (MQ.hero.progress(xp).need - MQ.hero.progress(xp).into > 40) xp++;
        pl.xp = xp;
      });
      MQ.ui.battle.start(mode === 'result3' ? 'sansu3-4' : 'sansu3-6');   // result3 … つぎの ステージが ある
      await wait(400);
      if (mode === 'result2') {
        let g = 0;
        while (!MQ.battle.isOver() && g++ < 60) { answerViaUI(false); await wait(60); if (MQ.battle.isRetry()) { answerViaUI(false); await wait(60); } await wait(3300); }
      } else {
        await playBattle('result');
      }
      await wait(800);
      say('result: ' + ($('.rs') ? 'ok' : 'MISSING') + ' / ボス: ' + ($('.rs__boss') ? 'ok' : 'MISSING'));
      return;
    }

    /* ---- #flow: ぜんぶ 通す ---- */
    fresh();
    say('--- タイトル ---');
    MQ.ui.start.render(); MQ.ui.show('screen-start');
    await wait(300);
    say('logo: ' + ($('.title__logo') ? 'ok' : 'MISSING'));

    say('--- マップ ---');
    MQ.ui.goMap();
    await wait(400);
    say('nodes: ' + $$('#screen-map .node').length + ' / tower: ' + ($('#screen-map .tower') ? 'ok' : 'MISSING'));

    say('--- 算数バトル（1問 わざと まちがえる） ---');
    MQ.ui.battle.start('sansu3-6');
    await wait(400);
    // どうぐを 1つ 使ってから たたかう
    say('bagbtn: ' + ($('.bagbtn') && !$('.bagbtn').hidden ? 'ok' : 'MISSING'));
    MQ.ui.battle.openBag();
    await wait(100);
    const bi = $('.bagrow__use');
    say('bag items: ' + $$('.bagrow').length + (bi ? ' → use ' + bi.closest('.bagrow').querySelector('.bagrow__pw').textContent : ' MISSING'));
    if (bi) bi.click();
    await wait(1200);
    await playBattle('sansu', { missFirst: true });
    await wait(700);
    say('result: ' + ($('#screen-result .rs__title') ? $('#screen-result .rs__title').textContent : 'MISSING'));

    say('--- 国語（かん字を 書く） ---');
    MQ.ui.battle.start('kokugo3-2');
    await wait(400);
    await playBattle('kokugo2');
    await wait(700);

    say('--- ローマ字 ---');
    MQ.ui.battle.start('kokugo3-5');
    await wait(400);
    await playBattle('romaji');
    await wait(700);

    say('--- とっくん ---');
    MQ.save.update(function (p) {
      MQ.save.addEscaped(p, 'sansu', { key: 'x1', q: { id: 'x1', type: 'number', prompt: '2×3は？', answer: 6, unit: 'テスト' }, enemyId: 'slime-green', areaId: 'sansu', stageId: 'sansu3-1' });
    });
    MQ.ui.battle.startTokkun();
    await wait(400);
    await playBattle('tokkun');
    await wait(700);

    say('--- さいごの塔 ---');
    MQ.save.update(function (p) { p.frags = { sansu: true, kokugo: true, rikashakai: true, eigo: true }; });
    MQ.ui.battle.start('tower3');
    await wait(3200);
    await playBattle('tower');
    await wait(900);
    const p = MQ.save.current();
    say('たからもの: ' + MQ.treasure.countOwned(p) + ' / ' + MQ.treasure.total());
    say('でんせつ: ' + p.gear.filter(function (g) { return MQ.hero.isDensetsu(g); }).length + ' / 5');
    say('しょうごう: ' + MQ.hero.titleName(p));

    say('--- 図かん ---');
    ['hero', 'treasure', 'mons', 'parent', 'set'].forEach(function (t) {
      MQ.ui.dex.render(t);
      say('dex ' + t + ': ' + ($('#screen-dex .wrap') ? 'ok' : 'MISSING'));
    });
    MQ.ui.photo.render();
    say('photo: ' + ($('.photo__stage') ? 'ok' : 'MISSING'));

    say('=== エラー: ' + L.filter(function (t) { return t.indexOf('ERROR') === 0 || t.indexOf('MISSING') >= 0; }).length + ' ===');
    dump();
  }

  run().then(dump, function (e) { say('THROW ' + e); dump(); });
  setInterval(dump, 500);
})();
</script>
</body>
</html>
