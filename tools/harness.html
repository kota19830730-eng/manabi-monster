<!--
  画面の 通しテスト／スクリーンショット用。
  パスは 相対（../）なので フォルダを 動かしても そのまま 使えます。

  ハッシュで モードを えらぶ：
    #start   タイトル
    #maker   なまえ・見た目えらび
    #look    すがたを かえる（あとから）
    #map     マップ（#map:600 で その いちまで／#map:-1 で いちばん下）
    #battle  たたかい（1問目で 止める）
    #note    正解の ふきだし（長い 補足つき）
    #fx:fire #fx:bolt #fx:star  ひっさつわざの エフェクト
    #graph   ぼうグラフの 問題（カードが 高い ケース）
    #boss    ボス戦で 止める
    #last    さいごの塔（ラスボス）で 止める
    #roma    ローマ字の「うつ」問題で 止める
    #write   かん字を「書く」問題で 止める
    #result  けっか画面（ボス討伐＋レベルアップ）／#result2 にげられて ★0
    #dex     図かん（主人公）
    #treasure たからばこ
    #parent  おうちの人ページ
    #flow    ぜんぶ 自動で 通す（ログを #log に 出す）
    #map4 #battle4:N #figs4 #treasure4 #parent4 … 小4ワールド（v4.4・算数 15ステージ）
    #kokugo4 #koku4:N … 小4 国語（v4.5・かん字 219字＋ことば。N=1〜4）
    #rika4:N #shakai4:N #eigo4:N … 小4 理科・社会・英語（v4.6/v4.7・N=1〜4）
    #last4 #last4map … 小4の さいごの塔（v4.8・ダークロード）
    #zu #chizu … 問題の 図（v4.9・地図記号・方位・じしゃく・回路・月）／地図と方位の バトル

  例:
  chrome --headless=new --disable-gpu --virtual-time-budget=400000 \
    --dump-dom "file:///.../tools/harness.html#flow"
  画像は --screenshot=x.png --window-size=520,1000 --hide-scrollbars
-->

<script>
(function () {
  const L = window.__log;
  const mode = (location.hash || '#flow').slice(1);
  const $ = function (s, root) { return (root || document).querySelector(s); };
  const $$ = function (s, root) { return Array.prototype.slice.call((root || document).querySelectorAll(s)); };
  function say(t) { L.push(t); }
  function dump() { document.getElementById('log').textContent = L.join('\n'); }

  // 音は 切っておく（headless では 鳴らない）
  MQ.stage.fit();
  MQ.save.load();
  MQ.save.setSetting('sfx', false);
  MQ.save.setSetting('bgm', false);
  MQ.sfx.setEnabled(false);
  MQ.bgm.setEnabled(false);
  MQ.ui.setTextures();

  /* headless の Chrome には 声が 入って いない ので、にせの 声を 入れる（v5.3）。
     読んだ 中身は window.__spoke に たまる。*/
  function fakeVoices(none) {
    window.__spoke = [];
    const vs = none ? [] : [
      { name: 'Fake US', lang: 'en-US', default: true },
      { name: 'Fake UK', lang: 'en-GB' },
      { name: 'Fake JP', lang: 'ja-JP' }
    ];
    const synth = {
      getVoices: function () { return vs; },
      speak: function (u) {
        window.__spoke.push({ text: u.text, lang: u.lang, rate: u.rate, voice: u.voice && u.voice.name });
        if (typeof u.onend === 'function') setTimeout(u.onend, 30);
      },
      cancel: function () {},
      addEventListener: function () {}
    };
    try { Object.defineProperty(window, 'speechSynthesis', { value: synth, configurable: true }); }
    catch (e) { window.speechSynthesis = synth; }
    // native の Utterance に にせの voice を 入れると TypeError に なる ので、
    // こちらも かならず にせに する
    const U = function (t) { this.text = t; this.lang = ''; this.rate = 1; this.pitch = 1; this.volume = 1; };
    try { Object.defineProperty(window, 'SpeechSynthesisUtterance', { value: U, configurable: true }); }
    catch (e) { window.SpeechSynthesisUtterance = U; }
    if (MQ.speech) MQ.speech.refresh();
  }

  function fresh(opts) {
    opts = opts || {};
    try { localStorage.clear(); } catch (e) {}
    MQ.save.load();
    MQ.save.setSetting('sfx', false);
    MQ.save.setSetting('bgm', false);
    const p = MQ.save.createPlayer('こうた', { hair: 'gold', skin: 'mid', style: 'short' });
    MQ.save.update(function (pl) {
      pl.xp = opts.xp != null ? opts.xp : 1400;
      MQ.hero.gear.forEach(function (g) {
        if (opts.allGear || (!MQ.hero.isDensetsu(g.id) && g.gradeNo <= (opts.grade || 3))) {
          pl.gear.push(g.id);
          pl.equipped[g.slot] = g.id;
        }
      });
      pl.stars = opts.stars || { 'sansu3-1': 3, 'sansu3-2': 3, 'sansu3-3': 2, 'sansu3-4': 2, 'kokugo3-1': 3, 'kokugo3-2': 2, 'rikashakai3-1': 2, 'eigo3-1': 1 };
      pl.best = { 'sansu3-6': { correct: 8, total: 12, time: 260 } };
      pl.treasure = opts.treasure || { 'tr-kake': 2, 'tr-wari': 2, 'tr-jikoku': 1, 'tr-yomi': 1 };
      pl.frags = opts.frags || { sansu: true, kokugo: true };
      pl.coins = 7;
      pl.bag = Object.keys(pl.treasure).slice(0, 3);   // もちもの（どうぐ）
      // ずかんの 見た目を たしかめられるように、さいしょの 20体ぐらいは 見つけた ことに する
      pl.dex = {};
      MQ.enemies.list.slice(0, 20).forEach(function (e, i) { pl.dex[e.id] = 3 + (i % 4); });
      ['skullhorse', 'zukan', 'boss-dragon'].forEach(function (id) { pl.dex[id] = 1; });
      pl.dexNew = { 'slime-green': true, 'robot-gray': true };
      pl.battles = 12; pl.defeated = 96;
      MQ.hero.checkTitles(pl);
      pl.title = 't-ryu';
      MQ.save.addLog(pl, 'あまりのあるわり算：8/12　★2　4:20');
      MQ.save.addLog(pl, 'かけ算のきまり：12/12　★3　3:41');
    });
    MQ.ui.syncCustom();
    return p;
  }

  function correctValue(q) {
    if (q.type === 'number') return q.answer;
    if (q.type === 'choice') return q.answer;
    if (q.type === 'roma') return q.answer;
    if (q.type === 'write') return true;
    return { q: q.answer.q, r: q.answer.r };
  }
  function wrongValue(q) {
    if (q.type === 'number') return q.answer + 1;
    if (q.type === 'choice') return (q.answer + 1) % q.choices.length;
    if (q.type === 'roma') return 'zzz';
    if (q.type === 'write') return false;
    return { q: q.answer.q + 1, r: q.answer.r };
  }

  // 画面の ボタンを 押して 答える（UIも まとめて ためす）
  function answerViaUI(good) {
    const q = MQ.battle.current();
    if (!q) return false;
    if (q.type === 'choice') {
      const btns = $$('#screen-battle .choice');
      const want = good ? q.answer : (q.answer + 1) % q.choices.length;
      if (!btns[want]) { say('NO CHOICE BUTTONS'); return false; }
      btns[want].click();
      return true;
    }
    if (q.type === 'write') {
      const keys = $$('#screen-battle .keys--write .key');
      if (!keys.length) { say('NO WRITE BUTTON'); return false; }
      // v2.9：字を かいてから「かけた！」（正しい字は フォントで・まちがいは なぐりがき）。まよった ときだけ ◯／✕
      memoCanvasDraw(function (ctx, w, hh) {
        if (good) drawKanjiLike(ctx, q.answer, { w: w, h: hh, size: Math.min(hh * 0.8, 170, w * 0.85 / q.answer.length), rot: 2, wave: 2 });
        else drawJunk(ctx, 'scribble', w, hh);
      });
      keys[0].click();                       // 「かけた！」
      const k2 = $$('#screen-battle .keys--write .key');
      if (k2.length >= 2) (good ? k2[0] : k2[1]).click();   // ◯ おなじに かけた ／ ✕ ちがった
      return true;
    }
    const keys = $$('#screen-battle .key');
    if (!keys.length) { say('NO KEYS for ' + q.type); return false; }
    function press(label) {
      const b = keys.filter(function (k) { return k.textContent === label; })[0];
      if (b) b.click(); else say('NO KEY ' + label);
    }
    if (q.type === 'roma') {
      String(good ? q.answer : 'zzz').split('').forEach(press);
      press('こたえる');
      return true;
    }
    if (q.type === 'divrem') {
      String(good ? q.answer.q : q.answer.q + 1).split('').forEach(press);
      press('こたえる');
      String(q.answer.r).split('').forEach(press);
      press('こたえる');
      return true;
    }
    String(good ? q.answer : q.answer + 1).split('').forEach(press);
    press('こたえる');
    return true;
  }

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /* いま 画面に 出ている 一瞬（ふきだし・ひっさつの エフェクト）を
     スクリーンショットに のこす ため、これいじょう タイマーを 進めない。 */
  function freeze() { window.setTimeout = function () { return 0; }; }
  function fakeDrawing() {
    const W = 900, H = 1200;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(380, 480, 80, 450, 600, 900);
    g.addColorStop(0, '#f7f4ec'); g.addColorStop(1, '#c9c4b6');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    for (let i = 0; i < 6000; i++) { x.fillStyle = 'rgba(0,0,0,' + (Math.random() * 0.06) + ')'; x.fillRect(Math.random() * W, Math.random() * H, 2, 2); }
    x.fillStyle = '#6f6a60'; x.fillRect(0, 1130, W, 70);   // つくえの ふち
    const d = document.createElement('canvas'); d.width = W; d.height = H;
    const y = d.getContext('2d');
    y.lineJoin = 'round'; y.lineCap = 'round';
    function blob(cx, cy, rx, ry, fill) { y.beginPath(); y.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); y.fillStyle = fill; y.fill(); y.lineWidth = 3.2; y.strokeStyle = '#2a2622'; y.stroke(); }
    blob(450, 620, 210, 190, 'rgba(242,162,58,.85)');   // 体（オレンジの マーカー）
    y.fillStyle = 'rgba(255,200,120,.5)'; for (let i = 0; i < 40; i++) y.fillRect(300 + Math.random() * 300, 480 + Math.random() * 280, 30, 6);
    [[300, 440], [400, 400], [500, 400], [600, 440]].forEach(function (p) { y.beginPath(); y.moveTo(p[0] - 30, p[1] + 20); y.lineTo(p[0], p[1] - 90); y.lineTo(p[0] + 30, p[1] + 20); y.closePath(); y.fillStyle = 'rgba(76,175,80,.9)'; y.fill(); y.lineWidth = 3; y.strokeStyle = '#2a2622'; y.stroke(); });
    blob(380, 590, 38, 42, '#fbfbf7'); blob(520, 590, 38, 42, '#fbfbf7');
    y.fillStyle = '#1e1c1a'; y.beginPath(); y.arc(388, 598, 14, 0, 7); y.fill(); y.beginPath(); y.arc(528, 598, 14, 0, 7); y.fill();
    y.beginPath(); y.moveTo(380, 690); y.quadraticCurveTo(450, 760, 520, 690); y.lineWidth = 4; y.strokeStyle = '#c2322d'; y.stroke();
    for (let i = 0; i < 4; i++) { y.beginPath(); y.moveTo(395 + i * 36, 700 + (i % 2) * 6); y.lineTo(413 + i * 36, 728); y.lineTo(431 + i * 36, 700 + (i % 2) * 6); y.closePath(); y.fillStyle = '#fff'; y.fill(); y.lineWidth = 1.5; y.strokeStyle = '#2a2622'; y.stroke(); }
    [[360, 800], [520, 800]].forEach(function (p) { y.fillStyle = 'rgba(63,127,214,.9)'; y.fillRect(p[0], p[1], 60, 110); y.lineWidth = 3; y.strokeStyle = '#2a2622'; y.strokeRect(p[0], p[1], 60, 110); });
    y.beginPath(); y.moveTo(650, 640); y.bezierCurveTo(760, 600, 780, 720, 700, 760); y.lineWidth = 1.6; y.strokeStyle = '#4a4540'; y.stroke();   // えんぴつの 細い しっぽ
    y.lineWidth = 1.2; y.strokeStyle = '#7a746c'; y.beginPath(); y.moveTo(230, 950); y.lineTo(300, 990); y.lineTo(250, 1010); y.stroke();   // よこの らくがき（小さい）
    try { x.filter = 'blur(0.9px)'; } catch (e) {}
    x.drawImage(d, 0, 0);
    return c.toDataURL('image/jpeg', 0.82);
  }

  /* v5.7：「わくを かいて まわりを ぬった 絵」（息子さんの コウモリ）に 見せかけた 画像。
     えんぴつの わく（上が まるい）→ 中を オレンジの 色えんぴつで ぬる → まん中に えんぴつで ぬった コウモリ
     （頭は うすい 灰色・とがった 耳・ギザギザの 歯）→ 上に 黄色い 月・下に 黄色い 光の 四角（とびらの ような たての 線つき）
     → はねを 横切る 地面の 線。#photo2b で つかう */
  function fakeDrawing2() {
    const W = 900, H = 1200;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(300, 300, 100, 450, 600, 1000);
    g.addColorStop(0, '#f3efe6'); g.addColorStop(1, '#cbc5b8');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    for (let i = 0; i < 6000; i++) { x.fillStyle = 'rgba(0,0,0,' + (Math.random() * 0.06) + ')'; x.fillRect(Math.random() * W, Math.random() * H, 2, 2); }
    x.fillStyle = '#5a4a3a'; x.fillRect(0, 1120, W, 80);   // つくえ
    const d = document.createElement('canvas'); d.width = W; d.height = H;
    const y = d.getContext('2d');
    y.lineJoin = 'round'; y.lineCap = 'round';
    // わく（左上が まるい）
    y.beginPath(); y.moveTo(230, 900); y.lineTo(210, 420); y.quadraticCurveTo(220, 250, 400, 250); y.lineTo(680, 260); y.lineTo(700, 900); y.lineTo(240, 910); y.closePath();
    y.lineWidth = 3.4; y.strokeStyle = '#3a3634'; y.stroke();
    // オレンジの ぬり（すじの ある 色えんぴつ）
    y.save(); y.clip();
    y.strokeStyle = 'rgba(226,150,95,.55)'; y.lineWidth = 3;
    for (let i = 0; i < 900; i++) { const px = 215 + Math.random() * 480, py = 255 + Math.random() * 650; const a = Math.random() * Math.PI; y.beginPath(); y.moveTo(px, py); y.lineTo(px + Math.cos(a) * 28, py + Math.sin(a) * 28); y.stroke(); }
    y.restore();
    // とびらの たての 線 と 黄色い 月・光
    y.strokeStyle = '#3a3634'; y.lineWidth = 3; y.strokeRect(390, 340, 120, 460);
    y.strokeStyle = 'rgba(240,215,60,.8)'; y.lineWidth = 4;
    for (let i = 0; i < 60; i++) { const px = 400 + Math.random() * 100, py = 350 + Math.random() * 60; y.beginPath(); y.moveTo(px, py); y.lineTo(px + 20 - Math.random() * 40, py + 8); y.stroke(); }
    for (let i = 0; i < 80; i++) { const px = 400 + Math.random() * 100, py = 690 + Math.random() * 100; y.beginPath(); y.moveTo(px, py); y.lineTo(px + 20 - Math.random() * 40, py + 8); y.stroke(); }
    // コウモリ：はね（えんぴつで ぬりつぶし＋すじ）
    function wing(sign) {
      y.beginPath(); y.moveTo(450, 560);
      y.lineTo(450 + sign * 150, 480); y.lineTo(450 + sign * 190, 650); y.lineTo(450 + sign * 150, 640); y.lineTo(450 + sign * 130, 690); y.lineTo(450 + sign * 90, 660); y.lineTo(450 + sign * 60, 700); y.lineTo(450 + sign * 30, 660); y.closePath();
      y.fillStyle = 'rgba(60,58,56,.78)'; y.fill(); y.lineWidth = 3; y.strokeStyle = '#2e2a28'; y.stroke();
      y.strokeStyle = 'rgba(30,28,26,.5)'; y.lineWidth = 2;
      for (let i = 0; i < 40; i++) { const px = 450 + sign * (20 + Math.random() * 150), py = 500 + Math.random() * 180; y.beginPath(); y.moveTo(px, py); y.lineTo(px + 6, py + 26); y.stroke(); }
    }
    wing(-1); wing(1);
    // 体
    y.beginPath(); y.ellipse(450, 610, 45, 60, 0, 0, Math.PI * 2); y.fillStyle = 'rgba(70,68,66,.85)'; y.fill(); y.lineWidth = 3; y.strokeStyle = '#2e2a28'; y.stroke();
    // 耳 と 頭（うすい 灰色）
    [[415, 470], [485, 470]].forEach(function (p, i) { y.beginPath(); y.moveTo(p[0] - 18, p[1] + 30); y.lineTo(p[0] + (i ? 10 : -10), p[1] - 60); y.lineTo(p[0] + 18, p[1] + 30); y.closePath(); y.fillStyle = 'rgba(160,158,156,.5)'; y.fill(); y.lineWidth = 3; y.strokeStyle = '#2e2a28'; y.stroke(); });
    y.beginPath(); y.ellipse(450, 520, 58, 52, 0, 0, Math.PI * 2); y.fillStyle = 'rgba(175,173,170,.55)'; y.fill(); y.lineWidth = 3.4; y.strokeStyle = '#2e2a28'; y.stroke();
    // 目（V）と ギザギザの 口
    y.beginPath(); y.moveTo(420, 505); y.lineTo(436, 520); y.lineTo(450, 505); y.lineTo(464, 520); y.lineTo(480, 505); y.lineWidth = 2.6; y.stroke();
    y.beginPath(); y.moveTo(408, 540); for (let i = 0; i < 6; i++) { y.lineTo(415 + i * 14, i % 2 ? 540 : 562); } y.lineTo(492, 540); y.closePath(); y.fillStyle = '#f2f0ec'; y.fill(); y.lineWidth = 2.4; y.stroke();
    // 地面の 線（はねを 横切って わくから わくまで）
    y.beginPath(); y.moveTo(232, 662); y.lineTo(690, 655); y.lineWidth = 2.8; y.strokeStyle = '#3a3634'; y.stroke();
    try { x.filter = 'blur(0.8px)'; } catch (e) {}
    x.drawImage(d, 0, 0);
    return c.toDataURL('image/jpeg', 0.82);
  }

  /* AIが かえしそうな 絵（太い 線・ベタ塗り・白い 背景）。#ai の にせの こたえ */
  function fakeAiArt() {
    const S = 1024;
    const c = document.createElement('canvas'); c.width = S; c.height = S;

    // ドット絵エディタ（v2.9）：#pixedit = 写真 → 直す を 開いて ペン・ぬる・けしゴム・もどす・ゆび2本／#pixedit:zoom = ×4 で 拡大／#pixedit:blank = まっしろから／#pixedit:mine = つくった モンスターを 直す
    if (mode.indexOf('pixedit') === 0) {

      const N = T.state().N;
      say('pixedit open: N=' + N + ' swatches=' + document.querySelectorAll('.pixed__sw').length + ' view=' + $('.pixed__view').style.width);
      const view = T.view; const r = view.getBoundingClientRect();
      function pe(type, x, y, id) { view.dispatchEvent(new PointerEvent(type, { pointerId: id || 1, pointerType: 'touch', isPrimary: !id || id === 1, clientX: r.left + x, clientY: r.top + y, bubbles: true, cancelable: true })); }

      T.color([255, 0, 0]);

      const c1 = cellOf(0.5, 0.5);
      { let reds = []; for (let yy = 0; yy < N; yy++) for (let xx = 0; xx < N; xx++) { const p = T.pixel(xx, yy); if (p[0] === 255 && p[1] === 0 && p[2] === 0) reds.push(xx + ',' + yy); } say('pixedit reds: ' + reds.length + (reds.length >= 40 ? ' ok' : ' TOO FEW') + ' ' + reds.slice(0, 6).join(' ')); }

    // かん字の はんてい（v2.9）の 校正：#judge（おてほん＝端末の 教科書体）／#judge:gothic（おてほんを ゴシックに して 書体の ずれを 大きく）
    if (mode.indexOf('judge') === 0) {

      const list = [];
      MQ.kokugo1.kanji.forEach(function (k) { list.push({ k: k.k, r: k.r }); });

      const pickEvery = Math.max(1, Math.floor(list.length / 48));
      const K = list.filter(function (x, i) { return i % pickEvery === 0; }).slice(0, 48);
      const FONTS = gothic ? ["'UD Digi Kyokasho N'", "'HGKyokashotai'", "'Yu Mincho'", "'BIZ UDMincho Medium'"] : ["'HGKyokashotai'", "'Yu Mincho'", "'BIZ UDMincho Medium'", "'Noto Serif JP'", "'Yu Gothic'"];
      const W = 360, Hh = 240;

        for (let s = 0; s < 2; s++) { const o = K[(i + 7 + s * 11) % K.length]; run('other', it.k, like(o.k)); }

        run('mirror', it.k, like(it.k, { mirror: true }));
        ['scribble', 'line', 'blob', 'zig', 'circle', 'lines'].forEach(function (kd) { run(kd, it.k, function (ctx) { drawJunk(ctx, kd, W, Hh); }); });
      });
      function q(arr, p) { const a = arr.slice().sort(function (x, y) { return x - y; }); return a.length ? a[Math.min(a.length - 1, Math.floor(a.length * p))].toFixed(2) : '-'; }

    // かん字を 書く 画面（v2.9）：#write2 = 正しい字（教科書体・少し かたむけ）→ 自動で ○／#write3 = なぐりがき → ×＋おてほん／

    // ひっさつわざの エフェクト（v2.5）：#fx:<わざ>[:<秒>]  わざ＝fire leaf ice wind bolt star nova、秒＝何秒めで 止めて 撮るか（0.3）
    if (mode.indexOf('fx') === 0) {

      // アニメを at 秒めで 止めて 撮る（delay も ふくめた 本当の 時間）

    // どうぐ（v2.0）：#bag＝シートを 開いた ところ／#bagfx:<power>＝使った ときの 演出
    //                 #bagguard＝たてが まもった ところ／#bagdex＝ずかんの もちもの
    const ITEM_OF = { burst: 'tr-wari', shield: 'tr-ookii', freeze: 'tr-jikoku', guide: 'tr-hissan', golden: 'tr-graph', chest: 'tr-amari', power: 'tr-kake', charge: 'tr-omosa',
      bond: 'tr-nagasa', rush: 'tr-kaki', find: 'tr-chizu', swift: 'tr-mushi', elixir: 'tr-iro' };   // v5.4
    if (mode === 'bag' || mode === 'bag2' || mode.indexOf('bagfx') === 0 || mode === 'bagguard' || mode === 'bagre') {
      const want = mode.split(':')[1] || 'burst';
      fresh({ treasure: { 'tr-wari': 2, 'tr-ookii': 1, 'tr-graph': 1, 'tr-jikoku': 1, 'tr-hissan': 2, 'tr-amari': 1, 'tr-kake': 1, 'tr-omosa': 1,
        'tr-nagasa': 1, 'tr-kaki': 2, 'tr-chizu': 1, 'tr-mushi': 1, 'tr-iro': 2 } });   // v5.4 の 5つも
      MQ.save.update(function (pl) {
        pl.bag = mode === 'bag' ? ['tr-wari', 'tr-ookii', 'tr-graph']
          : mode === 'bag2' ? ['tr-nagasa', 'tr-kaki', 'tr-iro']

        if (mode === 'bag2' || want === 'bond' || want === 'elixir') {

      });

        document.head.appendChild(st);

      if (mode === 'bag' || mode === 'bag2') { MQ.ui.battle.openBag(); say(mode + ': ' + $$('.bagrow').length + ' items'); return; }
      if (mode === 'bagre') {
        // つかいおわった アイテムに「もう1回」（コイン2まい）が 出る ところ

    // メモ欄に ゆびで 書く（v2.7.1）：#memo ふつう／#memo2 ひろげた あと／#memo3 ひろげて もどした あと
    if (mode.indexOf('memo') === 0) {
      const memoRect = mode.indexOf(':rect') > 0;   // #memo:rect＝赤い 四角も 描く（headless で canvas が 写るか）
      const mm = mode.split(':')[0];

      if (mm !== 'memo') { $('.memo__btn').click(); await wait(120); }
      if (mm === 'memo3') { $('.memo__btn').click(); await wait(120); }
      const cv = $('.memo__canvas'); const r = cv.getBoundingClientRect();
      function pe(type, x, y) { cv.dispatchEvent(new PointerEvent(type, { pointerId: 1, pointerType: 'touch', isPrimary: true, clientX: r.left + x, clientY: r.top + y, bubbles: true, cancelable: true })); }
      // 「2」のような 線を 書く

      say('memo: inked ' + inked + '/' + pts.length + ' bitmap=' + cv.width + 'x' + cv.height + ' rect=' + Math.round(r.width) + 'x' + Math.round(r.height) + ' scale=' + MQ.stage.size().scale.toFixed(2));
      // 少し あとでも 線が のこっているか（大きさ合わせで 消えていないか）。結果は ふきだしにも 出す（スクショで 見える）
      await wait(400);
      let inked2 = 0;
      pts.forEach(function (p) { const dd = cx.getImageData(Math.round(r.width * p[0] * cv.width / r.width), Math.round(r.height * p[1] * cv.height / r.height), 1, 1).data; if (dd[3] > 0) inked2++; });
      say('memo after: inked ' + inked2 + '/' + pts.length + ' bitmap=' + cv.width + 'x' + cv.height);
      $('.arena__msg').textContent = 'memo ' + inked + '→' + inked2 + ' / ' + cv.width + 'x' + cv.height;
      if (memoRect) {
        /* headless Chrome（virtual-time）では、あとから 描いた canvas の 中身が スクショに 写らない（新しく 作った canvas でも 同じ）。
           そこで ビットマップの 写し（img・緑わく）を おいて、線が どう 書けたかを 目で 見られる ように する。線の 有無は 上の inked で 検査ずみ。 */
        cx.save(); cx.setTransform(1, 0, 0, 1, 0, 0); cx.fillStyle = '#e8443a'; cx.fillRect(10, 10, 140, 60); cx.restore();

        cv.parentNode.appendChild(im);
      }
      dump();
      return;

    /* ゆびで 書く（v5.5 で 入力を 作り直した）。実機に 近い かたちで しらべる：
         #touchmemo  … ほんものの touch イベントで ひっさんの メモに 書く
         #touchwrite … かん字を 書く 問題を touch で 書いて「かけた！」まで

    if (mode === 'touchmemo' || mode === 'touchwrite' || mode === 'stuck' || mode === 'cancel') {
      if (mode === 'touchwrite') {
        fresh();

      }
      const cv = $('.memo__canvas'); const r = cv.getBoundingClientRect();
      const cx2 = cv.getContext('2d');
      function inkAt(fx, fy) {
        const d2 = cx2.getImageData(Math.round(r.width * fx * cv.width / r.width), Math.round(r.height * fy * cv.height / r.height), 1, 1).data;

      }

      if (mode === 'touchmemo' || mode === 'touchwrite') {

        strokeTouch(13, [[0.25, 0.75], [0.7, 0.75]]);        // よこ
        const pts = [[0.3, 0.2], [0.6, 0.2], [0.45, 0.4], [0.45, 0.7], [0.3, 0.75], [0.6, 0.75]];
        let inked = 0; pts.forEach(function (p) { if (inkAt(p[0], p[1])) inked++; });
        const st = MQ.ui.battle.memoTest ? MQ.ui.battle.memoTest() : null;
        say(mode + ': inked ' + inked + '/' + pts.length + ' strokes=' + MQ.ui.battle.memoStrokes() + ' ' + JSON.stringify(st));
        $('.arena__msg').textContent = mode + ' ' + inked + '/' + pts.length;
        if (mode === 'touchwrite') {

        }
        dump();
        return;
      }

      if (mode === 'stuck') {
        // ① 1画め：pointerup が 来ないまま おわる（実機で 起きる）
        pev('pointerdown', 1, 0.2, 0.3);
        pev('pointermove', 1, 0.6, 0.3);

        pev('pointermove', 2, 0.6, 0.6);
        const a2 = inkAt(0.4, 0.6);
        // ③ しばらく たってから もう一度（前の 指は もう いない → 引きつぐ）

        const a3 = inkAt(0.4, 0.8);
        say('stuck: 1画め=' + a1 + ' すぐの2本目=' + a2 + ' 時間が たってから=' + a3 + ' （1画めと 3つめが true なら OK）');
        $('.arena__msg').textContent = 'stuck ' + a1 + '/' + a2 + '/' + a3;

        tev('touchmove', 21, 0.7, 0.4);

    /* 問題が 切れて いないか（v5.6）。
       たて700の 端末（＝タブレット。よこが 広いので scale が 高さで 決まり stage-h が 700に なる）で
       問題カードから 中身が はみ出して いないかを、いろいろな ステージで 見る。
       #fit（小3ちゅうしん）／#fit:all（小1〜小4）  */
    // #fitdbg … 1問の カードの 中身の 高さを ぜんぶ 出す（はみ出しの 犯人さがし）
    if (mode.indexOf('fitdbg') === 0) {
      const id = mode.split(':')[1] || 'sansu1-8';
      const g = Number(mode.split(':')[2] || (id.indexOf('sansu1') === 0 ? 1 : 3));
      fresh({ stars: {}, treasure: {}, frags: {} });
      MQ.save.update(function (pl) { pl.grade = g; pl.playGrade = g; pl.best = {}; });
      MQ.ui.battle.start(id); await wait(400);
      function dumpCard(when) {
        const card = $('.card'), body = $('.battle__body');
        const parts = [];
        Array.prototype.forEach.call(card.children, function (el) {
          const cs = getComputedStyle(el);
          parts.push(el.className + '=' + el.offsetHeight + '@' + el.offsetTop + '(m' + cs.marginTop + '/' + cs.marginBottom + ' d' + cs.display + ')');
        });
        parts.push('cardpad=' + getComputedStyle(card).paddingTop + '/' + getComputedStyle(card).paddingBottom);
        const cb = $('.clockbox'), cq = $('.clockq');
        say(when + ': card ' + card.clientHeight + '←' + card.scrollHeight + ' figk=' + (card.style.getPropertyValue('--figk') || '-')
          + ' body ' + body.clientHeight + '←' + body.scrollHeight
          + ' | ' + parts.join(' ')
          + (cq ? ' | clockq=' + Math.round(cq.getBoundingClientRect().height / MQ.stage.size().scale) : '')
          + (cb ? ' clockbox=' + Math.round(cb.getBoundingClientRect().height / MQ.stage.size().scale) + ' cs=' + getComputedStyle(cb).getPropertyValue('--cs') : ''));
      }
      dumpCard('ふつう');
      answerViaUI(false); await wait(1200);
      dumpCard('ヒント');
      dump();
      return;
    }
    if (mode === 'fit' || mode === 'fit:all') {
      const STAGES = mode === 'fit:all'
        ? [[3, 'sansu3-5'], [3, 'sansu3-6'], [3, 'sansu3-9'], [3, 'sansu3-11'], [3, 'sansu3-12'], [3, 'sansu3-16'], [3, 'sansu3-18'], [3, 'kokugo3-2'], [3, 'kokugo3-3'], [3, 'rikashakai3-1'], [3, 'eigo3-1'],
           [1, 'sansu1-8'], [2, 'sansu2-2'], [2, 'sansu2-9'], [4, 'sansu4-2'], [4, 'sansu4-7'], [4, 'sansu4-11'], [4, 'sansu4-15']]
        : [[3, 'sansu3-5'], [3, 'sansu3-6'], [3, 'sansu3-9'], [3, 'kokugo3-2'], [3, 'eigo3-1']];
      let worst = 0, worstQ = "", checked = 0, bad = 0, badCard = 0, badBody = 0;
      // カードから 問題文が はみ出して いないか ＋ キーや ヒントが 下で 切れて いないか
      function measure(id, q, when) {
        const card = $('.card'), body = $('.battle__body');
        if (!card || card.hidden || !body) return;
        const oc = card.scrollHeight - card.clientHeight;
        const ob = body.scrollHeight - body.clientHeight;
        const over = Math.max(oc, ob);
        checked++;
        if (over > 1) {
          bad++;
          if (oc > 1) badCard++;
          if (ob > 1) badBody++;
          if (over > worst) {
            worst = over;
            const pr = $('.card__q');
            worstQ = id + '（' + when + '・カード' + oc + '/ぜんたい' + ob + '）/ ' + (MQ.util.stripTags(q.prompt) || '').slice(0, 20)
              + ' [card ' + card.clientHeight + '←' + card.scrollHeight + ' figk=' + (card.style.getPropertyValue('--figk') || '?')
              + ' cls=' + (pr ? pr.className : '?') + ' type=' + q.type + ']';
          }
        }
      }
      for (let si = 0; si < STAGES.length; si++) {
        const g = STAGES[si][0], id = STAGES[si][1];
        fresh({ stars: {}, treasure: {}, frags: {} });
        MQ.save.update(function (pl) { pl.grade = g; pl.playGrade = g; pl.best = {}; });
        MQ.ui.battle.start(id);
        await wait(400);
        for (let k = 0; k < 8; k++) {
          const q = MQ.battle.current();
          if (!q) break;
          measure(id, q, 'ふつう');
          // 1回 まちがえて ヒントを 出した ところも 見る（いちばん せまい）
          if (k % 2 === 1 && q.type !== 'write') {
            answerViaUI(false);
            await wait(1200);
            measure(id, q, 'ヒント');
          }
          if (!answerViaUI(true)) break;
          await wait(2600);
        }
      }
      say('fit: しらべた ' + checked + '回 / はみ出し ' + bad + '回（カード ' + badCard + ' ぜんたい ' + badBody + '）' + (bad ? '（さいだい ' + worst + 'px：' + worstQ + '）' : ' → OK'));
      dump();
      return;
    }
    // メモを ひろげる（v2.4.1）：#wide 小2 ひっさん／#wide3 小3 わりざん
    if (mode === 'wide' || mode === 'wide3') {
      if (mode === 'wide') {
        fresh({ stars: { 'sansu2-1': 3 }, treasure: {}, frags: {} });
        MQ.save.update(function (pl) { pl.grade = 2; pl.playGrade = 2; pl.best = {}; });
        MQ.ui.battle.start('sansu2-2');
      } else { fresh(); MQ.ui.battle.start('sansu3-6'); }
      await wait(600);
      const b = $('.memo__btn'); b.click(); await wait(200);
      const m = $('.memo');
      say('wide: ' + m.classList.contains('memo--wide') + ' memo=' + Math.round(m.getBoundingClientRect().height) + 'px btn=' + b.textContent);
      return;
    }
    if (mode === 'battle') { fresh(); MQ.ui.battle.start('sansu3-6'); await wait(600); return; }
    // きょうの ミッション（v3.1）：#missions = 地図の パネル／#missions:all = ぜんぶ クリア（たたんである）／#missions2 = ミッションを かならず クリアする たたかい → けっか画面
    if (mode.indexOf('missions') === 0) {
      fresh();
      MQ.missions.setNow(new Date(2026, 8, 5));
      if (mode === 'missions:all') {
        MQ.save.update(function (pl) { const ms = MQ.missions.ensure(pl); ms.list.forEach(function (m) { m.done = true; m.count = m.target; }); ms.claimedAll = true; });
      }
      if (mode === 'missions2') {
        // かならず クリアできる 3つに 入れかえて、1回 たたかう
        MQ.save.update(function (pl) {
          pl.missions = { day: MQ.missions.dayKey(), claimedAll: false, list: [
            { id: 'battle', target: 1, count: 0, done: false, text: 'バトルを 1かい する' },
            { id: 'correct', target: 10, count: 0, done: false, text: 'もんだいに 10もん せいかいする' },
            { id: 'boss', target: 1, count: 0, done: false, text: 'ボスを 1たい たおす' }
          ] };
        });
        MQ.ui.battle.start('sansu3-6'); await wait(400);
        await playBattle('missions2');
        await wait(900);
        const p = MQ.save.current();
        say('missions2: done=' + p.missions.list.filter(function (m) { return m.done; }).length + ' claimedAll=' + p.missions.claimedAll + ' coins=' + p.coins + ' missionsDone=' + p.missionsDone + ' line=' + ($('.rs__mission') ? $('.rs__mission').textContent : 'MISSING'));
        dump();
        return;
      }
      MQ.ui.goMap(); await wait(200); MQ.ui.map.paint();
      const p = MQ.save.current();
      say('missions: ' + JSON.stringify(p.missions.list.map(function (m) { return m.id + ':' + m.target; })) + ' panel=' + ($('.missions') ? ($('.missions').classList.contains('is-open') ? 'open' : 'closed') : 'MISSING') + ' rows=' + document.querySelectorAll('.mission').length);
      dump();
      return;
    }
    // リベンジ（v3.1）：#revenge = 2日前に にげた敵が 1体目に もどってくる／#revenge:fresh = きょう にげた敵は もどらない
    if (mode.indexOf('revenge') === 0) {
      fresh();
      const old = mode === 'revenge:fresh' ? new Date() : new Date(Date.now() - 2 * 24 * 3600 * 1000);
      MQ.save.update(function (pl) {
        MQ.save.addEscaped(pl, 'sansu', { key: 'sansu3-6:rev:test', q: { type: 'number', prompt: '<span class="num">7 × 8</span>', answer: 56, unit: 'かけ算', hint: '7のだん', lv: 1 }, enemyId: 'slime-green', stageId: 'sansu3-6', areaId: 'sansu', at: old.toISOString() });
      });
      say('revenge ready: ' + MQ.save.revengeReady(MQ.save.current(), 'sansu').length + ' / escaped ' + MQ.save.countEscaped(MQ.save.current(), 'sansu'));
      MQ.ui.battle.start('sansu3-6'); await wait(600);
      // リベンジの 敵まで 進める（さいしょの 4問の どこかに いる）
      let found = null;
      for (let i = 0; i < 6 && !found; i++) {
        const q = MQ.battle.current();
        if (q && q.revenge) { found = q; break; }
        answerViaUI(true); await wait(3400);
      }
      const q = MQ.battle.current();
      say('revenge q: ' + (q ? q.id + ' revenge=' + !!q.revenge : 'none') + ' msg=' + $('.arena__msg').textContent + ' ribbon=' + !!$('.enemy__ribbon') + ' cls=' + ($('.enemy') ? $('.enemy').className : ''));
      if (found && mode === 'revenge:win') {
        answerViaUI(true); await wait(200);
        say('revenge win: msg=' + $('.arena__msg').textContent);
        freeze();
      }
      dump();
      return;
    }
    // 小3 算数 2学期（v3.0）：#battle3:N で ステージN（7 大きい数・8 長さ・9 円と球・10 筆算・11 小数・12 重さ・13 分数）／#battle3:N:lv で その むずかしさ だけ
    // 3学期（v6.3）：14 □を使った式・15 倍の見方・16 三角形と角・17 かけ算の筆算(2)・18 そろばん
    if (mode.indexOf('battle3') === 0) {
      fresh();
      const parts = mode.split(':');
      const bn = parseInt(parts[1], 10) || 7;
      MQ.ui.battle.start('sansu3-' + bn); await wait(600);
      const q = MQ.battle.current();
      say('battle3: ' + q.id + ' type=' + q.type + ' lv=' + q.lv + ' decimal=' + !!q.decimal + ' keys=' + document.querySelectorAll('#screen-battle .key').length + ' answer=' + JSON.stringify(q.answer));
      dump();
      return;
    }
    // 2学期の 図を ならべて 見る
    if (mode === 'figs3') {
      const F = MQ.sansu3.figs3;
      const box = document.createElement('div');
      box.style.cssText = 'position:absolute;inset:0;background:#FFF8E6;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px;z-index:99;align-content:start;';
      [F.circleSvg('radius', '4cm'), F.circleSvg('diameter', '10cm'), F.circleSvg('chord', ''), F.circleSvg('two', '16cm'), F.ballsSvg(3, '6cm', '？cm'), F.ballsSvg(4, '？cm', '24cm'), F.dialSvg(340), F.dialSvg(1240, 2000)].forEach(function (svg) { const d = document.createElement('div'); d.innerHTML = svg; box.appendChild(d); });
      [F.lineSvg(10000, 10, 3, 5, function (v) { return v >= 10000 ? '1万' : String(v); }), F.lineSvg(2, 20, 7, 10), F.lineSvg(1, 5, 2, 5, function (v) { return v ? '1' : '0'; })].forEach(function (svg) { const d = document.createElement('div'); d.style.gridColumn = '1 / -1'; d.innerHTML = svg; box.appendChild(d); });
      document.getElementById('stage').appendChild(box);
      return;
    }
    // 3学期の 図を ならべて 見る（v6.3）
    if (mode === 'figs3b') {
      const F = MQ.sansu3.figs3;
      const box = document.createElement('div');
      box.style.cssText = 'position:absolute;inset:0;background:#FFF8E6;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px;z-index:99;align-content:start;';
      [F.triSvg('iso', ['5cm', '5cm', '3cm'], ['あ', 'い', 'う']), F.triSvg('equi', ['4cm', '4cm', '4cm']), F.triSvg('sca', ['3cm', '6cm', '7cm']), F.anglesSvg(40, 50, 100, 30),
       F.setSquareSvg(false), F.circleTriSvg('4cm'), F.tapeSvg(3, ['12cm', '4cm']), F.tapeSvg(5, ['？cm', '3cm']),
       F.sorobanSvg([0, 0, 2, 7], 3), F.sorobanSvg([0, 7, 0, 3], 3), F.sorobanSvg([0, 1, 2, 3], 2), F.sorobanSvg([1, 2, 3, 4, 5, 6], 5)].forEach(function (svg) { const d = document.createElement('div'); d.innerHTML = svg; box.appendChild(d); });
      document.getElementById('stage').appendChild(box);
      return;
    }
    // 学期の おすすめ（v3.0）：9月に した ときの おうちの人ページ
    if (mode === 'parent2') {
      fresh();
      MQ.terms.setNow(new Date(2026, 8, 5));
      MQ.ui.dex.render('parent'); MQ.ui.show('screen-dex');
      await wait(100);
      say('parent2: sug=' + ($('.termsug') ? $('.termsug').textContent : 'MISSING'));
      const b = $('.termsug .btn'); if (b) { b.click(); await wait(100); }
      say('parent2 after: term=' + MQ.save.current().term + ' sug=' + ($('.termsug') ? 'still' : 'gone'));
      MQ.terms.setNow(new Date(2026, 8, 5));
      MQ.save.update(function (pl) { pl.term = 0; });
      MQ.ui.dex.render('parent');
      dump();
      return;
    }
    if (mode === 'graph')  { fresh(); MQ.ui.battle.start('sansu3-5'); await wait(600); return; }  // ぼうグラフ（せの高い 問題）
    if (mode === 'roma') {
      fresh();
      MQ.ui.battle.start('kokugo3-5');
      for (let i = 0; i < 30; i++) {
        await wait(200);
        const q = MQ.battle.current();
        if (q && q.type === 'roma') { say('roma question shown'); return; }
        answerViaUI(true); await wait(3400);
      }
      return;
    }
    if (mode === 'write') {
      fresh();
      MQ.ui.battle.start('kokugo3-2');
      for (let i = 0; i < 30; i++) {
        await wait(200);
        const q = MQ.battle.current();
        if (q && q.type === 'write') { say('write question shown'); return; }
        answerViaUI(true); await wait(3400);
      }
      return;
    }
    if (mode === 'boss') {
      fresh();
      MQ.ui.battle.start('sansu3-6');
      await wait(400);
      await playBattle('boss', { stopAtBoss: true });
      await wait(2200);
      return;
    }
    if (mode === 'last') {
      fresh({ frags: { sansu: true, kokugo: true, rikashakai: true, eigo: true } });
      MQ.ui.battle.start('tower3');
      await wait(3200);
      say('tower: ' + (MQ.battle.current() ? MQ.battle.current().unit : 'none'));
      return;
    }
    // 小4の さいごの塔（v4.8）：#last4 バトル／#last4map 塔が 開いた 地図
    if (mode === 'last4' || mode === 'last4map') {
      fresh({ frags: {} });
      MQ.save.update(function (pl) {
        pl.grade = 4; pl.playGrade = 4;
        ['sansu', 'kokugo', 'rika', 'shakai', 'eigo'].forEach(function (id) { pl.frags[MQ.save.areaKey(id, pl)] = true; });
      });
      if (mode === 'last4map') { MQ.ui.goMap(); await wait(300); MQ.ui.map.paint(); const sc = $('#screen-map .map__scroll'); if (sc) sc.scrollTop = 99999; return; }
      MQ.ui.battle.start('tower4');
      await wait(3200);
      say('tower4: ' + (MQ.battle.current() ? MQ.battle.current().unit : 'none'));
      return;
    }
    /* よみあげ（v5.3）
       #speak     … 英語ステージ。カードの「きく」を おして 何を 読むか 見る

    if (mode.indexOf('speak') === 0) {

      if (off || none) {

      }

      btn.click();
      await wait(120);
      const sp = (window.__spoke || [])[0];
      say('speak: 読んだ="' + (sp ? sp.text : 'MISSING') + '" ことば=' + (sp ? sp.lang : '-') +
          ' はやさ=' + (sp ? sp.rate : '-') + ' 光る=' + (btn.classList.contains('is-playing') ? 'ok' : 'no'));
      if (mode === 'speak2') {
        // 正解して ふきだしを 出す。つぎの 問題に 進む 前に 止める

        if (fb) { fb.click(); await wait(120);
          const sp2 = (window.__spoke || [])[1];
          say('speak2: 読んだ="' + (sp2 ? sp2.text : 'MISSING') + '"'); }

    /* なかま（相棒・v4.3）
       #pals        … 図かんの「なかま」タブ（相棒 3体＋コイン 20）

       #palname     … なまえを つける（図かんの なかまタブ・v5.2）

    if (mode.indexOf('pal') === 0) {
      fresh();
      MQ.save.update(function (pl) {
        pl.coins = 20;
        ['drago-1', 'mecha-2', 'ninja-1'].forEach(function (id) { MQ.pals.add(pl, id); });
        MQ.pals.setActive(pl, 'drago-1');
        // コインで こうかんできる ように、会った ことに する
        ['serp-1', 'krak-1', 'hawk-2', 'bolt-3'].forEach(function (id) { pl.dex[id] = (pl.dex[id] || 0) + 1; });
        if (mode === 'palresult') pl.pals['drago-1'].exp = MQ.pals.expFor(10) - 30;   // あと少しで しんか
      });
      // #palname … なまえを つける（v5.2）
      if (mode === 'palname') {
        MQ.ui.dex.render('pals');
        MQ.ui.show('screen-dex');
        await wait(200);
        const btn = $('.palnow__rename');
        if (!btn) { say('palname: なまえボタン MISSING'); return; }
        btn.click();
        await wait(250);
        const input = $('.palname__input');
        if (input) { input.value = 'ドラちゃん'; }
        const ok = $('.palname .btn--gold');
        if (ok) ok.click();
        await wait(300);
        const cur = MQ.pals.active(MQ.save.current());
        say('palname: なまえ=' + (cur ? cur.name : 'なし') + ' もとの名前=' + (cur ? cur.baseName : '-') +
            ' つけた=' + (cur && cur.named ? 'yes' : 'no') +
            ' カードの 字=' + ($('.palnow__name') ? $('.palnow__name').textContent : 'MISSING'));
        // もう一度 ひらいた ところを 撮る
        const b2 = $('.palnow__rename');
        if (b2) b2.click();
        await wait(250);
        dump();
        freeze();
        return;
      }
      // #palgauge … ゲージは 正解で たまり、まちがえても へらない（v5.2）
      if (mode === 'palgauge') {
        MQ.ui.battle.start('sansu3-2');
        await wait(400);
        const need = MQ.battle.palGaugeNeed();
        const ok1 = answerViaUI(true);  await wait(1800);
        say('  1問め ok=' + ok1 + ' ゲージ=' + MQ.battle.palGauge() + ' コンボ=' + MQ.battle.combo());
        const ok2 = answerViaUI(true);  await wait(1800);
        say('  2問め ok=' + ok2 + ' ゲージ=' + MQ.battle.palGauge() + ' コンボ=' + MQ.battle.combo());
        const before = MQ.battle.palGauge();
        const ok3 = answerViaUI(false); await wait(1800);   // わざと まちがえる
        say('  3問め（わざと ×）ok=' + ok3 + ' ゲージ=' + MQ.battle.palGauge() + ' コンボ=' + MQ.battle.combo());
        const after = MQ.battle.palGauge();
        say('palgauge: 何問で たまる=' + need + ' 2問めで=' + before +
            ' まちがえた あと=' + after + ' → ' + (after === before ? 'へらない OK' : 'へった NG') +
            ' コンボ=' + MQ.battle.combo() +
            ' 玉=' + document.querySelectorAll('.pal__dot.is-on').length + '/' + document.querySelectorAll('.pal__dot').length);
        dump();
        freeze();
        return;
      }
      // #palhit … 3問め（ゲージが たまった ところ）の 追い打ちの 帯を 撮る（v5.2）
      if (mode === 'palhit') {
        MQ.ui.battle.start('sansu3-2');
        await wait(400);
        answerViaUI(true); await wait(1800);
        answerViaUI(true); await wait(1800);
        answerViaUI(true); await wait(260);          // 帯が 出ている あいだに 止める
        // 帯は 0.9秒で 消える タイマーが ついている → 写しに おきかえて アニメを 止める
        const st = document.createElement('style');
        st.textContent = '.palbanner { animation-delay: -.25s !important; animation-play-state: paused !important; }';
        document.head.appendChild(st);
        const bn = document.querySelector('.palbanner');
        // .fx は つぎの 問題を 出す ときに 空に される → 写しは .arena に おく
        const arena = document.querySelector('.arena');
        if (bn && arena) { arena.appendChild(bn.cloneNode(true)); }
        say('palhit: 帯=' + (bn ? bn.textContent : 'MISSING') +
            ' ゲージ=' + MQ.battle.palGauge() + '（たまったら 0に もどる）' +
            ' 玉=' + document.querySelectorAll('.pal__dot.is-on').length + '/' + document.querySelectorAll('.pal__dot').length);
        dump();
        freeze();
        return;
      }
      if (mode === 'pals') {
        MQ.ui.dex.render('pals');
        MQ.ui.show('screen-dex');
        await wait(200);
        const cur = MQ.pals.active(MQ.save.current());
        say('pals: いまの相棒=' + (cur ? cur.name + ' Lv.' + cur.lv : 'なし') +
            ' もっている=' + MQ.pals.own(MQ.save.current()).length +
            ' お店=' + document.querySelectorAll('.palshop__row').length + ' 相棒カード=' + ($('.palnow') ? 'ok' : 'MISSING'));
        return;
      }
      // #palresult2 … かならず「なかまに なりたい」が 出る（いちばん つまった 画面の 検査）
      if (mode === 'palresult2') { const real = MQ.pals.offerFrom; MQ.pals.offerFrom = function (p, def) { return real(p, def, function () { return 0; }); }; }
      MQ.ui.battle.start('sansu3-2');
      await wait(400);
      say('palbattle: 画面の 相棒=' + ($('.pal') && !$('.pal').hidden ? $('.pal .pal__name').textContent : 'MISSING'));
      if (mode === 'palbattle') {
        // 3問 れんぞく 正解 → 追い打ち
        for (let i = 0; i < 3; i++) { answerViaUI(true); await wait(1800); }
        say('palbattle: 追い打ち=' + (MQ.battle.summaryNow ? '?' : '') + ' コンボ=' + MQ.battle.combo());
        freeze();
        return;
      }
      await playBattle('palresult');
      await wait(900);
      const rs = $('.rs');
      say('palresult: 画面=' + (rs ? 'ok' : 'MISSING') +
          ' 相棒の帯=' + ($('.rs__pal') ? $('.rs__pal .rs__palname').textContent : 'なし') +
          ' なかま候補=' + ($('.rs__paloffer') ? $('.rs__paloffer .rs__palotext').textContent : 'なし'));
      return;
    }

    if (mode === 'result' || mode === 'result2' || mode === 'result3') {
      // #result  … ボスを たおして レベルアップも する にぎやかな ケース
      // #result2 … ボスに にげられて ★0 の さみしい ケース
      fresh();
      MQ.save.update(function (pl) {
        // つぎの 1戦で かならず レベルアップ するように、あと 40 で 上がる XP に する
        let xp = pl.xp;
        while (MQ.hero.progress(xp).need - MQ.hero.progress(xp).into > 40) xp++;
        pl.xp = xp;
      });
      MQ.ui.battle.start(mode === 'result3' ? 'sansu3-4' : 'sansu3-6');   // result3 … つぎの ステージが ある
      await wait(400);
      if (mode === 'result2') {
        let g = 0;
        while (!MQ.battle.isOver() && g++ < 60) { answerViaUI(false); await wait(60); if (MQ.battle.isRetry()) { answerViaUI(false); await wait(60); } await wait(3300); }
      } else {
        await playBattle('result');
      }
      await wait(800);
      say('result: ' + ($('.rs') ? 'ok' : 'MISSING') + ' / ボス: ' + ($('.rs__boss') ? 'ok' : 'MISSING'));
      return;
    }

    /* ---- #flow: ぜんぶ 通す ---- */
    fresh();
    say('--- タイトル ---');
    MQ.ui.start.render(); MQ.ui.show('screen-start');
    await wait(300);
    say('logo: ' + ($('.title__logo') ? 'ok' : 'MISSING'));

    say('--- マップ ---');
    MQ.ui.goMap();
    await wait(400);
    say('nodes: ' + $$('#screen-map .node').length + ' / tower: ' + ($('#screen-map .tower') ? 'ok' : 'MISSING'));

    say('--- 算数バトル（1問 わざと まちがえる） ---');
    MQ.ui.battle.start('sansu3-6');
    await wait(400);
    // どうぐを 1つ 使ってから たたかう
    say('bagbtn: ' + ($('.bagbtn') && !$('.bagbtn').hidden ? 'ok' : 'MISSING'));
    MQ.ui.battle.openBag();
    await wait(100);
    const bi = $('.bagrow__use');
    say('bag items: ' + $$('.bagrow').length + (bi ? ' → use ' + bi.closest('.bagrow').querySelector('.bagrow__pw').textContent : ' MISSING'));
    if (bi) bi.click();
    await wait(1200);
    await playBattle('sansu', { missFirst: true });
    await wait(700);
    say('result: ' + ($('#screen-result .rs__title') ? $('#screen-result .rs__title').textContent : 'MISSING'));

    say('--- 国語（かん字を 書く） ---');
    MQ.ui.battle.start('kokugo3-2');
    await wait(400);
    await playBattle('kokugo2');
    await wait(700);

    say('--- ローマ字 ---');
    MQ.ui.battle.start('kokugo3-5');
    await wait(400);
    await playBattle('romaji');
    await wait(700);

    say('--- とっくん ---');
    MQ.save.update(function (p) {
      MQ.save.addEscaped(p, 'sansu', { key: 'x1', q: { id: 'x1', type: 'number', prompt: '2×3は？', answer: 6, unit: 'テスト' }, enemyId: 'slime-green', areaId: 'sansu', stageId: 'sansu3-1' });
    });
    MQ.ui.battle.startTokkun();
    await wait(400);
    await playBattle('tokkun');
    await wait(700);

    say('--- さいごの塔 ---');
    MQ.save.update(function (p) { p.frags = {}; ['sansu', 'kokugo', 'rikashakai', 'eigo'].forEach(function (a) { p.frags[MQ.content.fragKey(a, p)] = true; }); });
    MQ.ui.battle.start('tower3');
    await wait(3200);
    await playBattle('tower');
    await wait(900);
    const p = MQ.save.current();
    say('たからもの: ' + MQ.treasure.countOwned(p) + ' / ' + MQ.treasure.total());
    say('でんせつ: ' + p.gear.filter(function (g) { return MQ.hero.isDensetsu(g); }).length + ' / 5');
    say('しょうごう: ' + MQ.hero.titleName(p));

    say('--- 図かん ---');
    ['hero', 'treasure', 'mons', 'parent', 'set'].forEach(function (t) {
      MQ.ui.dex.render(t);
      say('dex ' + t + ': ' + ($('#screen-dex .wrap') ? 'ok' : 'MISSING'));
    });
    MQ.ui.photo.render();
    say('photo: ' + ($('.photo__stage') ? 'ok' : 'MISSING'));

    say('--- 小4ワールド（v4.4・算数だけ） ---');
    fresh({ stars: { 'sansu4-1': 3, 'sansu4-2': 2 }, frags: {} });
    MQ.save.update(function (pl) { pl.grade = 4; pl.playGrade = 4; pl.best = {}; });
    MQ.ui.goMap();
    await wait(400);
    const n4nodes = $$('#screen-map .node').length;
    say('小4 nodes: ' + n4nodes + (n4nodes >= 5 ? ' ok' : ' MISSING'));
    for (const sn of [2, 4, 7, 8, 11, 14, 15]) {
      MQ.ui.battle.start('sansu4-' + sn);
      await wait(400);
      const q4 = MQ.battle.current();
      const card4 = $('.card__q');
      say('sansu4-' + sn + ': ' + (q4 && card4 && card4.innerHTML ? 'ok ' + MQ.util.stripTags(q4.prompt).slice(0, 22) : 'MISSING'));
    }
    MQ.ui.battle.start('sansu4-5');
    await wait(400);
    await playBattle('sansu4');
    await wait(700);
    say('小4 result: ' + ($('#screen-result .rs__title') ? $('#screen-result .rs__title').textContent : 'MISSING'));

    say('--- 小4 国語（v4.5） ---');
    for (const kn of [1, 3, 4]) {
      MQ.ui.battle.start('kokugo4-' + kn);
      await wait(400);
      const kq = MQ.battle.current();
      say('kokugo4-' + kn + ': ' + (kq && $('.card__q') ? 'ok ' + MQ.util.stripTags(kq.prompt).slice(0, 20) : 'MISSING'));
    }
    MQ.ui.battle.start('kokugo4-2');
    await wait(400);
    say('kokugo4-2 write: ' + (MQ.battle.current() && MQ.battle.current().type === 'write' ? 'ok' : (MQ.battle.current() ? MQ.battle.current().type : 'MISSING')));
    await playBattle('kokugo4');
    await wait(700);

    say('--- 小4 理科・社会（v4.6） ---');
    for (const rn of [1, 2, 3, 4]) {
      MQ.ui.battle.start('rika4-' + rn);
      await wait(400);
      const rq = MQ.battle.current();
      say('rika4-' + rn + ': ' + (rq && $('.card__q') ? 'ok ' + MQ.util.stripTags(rq.prompt).slice(0, 18) : 'MISSING'));
    }
    for (const sn of [1, 2, 3, 4]) {
      MQ.ui.battle.start('shakai4-' + sn);
      await wait(400);
      const sq = MQ.battle.current();
      say('shakai4-' + sn + ': ' + (sq && $('.card__q') ? 'ok ' + MQ.util.stripTags(sq.prompt).slice(0, 18) : 'MISSING'));
    }
    await playBattle('shakai4');
    await wait(700);
    say('社会の ボス: ' + (MQ.enemies.bossFor('shakai').name === 'グランドタイタン' ? 'ok' : 'MISSING'));

    say('--- 小4 英語（v4.7） ---');
    for (const en of [1, 2, 3, 4]) {
      MQ.ui.battle.start('eigo4-' + en);
      await wait(400);
      const eq = MQ.battle.current();
      say('eigo4-' + en + ': ' + (eq && $('.card__q') ? 'ok ' + MQ.util.stripTags(eq.prompt).slice(0, 18) : 'MISSING'));
    }
    MQ.ui.goMap();
    await wait(400);
    say('小4の ゾーン: ' + $$('#screen-map .biome__name').length + ($$('#screen-map .biome__name').length === 5 ? ' ok' : ' MISSING'));
    say('理科の 湖: ' + ($$('#screen-map .biome__name').filter(function (e) { return e.textContent.indexOf('理科の 湖') >= 0; }).length ? 'ok' : 'MISSING'));

    say('--- 小4の さいごの塔（v4.8） ---');
    MQ.save.update(function (pl) {
      ['sansu', 'kokugo', 'rika', 'shakai', 'eigo'].forEach(function (id) { pl.frags[MQ.save.areaKey(id, pl)] = true; });
    });
    MQ.ui.goMap();
    await wait(400);
    say('塔: ' + ($('#screen-map .tower') ? 'ok' : 'MISSING') + ' / 開いた: ' + (MQ.content.towerOpen(MQ.save.current()) ? 'ok' : 'MISSING'));
    say('ラスボス: ' + MQ.content.lastBoss().name + (MQ.content.lastBoss().name === 'ダークロード' ? ' ok' : ' MISSING'));
    MQ.ui.battle.start('tower4');
    await wait(3200);
    say('tower4 の 1問め: ' + (MQ.battle.current() ? MQ.battle.current().unit : 'MISSING'));
    await playBattle('tower4');
    await wait(900);
    say('tower4 result: ' + ($('#screen-result .rs__title') ? $('#screen-result .rs__title').textContent : 'MISSING'));

    say('--- 学年ごとの 地図（v4.7） ---');
    for (const g of [1, 2, 3, 4]) {
      MQ.save.setPlayGrade(g);
      MQ.ui.goMap();
      await wait(300);
      const el = $('#screen-map .map');
      say('小' + g + ' の 地図: ' + (el && el.className.indexOf('map--g' + g) >= 0 ? 'ok ' + el.className : 'MISSING'));
    }
    MQ.save.setPlayGrade(4);

    say('--- 学年の きりかえ（v4.5） ---');
    MQ.ui.goMap();
    await wait(300);
    say('学年チップ: ' + $$('#screen-map .chip--g').length + ($$('#screen-map .chip--g').length === 6 ? ' ok' : ' MISSING'));
    MQ.save.setPlayGrade(2);
    MQ.ui.goMap();
    await wait(300);
    say('小2に きりかえ: ' + MQ.content.activeWorld().id + ' / nodes ' + $$('#screen-map .node').length);
    MQ.ui.battle.start('sansu2-1');
    await wait(400);
    say('小2の バトル: ' + (MQ.battle.current() ? 'ok' : 'MISSING'));
    MQ.save.setPlayGrade(4);
    MQ.ui.goMap();
    await wait(300);
    say('小4に もどす: ' + MQ.content.activeWorld().id);

    say('=== エラー: ' + L.filter(function (t) { return t.indexOf('ERROR') === 0 || t.indexOf('MISSING') >= 0; }).length + ' ===');
    dump();
  }

  run().then(dump, function (e) { say('THROW ' + e); dump(); });
  setInterval(dump, 500);
})();
</script>
</body>
</html>
