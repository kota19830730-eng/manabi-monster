<!--
  画面の 通しテスト／スクリーンショット用。
  パスは 相対（../）なので フォルダを 動かしても そのまま 使えます。

  ハッシュで モードを えらぶ：
    #start   タイトル
    #maker   なまえ・見た目えらび
    #look    すがたを かえる（あとから）
    #map     マップ（#map:600 で その いちまで／#map:-1 で いちばん下）
    #battle  たたかい（1問目で 止める）
    #note    正解の ふきだし（長い 補足つき）
    #fx:fire #fx:bolt #fx:star  ひっさつわざの エフェクト
    #graph   ぼうグラフの 問題（カードが 高い ケース）
    #boss    ボス戦で 止める
    #last    さいごの塔（ラスボス）で 止める
    #roma    ローマ字の「うつ」問題で 止める
    #write   かん字を「書く」問題で 止める
    #result  けっか画面（ボス討伐＋レベルアップ）／#result2 にげられて ★0
    #dex     図かん（主人公）
    #treasure たからばこ
    #parent  おうちの人ページ
    #flow    ぜんぶ 自動で 通す（ログを #log に 出す）
    #map4 #battle4:N #figs4 #treasure4 #parent4 … 小4ワールド（v4.4・算数 15ステージ）
    #kokugo4 #koku4:N … 小4 国語（v4.5・かん字 219字＋ことば。N=1〜4）
    #rika4:N #shakai4:N #eigo4:N … 小4 理科・社会・英語（v4.6/v4.7・N=1〜4）
    #last4 #last4map … 小4の さいごの塔（v4.8・ダークロード）
    #last1 #last1map #last2 #last2map … 小1・小2の さいごの とう（v6.4・おばけキング／かいぞくキャプテン）
    #zu #chizu … 問題の 図（v4.9・地図記号・方位・じしゃく・回路・月）／地図と方位の バトル
    #fever #fever2 #fever3 #feverparent … きょうの フィーバー教科 と サポート（v7.2）
    #mix #mix2 #mix3 … ごちゃまぜ バトル（v7.3・地図の バー／1問め／けっか画面）
    #counter #counter2 #counter3 #counterboss … てきの ため → カウンター（v7.7）
    #elite #elite2 … 中ボス（v8.1・あらわれた ところ／たおした ところ）
    #summon #summon2 … なかまを よぶ（よんで いる／とんできた）
    #weakmix #weaklast … 弱点（ごちゃまぜの まよいこんだ 敵／塔の ラスボス）
    #skill:kamae #skill:break #skill:clone #skill:clone2 #skill:call … ボスの わざ 3種
    #news #news:2 #news2 #news3 … あたらしい こと！（v8.3・たまった ぶん／2ページめ／1つだけ／もう 見た）
    #streak #streak:7 #streak:0 #streak:none … スタンプカレンダー（v8.4・3日め／7日め／切れた／きょう まだ）
    #letter #letter2 #letter3 … おうちの人からの てがみ（v8.5・親が 書く／地図の 封筒／ミッションに 入る）

  例:
  chrome --headless=new --disable-gpu --virtual-time-budget=400000 \
    --dump-dom "file:///.../tools/harness.html#flow"
  画像は --screenshot=x.png --window-size=520,1000 --hide-scrollbars
-->

<script>
(function () {
  const L = window.__log;
  /* #<mode>|css=<encodeURIComponent した CSS> … その CSS を かぶせて 撮る（位置の 案を くらべる 用・v12.1） */
  const hashAll = (location.hash || '#flow').slice(1);
  const mode = hashAll.split('|')[0];
  hashAll.split('|').slice(1).forEach(function (part) {
    if (part.indexOf('css=') === 0) { const st = document.createElement('style'); st.textContent = decodeURIComponent(part.slice(4)); document.head.appendChild(st); }
    if (part.indexOf('js=') === 0) { try { (new Function(decodeURIComponent(part.slice(3))))(); } catch (e) { console.error('js=', e); } }   // |js=<code>：モードの 前に 走らせる（検査の スイッチ用）
  });
  const $ = function (s, root) { return (root || document).querySelector(s); };
  const $$ = function (s, root) { return Array.prototype.slice.call((root || document).querySelectorAll(s)); };
  function say(t) { L.push(t); }
  function dump() { document.getElementById('log').textContent = L.join('\n'); }

  // 音は 切っておく（headless では 鳴らない）
  MQ.stage.fit();
  MQ.save.load();
  MQ.save.setSetting('sfx', false);
  MQ.save.setSetting('bgm', false);
  MQ.sfx.setEnabled(false);
  MQ.bgm.setEnabled(false);
  MQ.ui.setTextures();
  // しゅうまつ イベント（v13.16）：撮る・検査する ときは 平日に 固定（#weekend・#wkbattle で 変える）
  if (MQ.weekend) MQ.weekend.setNow(new Date(2026, 8, 9, 13, 0, 0));

  /* headless の Chrome には 声が 入って いない ので、にせの 声を 入れる（v5.3）。
     読んだ 中身は window.__spoke に たまる。*/
  function fakeVoices(none) {
    window.__spoke = [];
    const vs = none ? [] : [
      { name: 'Fake US', lang: 'en-US', default: true },
      { name: 'Fake UK', lang: 'en-GB' },
      { name: 'Fake JP', lang: 'ja-JP' }
    ];
    const synth = {
      getVoices: function () { return vs; },
      speak: function (u) {
        window.__spoke.push({ text: u.text, lang: u.lang, rate: u.rate, voice: u.voice && u.voice.name });
        if (typeof u.onend === 'function') setTimeout(u.onend, 30);
      },
      cancel: function () {},
      addEventListener: function () {}
    };
    try { Object.defineProperty(window, 'speechSynthesis', { value: synth, configurable: true }); }
    catch (e) { window.speechSynthesis = synth; }
    // native の Utterance に にせの voice を 入れると TypeError に なる ので、
    // こちらも かならず にせに する
    const U = function (t) { this.text = t; this.lang = ''; this.rate = 1; this.pitch = 1; this.volume = 1; };
    try { Object.defineProperty(window, 'SpeechSynthesisUtterance', { value: U, configurable: true }); }
    catch (e) { window.SpeechSynthesisUtterance = U; }
    if (MQ.speech) MQ.speech.refresh();
  }

  function fresh(opts) {
    opts = opts || {};
    try { localStorage.clear(); } catch (e) {}
    MQ.save.load();
    MQ.save.setSetting('sfx', false);
    MQ.save.setSetting('bgm', false);
    if (MQ.ui.scenery) MQ.ui.scenery.setNow(new Date(2026, 8, 11, 13, 0, 0));   // 背景（v12.6）：撮る ときは 昼に 固定（#scenery で 変える）
    const p = MQ.save.createPlayer('こうた', { hair: 'gold', skin: 'mid', style: 'short' });
    MQ.save.update(function (pl) {
      pl.xp = opts.xp != null ? opts.xp : 1400;
      MQ.hero.gear.forEach(function (g) {
        if (opts.allGear || (!MQ.hero.isDensetsu(g.id) && g.gradeNo <= (opts.grade || 3))) {
          pl.gear.push(g.id);
          pl.equipped[g.slot] = g.id;
        }
      });
      pl.stars = opts.stars || { 'sansu3-1': 3, 'sansu3-2': 3, 'sansu3-3': 2, 'sansu3-4': 2, 'kokugo3-1': 3, 'kokugo3-2': 2, 'rikashakai3-1': 2, 'eigo3-1': 1 };
      pl.best = { 'sansu3-6': { correct: 8, total: 12, time: 260 } };
      pl.treasure = opts.treasure || { 'tr-kake': 2, 'tr-wari': 2, 'tr-jikoku': 1, 'tr-yomi': 1 };
      pl.frags = opts.frags || { sansu: true, kokugo: true };
      pl.coins = 7;
      pl.bag = Object.keys(pl.treasure).slice(0, 3);   // もちもの（どうぐ）
      // ずかんの 見た目を たしかめられるように、さいしょの 20体ぐらいは 見つけた ことに する
      pl.dex = {};
      MQ.enemies.list.slice(0, 20).forEach(function (e, i) { pl.dex[e.id] = 3 + (i % 4); });
      ['skullhorse', 'zukan', 'boss-dragon'].forEach(function (id) { pl.dex[id] = 1; });
      pl.dexNew = { 'slime-green': true, 'robot-gray': true };
      pl.battles = 12; pl.defeated = 96;
      pl.seenUnlock = true;   // v11.1：もう あそんで いる 子（はじめての 案内は 出さない）
      MQ.hero.checkTitles(pl);
      pl.title = 't-ryu';
      MQ.save.addLog(pl, 'あまりのあるわり算：8/12　★2　4:20');
      MQ.save.addLog(pl, 'かけ算のきまり：12/12　★3　3:41');
    });
    MQ.ui.syncCustom();
    return p;
  }

  function correctValue(q) {
    if (q.type === 'number') return q.answer;
    if (q.type === 'choice') return q.answer;
    if (q.type === 'roma') return q.answer;
    if (q.type === 'write') return true;
    return { q: q.answer.q, r: q.answer.r };
  }
  function wrongValue(q) {
    if (q.type === 'number') return q.answer + 1;
    if (q.type === 'choice') return (q.answer + 1) % q.choices.length;
    if (q.type === 'roma') return 'zzz';
    if (q.type === 'write') return false;
    return { q: q.answer.q + 1, r: q.answer.r };
  }

  // 画面の ボタンを 押して 答える（UIも まとめて ためす）
  function answerViaUI(good) {
    // ボスの「ふつう／本気」を えらぶ パネル（v12.7）が 出て いたら ボタンを 押す（ふだんは ふつう・window.__pickHard で 本気）
    const pick = document.querySelector('.bosspick');
    if (pick) { const pb = pick.querySelector(window.__pickHard ? '.bosspick__btn--hard' : '.bosspick__btn--norm'); if (pb) pb.click(); }
    const q = MQ.battle.current();
    if (!q) return false;
    if (q.type === 'choice') {
      const btns = $$('#screen-battle .choice');
      let want = good ? q.answer : (q.answer + 1) % q.choices.length;
      // まちがえる ときは **押せる** まちがいを えらぶ（ヒントで 消された ボタンは 押せない）
      if (!good) {
        for (let i = 0; i < btns.length; i++) {
          const j = (q.answer + 1 + i) % btns.length;
          if (btns[j] && !btns[j].disabled) { want = j; break; }
        }
      }
      if (!btns[want]) { say('NO CHOICE BUTTONS'); return false; }
      btns[want].click();
      return true;
    }
    if (q.type === 'write') {
      const keys = $$('#screen-battle .keys--write .key');
      if (!keys.length) { say('NO WRITE BUTTON'); return false; }
      // v2.9：字を かいてから「かけた！」（正しい字は フォントで・まちがいは なぐりがき）。まよった ときだけ ◯／✕
      memoCanvasDraw(function (ctx, w, hh) {
        if (good) drawKanjiLike(ctx, q.answer, { w: w, h: hh, size: Math.min(hh * 0.8, 170, w * 0.85 / q.answer.length), rot: 2, wave: 2 });
        else drawJunk(ctx, 'scribble', w, hh);
      });
      keys[0].click();                       // 「かけた！」
      const k2 = $$('#screen-battle .keys--write .key');
      if (k2.length >= 2) (good ? k2[0] : k2[1]).click();   // ◯ おなじに かけた ／ ✕ ちがった
      return true;
    }
    const keys = $$('#screen-battle .key');
    if (!keys.length) { say('NO KEYS for ' + q.type); return false; }
    function press(label) {
      const want = MQ.text ? MQ.text.fit(label) : label;
      const b = keys.filter(function (k) { return k.textContent === label || k.textContent === want; })[0];
      if (b) b.click(); else say('NO KEY ' + label);
      // （ボタンの 字は 学年に 合わせて 変わる（v13.2）ので、さがす ときは MQ.text.fit を 通す）
    }
    if (q.type === 'roma') {
      String(good ? q.answer : 'zzz').split('').forEach(press);
      press('こたえる');
      return true;
    }
    if (q.type === 'divrem') {
      String(good ? q.answer.q : q.answer.q + 1).split('').forEach(press);
      press('こたえる');
      String(q.answer.r).split('').forEach(press);
      press('こたえる');
      return true;
    }
    if (q.type === 'frac') {   // 分数（v6.5）：分子 → こたえる → 分母 → こたえる
      String(good ? q.answer.n : q.answer.n + 1).split('').forEach(press);
      press('こたえる');
      String(q.answer.d).split('').forEach(press);
      press('こたえる');
      return true;
    }
    String(good ? q.answer : q.answer + 1).split('').forEach(press);
    press('こたえる');
    return true;
  }

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  /* いま 画面に 出ている 一瞬（ふきだし・ひっさつの エフェクト）を
     スクリーンショットに のこす ため、これいじょう タイマーを 進めない。 */
  function freeze() { window.setTimeout = function () { return 0; }; }
  function fakeDrawing() {
    const W = 900, H = 1200;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    const g = x.createRadialGradient(380, 480, 80, 450, 600, 900);
    g.addColorStop(0, '#f7f4ec'); g.addColorStop(1, '#c9c4b6');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    for (let i = 0; i < 6000; i++) { x.fillStyle = 'rgba(0,0,0,' + (Math.random() * 0.06) + ')'; x.fillRect(Math.random() * W, Math.random() * H, 2, 2); }
    x.fillStyle = '#6f6a60'; x.fillRect(0, 1130, W, 70);   // つくえの ふち
    const d = document.createElement('canvas'); d.width = W; d.height = H;
    const y = d.getContext('2d');
    y.lineJoin = 'round'; y.lineCap = 'round';
    function blob(cx, cy, rx, ry, fill) { y.beginPath(); y.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); y.fillStyle = fill; y.fill(); y.lineWidth = 3.2; y.strokeStyle = '#2a2622'; y.stroke(); }
    blob(450, 620, 210, 190, 'rgba(242,162,58,.85)');   // 体（オレンジの マーカー）
    y.fillStyle = 'rgba(255,200,120,.5)'; for (let i = 0; i < 40; i++) y.fillRect(300 + Math.random() * 300, 480 + Math.random() * 280, 30, 6);
    [[300, 440], [400, 400], [500, 400], [600, 440]].forEach(function (p) { y.beginPath(); y.moveTo(p[0] - 30, p[1] + 20); y.lineTo(p[0], p[1] - 90); y.lineTo(p[0] + 30, p[1] + 20); y.closePath(); y.fillStyle = 'rgba(76,175,80,.9)'; y.fill(); y.lineWidth = 3; y.strokeStyle = '#2a2622'; y.stroke(); });

      if (kind === 'err') return Promise.resolve({ status: 400, json: { error: { code: 400, message: 'API key not valid.', status: 'INVALID_ARGUMENT' } } });

  function drawKanjiLike(ctx, text, o) {

    const t = tmp.getContext('2d');
    const size = o.size || 150;
    t.save();
    t.translate(o.x != null ? o.x : W / 2, o.y != null ? o.y : Hh / 2);
    t.rotate((o.rot || 0) * Math.PI / 180);
    t.transform(o.sx || 1, o.shy || 0, o.shx || 0, o.sy || 1, 0, 0);
    if (o.mirror) t.scale(-1, 1);
    t.font = size + 'px ' + (o.font || "'HGKyokashotai'");

    t.lineWidth = o.lw || 0;

    t.restore();

    const cx = W / 2, cy = Hh / 2;

      for (let s = 0; s < n; s++) {

        ctx.beginPath(); ctx.moveTo(x, y);

    /* v13.19 そうびの 見た目：#gearset:<グレード>[:atk|:dex|:none]
       グレードの 5点を つけて バトル（3D）。atk＝こうげきの とちゅうで 止める・dex＝メニューの じぶん・none＝そうび なし */
    if (mode.indexOf('gearset') === 0) {
      const gid = mode.split(':')[1] || 'ryu', sub = mode.split(':')[2] || '';
      fresh({ allGear: true });
      MQ.save.update(function (pl) { MQ.hero.slots.forEach(function (s) { pl.equipped[s] = sub === 'none' ? null : gid + '-' + s; }); });
      if (sub === 'flat') MQ.save.setSetting('v3', false);   // りったいを 切った 2D の バトル
      if (sub === 'dex') {
        MQ.ui.dex.render('hero'); MQ.ui.show('screen-dex'); await wait(120);
        say('gearset: メニューの 光 = ' + document.querySelectorAll('#screen-dex .is-gearaura.ga--' + gid).length + 'こ');
        dump(); return;
      }
      MQ.ui.battle.start('sansu3-2');
      await wait(600);
      const ga = document.querySelector('#screen-battle .hero .gaura--back');
      const sw = document.querySelector('.hero .p--sword');
      say('gearset: ' + gid + ' オーラ=' + (ga ? ga.className : 'なし') + ' 3D=' + (document.querySelector('.hero .v3scene') ? 'yes' : 'no') +
          ' けんの 箱=' + (sw ? sw.querySelectorAll('.b').length : 0) + ' 体の 箱=' + ((document.querySelector('.hero .p--body') || { querySelectorAll: function () { return []; } }).querySelectorAll(':scope > .b').length));
      if (sub === 'atk') {                  // こうげきの 動き（mo-attack）を かけて、ふりかぶった ところで 止める（#gearset:<g>:atk:<ms>）
        const at = parseInt(mode.split(':')[3], 10) || 170;
        const sc = document.querySelector('#screen-battle .hero .v3scene');
        if (sc) MQ.ui.v3.play(sc, 'mo-attack', 0);   // 0＝待機に もどす タイマーを 作らない（freeze では 止まらない）
        await wait(20);
        document.querySelectorAll('#screen-battle .hero, #screen-battle .hero *').forEach(function (el) { el.getAnimations().forEach(function (an) { an.pause(); an.currentTime = at; }); });
        freeze();
      }
      dump(); return;
    }
    if (mode.indexOf('aurora') === 0) {
      fresh({ allGear: true });
      const eq = MQ.save.current().equipped;
      const grades = MQ.hero.slots.map(function (s) { return (MQ.hero.getGear(eq[s]) || {}).gradeName; });
      say('aurora: つけて いる = ' + grades.join(' / ') + '　一式=' + (MQ.hero.hasAuroraSet(MQ.save.current()) ? 'yes' : 'no'));
      if (mode.split(':')[1] === 'dex') {
        MQ.ui.dex.render('hero'); MQ.ui.show('screen-dex'); await wait(80);
        say('aurora: 光る 主人公 = ' + document.querySelectorAll('#screen-dex .is-gearaura').length + 'こ');
        dump(); return;
      }
      MQ.ui.battle.start('sansu3-2');
      await wait(400);
      say('aurora: わざ 1つ 上=' + MQ.battle.specialTierUp() + '　早さ=' + MQ.battle.specialBoost() +
          '　なかまゲージ +' + MQ.battle.buffs().palPlus);
      let g = 0, critAt = 0, waza = '', wazaAt = 0;
      while (MQ.battle.combo() < 5 && g++ < 30) {
        const before = MQ.battle.combo();
        answerViaUI(true);
        await wait(260);                    // わざの 演出は すぐ 消える ので 先に 見る
        if (!critAt && document.querySelector('.combo--crit')) critAt = before + 1;
        const m = (document.querySelector('.fx') || {}).className;
        const hit = typeof m === 'string' ? m.match(/fx--(\w+)/) : null;
        if (hit && !waza) { waza = hit[1]; wazaAt = before + 1; }
        await wait(1600);
      }
      say('aurora: クリティカルは ' + critAt + ' コンボから（ふつうは 3）');
      say('aurora: はじめの わざ = ' + (waza || 'まだ') + '（' + wazaAt + ' コンボ）'
        + '　ふつうは 教科の わざ／オーロラの かぶとで bolt＝いなずま に なる');
      say('aurora: 主人公が 光る = ' + (document.querySelector('.hero.is-gearaura') ? 'yes' : 'NO'));
      dump();
      return;
    }
    if (mode === 'mons') { fresh(); MQ.ui.dex.render('mons'); MQ.ui.show('screen-dex'); return; }
    /* 子どもの 絵から うまれた モンスター（v14.5）：#sonskin[:trace|cool|mix][:pal|:click]
       4体を 見た ことに して すがたを えらぶ。pal＝スカルロード（3段階め）を 相棒に して なかまタブ／click＝ボタンを 押して かわるか */
    if (mode.indexOf('sonskin') === 0) {
      fresh();
      const sp = mode.split(':'), arg = sp[1] || '';
      MQ.save.update(function (p) {
        MQ.sonSkin.LINES.forEach(function (l) {
          p.dex[l] = 1;
          if (arg) MQ.sonSkin.set(p, l, arg === 'mix' ? (l === 'skullhorse' || l === 'zukan' ? 'cool' : 'trace') : arg);
        });
        if (sp[2] === 'pal') { MQ.pals.add(p, 'skullhorse-3'); MQ.pals.setActive(p, 'skullhorse-3'); }
      });
      MQ.sonSkin.warm(function () {
        const p = MQ.save.current();
        say('sonskin: ' + MQ.sonSkin.LINES.map(function (l) {
          const s1 = MQ.sonSkin.pngFor(l), s3 = MQ.sonSkin.pngFor(l + '-3');
          return l + '=' + (MQ.sonSkin.pick(p, l) || 'game') + (s1 ? '/png' : '') + (s3 && s3 !== s1 ? '/evo3' : '');
        }).join(' '));
        MQ.ui.dex.render(sp[2] === 'pal' ? 'pals' : 'mons'); MQ.ui.show('screen-dex');
        if (sp[2] === 'click') {
          const b = document.querySelectorAll('.sonskin__row')[1].querySelectorAll('.sonskin__opt')[2];
          b.click();
          try {
            const on = document.querySelectorAll('.sonskin__row')[1].querySelector('.is-on .sonskin__lbl');
            say('click: sameoni=' + (MQ.sonSkin.pick(MQ.save.current(), 'sameoni') || 'game') + ' on=' + (on ? on.textContent : '-'));
          } catch (e) { say('click ERR ' + e.message); }
        }
        // :3d＝バトルと 同じ 3D の 出し方で 1段階め・3段階めを ならべる（ゲームばん・えらんだ すがた）
        if (sp[2] === '3d' && MQ.ui.v3) {
          const box = document.createElement('div');
          box.style.cssText = 'position:fixed;left:0;top:0;right:0;z-index:99;display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:linear-gradient(#5cbcf3,#9edcff 70%,#7ccf52 70%)';
          MQ.sonSkin.LINES.forEach(function (l) { [l, l + '-3'].forEach(function (id) { const v = MQ.ui.v3.monster(id, 110, { mo: 'mo-none' }); if (v) box.appendChild(v); }); });
          document.body.appendChild(box);
        }
        dump();
      });
      return;
    }
    // 学期（v2.6）：#term1 1学期に した 地図／#parent1 おうちの人ページ（1学期）
    if (mode.indexOf('term1') === 0 || mode === 'parent1') {
      fresh();
      MQ.save.update(function (pl) { pl.term = 1; pl.units = {}; });
      if (mode !== 'parent1') {
        MQ.ui.goMap(); await wait(300); dismissTowerPop(); MQ.ui.map.paint();
        const n = parseInt(mode.slice(6), 10);   // #term1:-1 で いちばん下
        if (!isNaN(n)) { const sc = $('#screen-map .map__scroll'); if (sc) sc.scrollTop = n < 0 ? 99999 : n; }
      }
      else { MQ.ui.parent.open('settings'); }
      const open = [];
      MQ.content.subjectAreas().forEach(function (a) { a.stages.forEach(function (st) { if (MQ.content.isAvailable(st)) open.push(st.id); }); });
      say('term1 open: ' + open.join(' '));
      return;
    }
    /* 教科書（出版社）（v12.4）：#books おうちの人ページ（算数＝東京書籍・1学期）／#books:map その 地図 */
    if (mode === 'books' || mode.indexOf('books:') === 0) {
      fresh();
      MQ.save.update(function (pl) { pl.term = 1; pl.units = {}; MQ.textbooks.setBook(pl, 'sansu', 'tokyo'); MQ.textbooks.setBook(pl, 'kokugo', 'mitsumura'); });
      const open = [];
      MQ.content.subjectAreas().forEach(function (a) { a.stages.forEach(function (st) { if (MQ.content.isAvailable(st)) open.push(st.id); }); });
      say('books open: ' + open.join(' '));
      say('books term(sansu3-5)=' + MQ.terms.stageTerm('sansu3-5') + ' term(kokugo3-5)=' + MQ.terms.stageTerm('kokugo3-5') + ' roma=' + MQ.terms.unitLearned(MQ.save.current(), 'ローマ字', 3));
      if (mode === 'books:map') { MQ.ui.goMap(); await wait(300); dismissTowerPop(); MQ.ui.map.paint(); }
      else {
        MQ.ui.parent.open('settings');
        await wait(200);
        const on = $$('.chip--book.is-on').map(function (b) { return b.textContent; });
        say('books chips on: ' + on.join(' / ') + ' rows=' + $$('.bookrow').length);
        // クリックで 変わるか（ボタンを click() する きまり）
        const kb = $$('.chip--book').filter(function (b) { return b.textContent === '啓林館'; })[0];
        if (kb) { kb.click(); await wait(200); say('books after click: sansu=' + MQ.textbooks.pick(MQ.save.current(), 'sansu') + ' term(sansu3-5)=' + MQ.terms.stageTerm('sansu3-5')); }
      }
      return;
    }
    if (mode === 'parent') { fresh(); MQ.ui.parent.open('settings'); return; }
    /* 相棒の 進化（v8.2）
       #evo      … 王さま形 44体・系統の 検査（数と ならび）
       #evo:my   … じぶんの モンスターを 作って 3段階に なるか（絵も ちがうか）
       #evo:lv   … 相棒を Lv10 → Lv20 に して すがたが 2回 変わるか */
    if (mode === 'evo' || mode.indexOf('evo:') === 0) {
      fresh();
      const sub = mode.split(':')[1] || '';
      if (sub === 'my') {
        const mon = { id: 'my-test', name: 'テストくん', area: 'sansu', png: fakeDrawing() };
        await new Promise(function (res) { MQ.ui.growCustom(mon, res); });
        say('evo: 2段階めの 絵=' + (mon.png2 ? 'できた' : 'MISSING') + ' 3段階め=' + (mon.png3 ? 'できた' : 'MISSING') +
            ' もとと ちがう=' + (mon.png2 && mon.png2 !== mon.png && mon.png3 !== mon.png2 ? 'ok' : 'NG'));
        MQ.save.update(function (p) { MQ.save.addCustom(p, mon); });
        MQ.ui.syncCustom();
        const a = MQ.enemies.get('my-test'), b = MQ.enemies.get('my-test-2'), c = MQ.enemies.get('my-test-3');
        say('evo: ' + [a, b, c].map(function (e) { return e ? e.name + '(stage' + (e.stage || '-') + ')' : 'MISSING'; }).join(' → '));
        // 相棒に して Lv10・Lv20 で 進化するか
        MQ.save.update(function (p) { MQ.pals.add(p, 'my-test', 0); MQ.pals.setActive(p, 'my-test'); });
        MQ.save.update(function (p) { p.pals['my-test'].exp = MQ.pals.expFor(10); MQ.pals.evolveIfReady(p); });
        const l10 = MQ.pals.active(MQ.save.current());
        MQ.save.update(function (p) { p.pals[l10.id].exp = MQ.pals.expFor(20); MQ.pals.evolveIfReady(p); });
        const l20 = MQ.pals.active(MQ.save.current());
        say('evo: Lv10 → ' + l10.name + ' / Lv20 → ' + l20.name + ' ' + (l10.id === 'my-test-2' && l20.id === 'my-test-3' ? 'ok' : 'NG'));
        dump(); return;
      }
      if (sub === 'lv') {
        MQ.save.update(function (p) { MQ.pals.add(p, 'slime-green', 0); MQ.pals.setActive(p, 'slime-green'); });
        const steps = [];
        [1, 10, 20].forEach(function (lv) {
          MQ.save.update(function (p) {
            const cur = MQ.pals.active(p);
            p.pals[cur.id].exp = MQ.pals.expFor(lv);
            MQ.pals.evolveIfReady(p);
          });
          const cur = MQ.pals.active(MQ.save.current());
          steps.push('Lv' + lv + '=' + cur.name + '(つよさ ' + JSON.stringify(MQ.pals.power(MQ.save.current())) + ')');
        });
        say('evo: ' + steps.join(' → '));
        dump(); return;
      }
      const kings = MQ.enemies.list.filter(function (e) { return e.stage === 3 && /-king$/.test(e.id); });
      const plain = MQ.enemies.list.filter(function (e) { return !e.mid && !e.rare && !e.hidden && e.id !== 'chest'; });
      say('evo: 図かん ' + (MQ.enemies.dexList().length + MQ.enemies.bosses.length) + '体 ／ 王さま ' + kings.length +
          '体 ／ 進化する ' + plain.filter(function (e) { return e.evo; }).length + '体 ／ 進化しない ' +
          plain.filter(function (e) { return !e.evo && e.stage !== 3; }).length + '体');
      say('evo: 王さま＝' + kings.slice(0, 8).map(function (e) { return e.name; }).join('・') + ' …');
      dump();
      return;
    }
    /* 息子さんの モンスターの 進化（v8.6）
       #sonevo      … 6系統 × 3だんかい の 検査（ならび・レア敵に 出ない・Lv10/Lv20）
       #sonevo:art  … 18体を ならべて 見る（撮る 用） */
    if (mode === 'sonevo' || mode === 'sonevo:art') {

      const rows = LINES.map(function (ln) {
        return MQ.enemies.list.filter(function (e) { return e.line === ln; })
          .sort(function (a, b) { return a.stage - b.stage; });
      });

          rows.map(function (g) {
            return h('div', { style: 'display:flex;align-items:flex-end;gap:8px;margin-bottom:10px' },
              g.map(function (e) {
                return h('div', { style: 'text-align:center;flex:1' }, [
                  MQ.enemies.node(e.id, { size: 96 }),
                  h('div', { style: 'color:#fff;font-size:11px;margin-top:4px', text: e.name })
                ]);
              }));
          }));
        const sc = document.getElementById('stage');
        sc.textContent = '';
        sc.appendChild(wrap);
        return;

      rows.forEach(function (g) {
        say('sonevo: ' + g.map(function (e) { return e.name + '(' + e.stage + (e.evoOnly ? '・出ない' : '') + ')'; }).join(' → '));
      });
      let leak = 0;
      ['sansu', 'kokugo', 'rikashakai', 'eigo'].forEach(function (a) {
        MQ.enemies.rareIdsFor(a).forEach(function (id) { const e = MQ.enemies.get(id); if (e && e.evoOnly) leak++; });
      });
      say('sonevo: レア敵に まざる 進化形 ' + leak + '体（0 が せいかい）／3体同時の 組 ' +
          (MQ.enemies.trioFor('eigo') ? 'あり（なし が せいかい・v13.21）' : 'なし'));
      MQ.save.update(function (p) { MQ.pals.add(p, 'zukan', 0); MQ.pals.setActive(p, 'zukan'); });
      const steps = [];
      [1, 10, 20].forEach(function (lv) {
        MQ.save.update(function (p) {
          const cur = MQ.pals.active(p);
          p.pals[cur.id].exp = MQ.pals.expFor(lv);
          MQ.pals.evolveIfReady(p);
        });
        const cur = MQ.pals.active(MQ.save.current());
        steps.push('Lv' + lv + '=' + cur.name + '(つよさ ' + JSON.stringify(MQ.pals.power(MQ.save.current())) + ')');
      });
      say('sonevo: ' + steps.join(' → '));
      say('sonevo: 図かん ' + (MQ.enemies.dexList().length + MQ.enemies.bosses.length) + '体');

    /* 地図と モンスターの HD（v9.6）
       #hd … 地図の こまかさ・描く 時間・モンスターの 材質が ついた 四角の 数 */
    if (mode === 'hd') {

      MQ.ui.goMap();
      await wait(400);

      const ms = performance.now() - t0;
      const wide = box.getBoundingClientRect().width;
      say('hd: 地図の canvas ' + cv.width + '×' + cv.height + ' ／ 画面の はば ' + Math.round(wide) +
          'px ／ 1点＝' + (wide / cv.width).toFixed(2) + 'px ／ 描く 時間 ' + ms.toFixed(1) + 'ms');
      say('hd: 1点が 2px より 大きいと 粗い → ' + (wide / cv.width <= 2 ? 'OK' : 'NG'));
      // モンスター：材質（金・宝石・ほね・ぬの）が ついた 四角を 数える
      const wrap = MQ.blocks.box(MQ.enemies.shapes['slimeKing'] || MQ.enemies.shapes['golem'],
                                 MQ.blocks.fill({ A: '#e8443a', y: '#ffd447' }), { size: 96 });

      all.forEach(function (n) { if (n.style.backgroundImage && n.style.backgroundImage !== 'none') mat++; });
      say('hd: 王さまスライム 96px … 四角 ' + all.length + 'こ ／ 材質つき ' + mat + 'こ');
      wrap.remove();

      document.body.appendChild(small);
      let mat2 = 0;
      small.querySelectorAll('.bx i').forEach(function (n) { if (n.style.backgroundImage && n.style.backgroundImage !== 'none') mat2++; });
      say('hd: ずかんの 52px でも 材質つき ' + mat2 + 'こ（0 だと ずかんだけ のっぺり）');

    /* 地図の ドック（v13.3・案A）
       #dock       … ふつうの 日：地図の 高さ・ドックの ボタンの ならび・ごちゃまぜが まん中
       #dock:busy  … てがみ＋にげた敵の 日：ふだが 出る・地図の 高さが 変わらない・ふだと ごちゃまぜが かさならない
       #dock:grade … 学年えらびを 開いた ところ（「プレイヤーを かえる」が ごちゃまぜに かくれない） */
    if (mode === 'dock' || mode.indexOf('dock:') === 0) {
      fresh();
      const sub = mode.split(':')[1] || '';
      if (sub === 'busy') MQ.save.update(function (p) {
        MQ.letter.write(p, { text: 'がんばってね', reward: 1 });

      });
      MQ.ui.goMap();
      await wait(300);
      const k = $('#stage').getBoundingClientRect().width / 400, s0 = $('#stage').getBoundingClientRect();
      const box = function (el) { if (!el) return null; const b = el.getBoundingClientRect(); return { t: (b.top - s0.top) / k, b: (b.bottom - s0.top) / k, l: (b.left - s0.left) / k, r: (b.right - s0.left) / k }; };
      const hit = function (a, b) { return a && b && a.l < b.r && b.l < a.r && a.t < b.b && b.t < a.b; };
      const tabs = $$('#screen-map .maptabs .maptab');

      const coin = box($('#screen-map .maptab__coin'));

        say('dock:busy ふだ ' + chips.map(function (c) { return c.getAttribute('aria-label'); }).join('/') + (chips.length === 2 ? ' OK' : ' NG'));
        const over = chips.some(function (c) { return hit(box(c), mix) || hit(box(c), coin); });

        say('dock:grade プレイヤーを かえる ' + (pb ? (hit(pb, mix) || hit(pb, coin) ? 'ごちゃまぜに かくれる NG' : 'かくれない OK') : 'MISSING'));

    /* 地図の 上下（v8.0・A＋B）
       #mapui        … 帯を 押して パネルが 出る／地図を さわると とじる／学年えらび／下の 段
       #mapui:open   … パネルを ひらいた ところ（撮る 用）

    if (mode === 'mapui' || mode.indexOf('mapui:') === 0) {
      fresh();
      MQ.ui.goMap();
      await wait(300);
      const sub = mode.split(':')[1] || '';

    /* おうちの人ページ「学習レポート」（v7.3・js/ui/parent.js）

    if (mode === 'pp' || mode.indexOf('pp:') === 0) {
      fresh();
      const sub = mode.split(':')[1] || '';
      if (sub !== 'empty') {
        const today = new Date(2026, 8, 5);      // 土曜
        const seed = function (stageId, unit, pat, wrongs, sec) {
          const res = [];
          pat.split('').forEach(function (c, i) {
            const w = wrongs && wrongs[i % wrongs.length];
            res.push({ stageId: stageId, unit: unit, type: 'number', ok: c === '1', given: c === '1' ? null : (w ? w[1] : '0'), answer: w ? w[2] : '1', prompt: w ? w[0] : (unit + ' の 問題 ' + i), sec: sec || 12 });
          });
          return res;
        };
        // 60日ぶん：週2日 休み・古いほど 正解率 低め・時間 長め
        const plan = [['sansu3-1', 'かけ算のきまり'], ['sansu3-2', '時間をもとめる'], ['sansu3-4', '暗算'], ['kokugo3-1', 'かん字の読み'], ['kokugo3-3', '主語と述語'], ['rikashakai3-1', '理科／こん虫']];
        for (let i = 59; i >= 1; i--) {
          const d = new Date(2026, 8, 5 - i);
          if (d.getDay() === 2 || d.getDay() === 5) continue;
          MQ.stats.setNow(d);
          const rate = 0.55 + (59 - i) / 59 * 0.3;
          const n = 6 + ((i * 7) % 9);
          const pk = plan[i % plan.length];
          let pat = '';
          for (let k = 0; k < n; k++) pat += (((i * 31 + k * 17) % 100) / 100 < rate) ? '1' : '0';
          MQ.save.update(function (pl) { MQ.stats.record(pl, { results: seed(pk[0], pk[1], pat, null, 22 - Math.round((59 - i) / 59 * 9)) }); });
        }
        MQ.stats.setNow(today);
        MQ.save.update(function (pl) {
          MQ.stats.record(pl, { results: [].concat(
            seed('sansu3-1', 'かけ算のきまり', '11111111110111111111'),
            seed('sansu3-2', '秒', '0100', [['1分は 何秒？', '100', '60'], ['2分30秒は 何秒？', '230', '150']]),
            seed('sansu3-2', '時間をもとめる', '100010', [['7時50分から 8時20分までは 何分？', '70分', '30分'], ['午前9時から 午後1時までは 何時間？', '8時間', '4時間']]),
            seed('sansu3-3', 'あまりを考える問題', '1101101011'),
            seed('sansu3-4', '暗算', '111'),
            seed('kokugo3-1', 'かん字の読み', '111111111111'),
            seed('kokugo3-3', '主語と述語', '1011010101', [['「ぼくは 本を 読む」の 主語は？', '本を', 'ぼくは']]),
            seed('rikashakai3-1', '理科／こん虫', '010101101', [['こん虫の あしは 何本？', '8本', '6本'], ['チョウの 育ち方は？', 'たまご→よう虫→せい虫', 'たまご→よう虫→さなぎ→せい虫']]),

    //   x,y,w,h は わくの 場所（写真に 対する わりあい 0〜1。h を 書かなければ 写真の px で 正方形）。子どもが 指で わくを 動かした のと 同じに PointerEvent で 動かす
    if (mode.indexOf('photo2') === 0 || mode.indexOf('photo3:') === 0) {

    // ドット絵エディタ（v2.9）：#pixedit = 写真 → 直す を 開いて ペン・ぬる・けしゴム・もどす・ゆび2本／#pixedit:zoom = ×4 で 拡大／#pixedit:blank = まっしろから／#pixedit:mine = つくった モンスターを 直す
    if (mode.indexOf('pixedit') === 0) {
      fresh();
      const kind = mode.split(':')[1] || '';
      MQ.ui.photo.render();
      if (kind === 'mine') {
        // つくった モンスターが ある 状態
        MQ.save.update(function (p) { MQ.save.addCustom(p, { id: 'my-test', name: 'テスト', area: 'sansu', png: fakeAiArt() }); });
        MQ.ui.photo.render();
        const fix = Array.prototype.filter.call(document.querySelectorAll('.cell .btn'), function (b) { return b.textContent === MQ.text.fit('直す'); })[0];
        say('pixedit mine: fixbtn=' + !!fix);
        if (fix) fix.click();
        await wait(150);
      } else if (kind === 'blank') {
        $('.photo__blank').click();
        await wait(100);
      } else {
        await new Promise(function (res) { MQ.ui.photo.render.load(fakeDrawing(), function () { res(); }); });
        say('pixedit before: editrow=' + ($('.photo__editrow').hidden ? 'hidden' : 'shown'));
        $('.photo__edit').click();
        await wait(150);
      }
      const T = MQ.ui.pixedit.test;
      if (!T) { say('pixedit: MISSING'); dump(); return; }
      const N = T.state().N;
      say('pixedit open: N=' + N + ' swatches=' + document.querySelectorAll('.pixed__sw').length + ' view=' + $('.pixed__view').style.width);
      const view = T.view; const r = view.getBoundingClientRect();
      function pe(type, x, y, id) { view.dispatchEvent(new PointerEvent(type, { pointerId: id || 1, pointerType: 'touch', isPrimary: !id || id === 1, clientX: r.left + x, clientY: r.top + y, bubbles: true, cancelable: true })); }
      if (kind === 'zoom') { T.zoom(4); say('pixedit zoom: ' + T.state().zoom + ' pan=' + JSON.stringify(T.state().pan) + ' cv=' + T.canvas.style.width); }
      // ペンで 赤い 線（左上 → 右下）
      T.color([255, 0, 0]);
      say('pixedit view: ' + Math.round(r.width) + 'x' + Math.round(r.height) + (Math.abs(r.width - r.height) < 1 ? ' square' : ' NOT SQUARE'));
      pe('pointerdown', r.width * 0.1, r.height * 0.1);
      for (let t = 0.1; t <= 0.9; t += 0.05) pe('pointermove', r.width * t, r.height * t);
      pe('pointerup', r.width * 0.9, r.height * 0.9);
      const rr = T.canvas.getBoundingClientRect();
      function cellOf(fx, fy) { return { x: Math.floor((r.left + r.width * fx - rr.left) / rr.width * N), y: Math.floor((r.top + r.height * fy - rr.top) / rr.height * N) }; }
      const c1 = cellOf(0.5, 0.5);
      { let reds = []; for (let yy = 0; yy < N; yy++) for (let xx = 0; xx < N; xx++) { const p = T.pixel(xx, yy); if (p[0] === 255 && p[1] === 0 && p[2] === 0) reds.push(xx + ',' + yy); } say('pixedit reds: ' + reds.length + (reds.length >= 40 ? ' ok' : ' TOO FEW') + ' ' + reds.slice(0, 6).join(' ')); }
      say('pixedit pen: cell ' + JSON.stringify(c1) + ' = ' + JSON.stringify(T.pixel(c1.x, c1.y)) + ' undo=' + T.state().undo.length);
      // ぬる（右上の あき）→ 青
      T.color([0, 0, 255]); T.tool('fill');
      const c2 = cellOf(0.85, 0.15);
      pe('pointerdown', r.width * 0.85, r.height * 0.15); pe('pointerup', r.width * 0.85, r.height * 0.15);
      say('pixedit fill: cell ' + JSON.stringify(c2) + ' = ' + JSON.stringify(T.pixel(c2.x, c2.y)));
      // けしゴム（線の まん中）
      T.tool('eraser'); T.brush(3);
      pe('pointerdown', r.width * 0.5, r.height * 0.5); pe('pointerup', r.width * 0.5, r.height * 0.5);
      say('pixedit eraser: ' + JSON.stringify(T.pixel(c1.x, c1.y)));
      T.undo();
      say('pixedit undo: ' + JSON.stringify(T.pixel(c1.x, c1.y)) + ' undo=' + T.state().undo.length);
      // スポイト：赤い 線の 色を とる
      T.color([0, 0, 0]); T.tool('pick');
      pe('pointerdown', r.width * 0.5, r.height * 0.5); pe('pointerup', r.width * 0.5, r.height * 0.5);
      say('pixedit pick: color=' + JSON.stringify(T.state().color) + ' tool=' + T.state().tool);
      // ゆび 2本で うごかす（×4 の とき だけ うごく）
      T.tool('pen');
      const p0 = JSON.stringify(T.state().pan);
      pe('pointerdown', r.width * 0.3, r.height * 0.3, 1); pe('pointerdown', r.width * 0.6, r.height * 0.6, 2);
      pe('pointermove', r.width * 0.2, r.height * 0.2, 1); pe('pointermove', r.width * 0.5, r.height * 0.5, 2);
      pe('pointerup', r.width * 0.2, r.height * 0.2, 1); pe('pointerup', r.width * 0.5, r.height * 0.5, 2);
      say('pixedit two-finger: pan ' + p0 + ' -> ' + JSON.stringify(T.state().pan) + ' drawing=' + !!T.state().drawing);
      // スクショ用：canvas の 写し（headless では canvas が 写らない）
      const im = document.createElement('img'); im.src = T.canvas.toDataURL();
      im.style.cssText = 'position:absolute;left:' + T.canvas.style.left + ';top:' + T.canvas.style.top + ';width:' + T.canvas.style.width + ';height:' + T.canvas.style.height + ';image-rendering:pixelated;pointer-events:none;';
      view.appendChild(im);
      if (kind === 'done') {
        Array.prototype.filter.call(document.querySelectorAll('.pixed__foot .btn'), function (b) { return b.textContent === MQ.text.fit('これで OK'); })[0].click();
        await wait(100);
        say('pixedit done: open=' + MQ.ui.pixedit.isOpen() + ' state=' + JSON.stringify(MQ.ui.photo.aiState()) + ' edited-class=' + $('.photo__preview').classList.contains('is-edited'));
      }
      dump();
      return;
    }
    // かん字の はんてい（v2.9）の 校正：#judge（おてほん＝端末の 教科書体）／#judge:gothic（おてほんを ゴシックに して 書体の ずれを 大きく）
    if (mode.indexOf('judge') === 0) {
      fresh();
      const HW = MQ.handwrite;
      const gothic = mode.split(':')[1] === 'gothic';
      if (gothic) HW.setFont("'Yu Gothic', 'Meiryo', sans-serif");
      say('judge: template font = ' + HW.font().slice(0, 40) + ' TH=' + JSON.stringify(HW.thresholds()));
      const list = [];
      MQ.kokugo1.kanji.forEach(function (k) { list.push({ k: k.k, r: k.r }); });
      MQ.kokugo2.kanji.forEach(function (k) { list.push({ k: k.k, r: k.r }); });
      MQ.kokugo3.questions.filter(function (q) { return q.stage === 2 && /「([^」]+)」を かん字で/.test(q.text); }).forEach(function (q) { list.push({ k: q.choices[0], r: (q.text.match(/「([^」]+)」/) || [])[1] }); });
      const pickEvery = Math.max(1, Math.floor(list.length / 48));
      const K = list.filter(function (x, i) { return i % pickEvery === 0; }).slice(0, 48);
      const FONTS = gothic ? ["'UD Digi Kyokasho N'", "'HGKyokashotai'", "'Yu Mincho'", "'BIZ UDMincho Medium'"] : ["'HGKyokashotai'", "'Yu Mincho'", "'BIZ UDMincho Medium'", "'Noto Serif JP'", "'Yu Gothic'"];
      const W = 360, Hh = 240;
      const res = { same: [], small: [], other: [], kana: [], mirror: [], scribble: [], line: [], blob: [], zig: [], circle: [], lines: [] };
      const verd = {};
      function run(kind, kanji, fn) {
        const c = document.createElement('canvas'); c.width = W; c.height = Hh;
        fn(c.getContext('2d'));
        const j = HW.judge(c, kanji);
        res[kind].push(j.score);
        verd[kind] = verd[kind] || { ok: 0, maybe: 0, ng: 0 };
        verd[kind][j.verdict]++;
        return j;
      }
      function like(text, o) { return function (ctx) { drawKanjiLike(ctx, text, Object.assign({ w: W, h: Hh, font: FONTS[Math.floor(Math.random() * FONTS.length)], size: rnd(120, 190), rot: rnd(-7, 7), sx: rnd(0.85, 1.15), sy: rnd(0.85, 1.15), shx: rnd(-0.12, 0.12), lw: rnd(0, 6), wave: rnd(1.5, 4), ph: rnd(0, 6) }, o || {})); }; }
      K.forEach(function (it, i) {
        for (let s = 0; s < 3; s++) run('same', it.k, like(it.k));
        run('small', it.k, like(it.k, { size: rnd(60, 90), lw: rnd(2, 5) }));
        for (let s = 0; s < 2; s++) { const o = K[(i + 7 + s * 11) % K.length]; run('other', it.k, like(o.k)); }
        if (it.r) run('kana', it.k, like(it.r, { size: rnd(80, 120) }));
        run('mirror', it.k, like(it.k, { mirror: true }));
        ['scribble', 'line', 'blob', 'zig', 'circle', 'lines'].forEach(function (kd) { run(kd, it.k, function (ctx) { drawJunk(ctx, kd, W, Hh); }); });
      });
      function q(arr, p) { const a = arr.slice().sort(function (x, y) { return x - y; }); return a.length ? a[Math.min(a.length - 1, Math.floor(a.length * p))].toFixed(2) : '-'; }
      Object.keys(res).forEach(function (k) {
        const a = res[k]; if (!a.length) return;
        const v = verd[k];
        say('judge ' + k.padEnd(9) + ' n=' + String(a.length).padStart(3) + ' p5=' + q(a, 0.05) + ' p25=' + q(a, 0.25) + ' p50=' + q(a, 0.5) + ' p75=' + q(a, 0.75) + ' p95=' + q(a, 0.95) + ' | ok ' + Math.round(v.ok / a.length * 100) + '% maybe ' + Math.round(v.maybe / a.length * 100) + '% ng ' + Math.round(v.ng / a.length * 100) + '%');
      });
      // しきい値を 動かした ときの 率（ok の しきい値 / ng の しきい値）
      const junk = res.scribble.concat(res.line, res.blob, res.zig, res.circle, res.lines);
      [0.55, 0.6, 0.65, 0.7].forEach(function (tn) {
        const j = junk.filter(function (s) { return s < tn; }).length / junk.length, sm = res.same.concat(res.small).filter(function (s) { return s < tn; }).length / (res.same.length + res.small.length), ot = res.other.filter(function (s) { return s < tn; }).length / res.other.length;
        say('judge ng<' + tn + ': junk ng ' + Math.round(j * 100) + '% / other ng ' + Math.round(ot * 100) + '% / same ng ' + Math.round(sm * 100) + '%');
      });
      [0.75, 0.8, 0.85, 0.9].forEach(function (to) {
        const sm = res.same.filter(function (s) { return s >= to; }).length / res.same.length, ot = res.other.filter(function (s) { return s >= to; }).length / res.other.length, mi = res.mirror.filter(function (s) { return s >= to; }).length / res.mirror.length, ka = res.kana.filter(function (s) { return s >= to; }).length / Math.max(1, res.kana.length);
        say('judge ok>=' + to + ': same ok ' + Math.round(sm * 100) + '% / other ok ' + Math.round(ot * 100) + '% / mirror ok ' + Math.round(mi * 100) + '% / kana ok ' + Math.round(ka * 100) + '%');
      });
      dump();
      return;
    }
    // かん字を 書く 画面（v2.9）：#write2 = 正しい字（教科書体・少し かたむけ）→ 自動で ○／#write3 = なぐりがき → ×＋おてほん／
    //   #write4 = しきい値を 動かして「まよう」→ 見くらべ 画面／#write5 = べつの 字
    if (/^write[2-5]/.test(mode)) {

      memoCanvasDraw(function (ctx, w, hh) {

        else drawKanjiLike(ctx, q.answer, { w: w, h: hh, size: Math.min(hh * 0.8, 170, w * 0.85 / q.answer.length), rot: rnd(-5, 5), sx: rnd(0.9, 1.1), lw: 3, wave: 2.5 });
      });
      await wait(50);
      freeze();   // せいかい の あと つぎの 問題に 進まない ように、押す 前に 止める（timer は 押した ときに 予約される）
      say('write keys: ' + keyBtn('かけた！'));
      const j = MQ.ui.battle.lastJudge();
      say('write judge: ' + JSON.stringify(j));
      say('write ui: msg=' + $('.arena__msg').textContent + ' | feedback=' + $('.feedback').textContent + ' | model=' + ($('.card__model') ? $('.card__model').textContent : '-') + ' | cmp=' + !!$('.wcmp') + ' | keys=' + Array.prototype.map.call(document.querySelectorAll('.key'), function (b) { return b.textContent; }).join('/'));
      dump();
      return;
    }

    /* AIに 見てもらう（v6.0）：#aisee = コウモリと 当てる／#aisee:mimic = たからばこ／
       #aisee:bad = こたえが JSONで ない／#aisee:404 = 1つめの AIが 無い（2つめで 成功）／

    if (mode.indexOf('aisee') === 0) {
      fresh();
      const kind = mode.split(':')[1] || 'ok';
      MQ.ai._reset();
      if (kind !== 'off') MQ.ai.setConfig({ key: 'AIzaTEST', limit: 20 });
      MQ.ai.transport = fakeSee(kind);
      MQ.ui.photo.render();
      await new Promise(function (res) { MQ.ui.photo.render.load(kind === 'mimic' ? fakeDrawing2() : fakeDrawing(), function () { res(); }); });
      await wait(100);
      const btn = $('.photo__see');
      say('see before: btn=' + (btn && !$('.photo__seerow').hidden ? 'shown' : 'hidden') + ' left=' + MQ.ai.left() + ' 1st=' + (MQ.ui.photo.picks()[0] || {}).kind);

      say('see picks: ' + MQ.ui.photo.picks().slice(0, 5).map(function (p) { return p.kind; }).join(' '));
      say('see ui: note=' + ($('.photo__seenote').hidden ? 'hidden' : $('.photo__seenote').textContent) + ' name=' + ($('.photo__form .input') ? $('.photo__form .input').value : ($('.input') ? $('.input').value : '')));
      const wrap = $('#screen-dex .wrap'); const tgt = $('.photo__preview');
      if (wrap && tgt) wrap.scrollTop = tgt.offsetTop - 90;
      await wait(150);

    }

    // AIで かっこよく（v2.8）：#ai = にせの AIで できあがりまで／#ai:wait = まっている 幕／#ai:err = かぎが ちがう／
    //   #ai:safety = AIが かけない／#ai:busy = 無料わくが ない／#ai:off = かぎ なし（ボタンが 出ない）／#ai:back = もどした あと
    if (mode.indexOf('ai') === 0 && mode !== 'aiparent') {
      fresh();
      const parts = mode.split(':');

      const down = parts[2] === 'down';   // #ai:ok:down = できあがりの みほんまで スクロール

      say('ai before: btn=' + ($('.photo__ai') && !$('.photo__ai').hidden ? 'shown' : 'hidden') + ' note=' + ($('.photo__ainote') && !$('.photo__ainote').hidden ? 'shown' : 'hidden') + ' left=' + MQ.ai.left());
      if (kind === 'off') { dump(); return; }

      const st = MQ.ui.photo.aiState();

      say('ai ui: btn=' + ($('.photo__ai').hidden ? 'hidden' : 'shown') + ' row=' + ($('.photo__airow').hidden ? 'hidden' : 'shown') + ' err=' + ($('.photo__empty:not([hidden])') ? $('.photo__empty:not([hidden])').textContent : '') + ' wait=' + ($('.photo__wait').hidden ? 'hidden' : 'shown'));
      if (kind === 'back') { MQ.ui.photo.render.restore(); await wait(50); say('ai back: ' + JSON.stringify(MQ.ui.photo.aiState()) + ' info=' + JSON.stringify(MQ.ui.photo.info())); }

    if (mode === 'aiparent') {

    // 正解の ふきだし（いちばん 長い 補足）。画面に おさまるか 見る
    if (mode === 'note') {
      fresh();
      let pool = [];
      [MQ.kokugo3.questions, MQ.rikashakai3.questions, MQ.eigo3.questions].forEach(function (list) {
        pool = pool.concat(list.filter(function (q) { return q.note && q.choices; }));
      });
      pool.sort(function (a, b) { return b.note.length - a.note.length; });
      const long = pool[0];
      const st = MQ.content.findStage('rikashakai3-2').stage;
      const orig = st.make;
      st.make = function (n) {
        const out = [];
        for (let i = 0; i < n; i++) {
          out.push({
            id: 'note-test-' + i, type: 'choice', unit: long.unit,

      };

      await wait(300);

    }
    // v12.2：要素の 動きの クラス（mo-*）を 1つ かえす
    function moOf(el) { if (!el) return 'なし'; const m = el.className.match(/mo-[a-z0-9-]+/); return m ? m[0] : 'なし'; }
    // v12.2：#spatk[:<わざ>[:<秒>]]＝本物の こうげきの 道（answer → attack）で ひっさつを 出す。わざ＝fire(5) bolt(8) star(12)。
    //        秒を 書くと その 時間で 止めて 撮る。書かなければ 当たった あと ザコが たおれ始める ところまで 見て ログに 出す
    if (mode.indexOf('spatk') === 0) {
      const want = mode.split(':')[1] || 'fire';
      const at = mode.split(':')[2] ? parseFloat(mode.split(':')[2]) : null;
      const need = { fire: 5, leaf: 5, ice: 5, wind: 5, bolt: 8, star: 12, nova: 16, starburst: 20 }[want] || 5;
      fresh();
      MQ.save.update(function (pl) { pl.equipped.helm = null; });
      MQ.ui.battle.start(want === 'leaf' ? 'kokugo3-1' : want === 'ice' ? 'rikashakai3-1' : want === 'wind' ? 'eigo3-1' : 'sansu3-2');
      await wait(400);
      let guard = 0;
      while (MQ.battle.combo() < need - 1 && guard++ < 40) { answerViaUI(true); await wait(1700); }
      guard = 0;
      while (MQ.battle.current() && MQ.battle.current().chest && guard++ < 5) { answerViaUI(true); await wait(1700); }
      const foeEl = $('.foes .enemy');
      const foeName = foeEl ? foeEl.querySelector('.enemy__name') && foeEl.querySelector('.enemy__name').textContent : '';
      if (at != null) freeze();

    /* ガードくだき（2026-09-14）：ボスの 大わざが 子どもの まもり（たて・よろい）を ねらう

       #gbreak:crack  … ふつう：まちがえる → ヒビ（まもりは へらない）
       #gbreak:broke  … 本気：まちがえる → たてが こわれる
       #gbreak:block  … 1回めで 正解 → はね返した・たて ＋1
       #gbreak:fix    … 本気で こわれた あと 2問 れんぞく 正解 → なおる
       #gbreak:pal    … 相棒と いっしょ（アイコンと 相棒の なまえが かさならないか） */
    if (mode.indexOf('gbreak') === 0) {
      const what = mode.split(':')[1] || '';
      const hard = what === 'hard' || what === 'broke' || what === 'fix';
      fresh();
      MQ.save.update(function (pl) {
        pl.equipped.helm = null;                      // かぶとで ひっさつが 早く 出ない ように
        if (what === 'pal' && MQ.pals) { MQ.pals.add(pl, 'slime-green', 0); MQ.pals.setActive(pl, 'slime-green'); }
      });
      window.__pickHard = hard;
      MQ.ui.battle.start('sansu3-1'); await wait(150);
      let guard = 0, fixed = false;
      while (guard++ < 40 && !(MQ.battle.phase() === 'boss' && MQ.battle.attacking())) {
        if (MQ.battle.phase() === 'boss' && !fixed) { MQ.battle._setBossPlan({}); MQ.battle._setBossHp(12); fixed = true; }
        answerViaUI(true); await wait(60);
        if (MQ.battle.isRetry()) { answerViaUI(true); await wait(60); }
        await wait(3300);
      }
      const g0 = MQ.battle.guards();
      say('gbreak: phase=' + MQ.battle.phase() + ' hard=' + MQ.battle.bossHard() + ' ラベル=' + ($('.foecharge__label') ? $('.foecharge__label').textContent : 'MISSING')
        + ' まもり たて' + g0.shield + '・よろい' + g0.freeze + ' アイコン ' + $$('.guardico').length + (($('.guardrow') || {}).hidden ? '（かくれて いる）' : '') + ' / ' + $('.arena__msg').textContent);
      const freezeFx = function () {
        // 一瞬の ものは 写しを とって 止める（予約ずみの 消す タイマーでは 消えない ように）
        $$('.guardpop').forEach(function (p) { const c = p.cloneNode(true); c.style.animation = 'none'; c.style.opacity = '1'; p.parentNode.appendChild(c); });
        $$('.guardico').forEach(function (i) { i.style.animationPlayState = 'paused'; });
        freeze();
      };
      if (!what || what === 'hard' || what === 'pal') { dump(); return; }
      if (what === 'crack' || what === 'broke') {
        answerViaUI(false); await wait(420);
        const g = MQ.battle.guards();
        say('gbreak:' + what + ' 出来事=' + JSON.stringify(MQ.battle.guardEvent()) + ' たて' + g.shield + ' こわれた=' + g.broken.join() + ' ふだ=' + ($('.guardpop') ? $('.guardpop').textContent : 'MISSING') + ' / ' + $('.arena__msg').textContent);
        freezeFx(); dump(); return;

      if (what === 'block') {
        const s0 = MQ.battle.guards().shield;
        answerViaUI(true); await wait(420);
        say('gbreak:block 出来事=' + JSON.stringify(MQ.battle.guardEvent()) + ' たて ' + s0 + '→' + MQ.battle.guards().shield + ' ふだ=' + ($('.guardpop') ? $('.guardpop').textContent : 'MISSING'));
        freezeFx(); dump(); return;

      if (what === 'fix') {

        answerViaUI(true); await wait(3300);            // れんぞく 1
        say('gbreak:fix れんぞく ' + MQ.battle.guards().streak + ' / 点 ' + $$('.guardfix i.is-on').length + '/' + $$('.guardfix i').length);

        say('gbreak:fix 出来事=' + JSON.stringify(MQ.battle.guardEvent()) + ' こわれた=' + MQ.battle.guards().broken.join() + ' ふだ=' + ($('.guardpop') ? $('.guardpop').textContent : 'MISSING'));

    /* てきの ため → カウンター（v7.7）

       #counter3     … その 問題で まちがえる → くらった（敵の つっこみ・主人公の よろけ）
       #counterboss  … ボスの 2問め（大わざ）に 正解 → 2ダメージ */
    if (mode.indexOf('counter') === 0) {

    /* 敵がわの 攻防（v8.1）
       #elite / #elite2   … 中ボスが あらわれた ところ／たおした ところ
       #summon / #summon2 … なかまを よんで いる／とんできた
       #weakmix / #weaklast … 弱点（ごちゃまぜ／塔の ラスボス）
       #skill:kamae|break|clone|clone2|call … ボスの わざ */
    if (mode === 'elite' || mode === 'elite2') {
      fresh();
      MQ.save.update(function (pl) { pl.equipped.helm = null; });   // かぶとで ひっさつが 早く 出ない ように

    if (mode === 'summon' || mode === 'summon2') {

    if (mode === 'weakmix' || mode === 'weaklast') {

      if (mode === 'weaklast') {
        MQ.ui.battle.start('tower3'); await wait(3300);

        const b = $('.counterbanner');
        if (b) { const c = b.cloneNode(true); c.style.animation = 'none'; c.style.opacity = '1'; $('.arena').appendChild(c); }
        say('weaklast: banner=' + (b ? b.textContent : 'MISSING') + ' hp=' + hp0 + '→' + MQ.battle.bossHp() + ' msg=' + $('.arena__msg').textContent);

      MQ.ui.battle.start('mix3'); await wait(400);
      let guard = 0;
      while (guard++ < 20 && !(MQ.battle.current() && MQ.battle.current().weak)) {
        answerViaUI(true); await wait(60);
        if (MQ.battle.isRetry()) { answerViaUI(true); await wait(60); }
        await wait(3400);
      }
      const q = MQ.battle.current();
      say('weakmix: weak=' + (q && q.weak) + ' area=' + (q && q.areaId) + ' foe=' + (q && q.enemyId) +
          ' badge=' + ($('.enemy__weak') ? $('.enemy__weak').textContent : 'MISSING') + ' msg=' + $('.arena__msg').textContent);
      answerViaUI(true); await wait(140);
      const b = $('.counterbanner');
      if (b) { const c = b.cloneNode(true); c.style.animation = 'none'; c.style.opacity = '1'; $('.arena').appendChild(c); }
      say('weakmix: banner=' + (b ? b.textContent : 'MISSING') + ' msg=' + $('.arena__msg').textContent + ' weakHits=' + MQ.battle.summary().weakHits);
      dump(); return;
    }
    if (mode.indexOf('skill') === 0) {
      const kind = mode.split(':')[1] || 'kamae';
      const plan = kind === 'clone' || kind === 'clone2' ? { 3: { kind: 'clone', pos: 0 }, 4: { kind: 'clone', pos: 1 } }
        : kind === 'call' ? { 3: { kind: 'call', pos: 0 } } : { 3: { kind: 'kamae', pos: 0 } };
      fresh();
      // そうびを ぜんぶ 外す（たて・よろいが ある と わざと まちがえても 進まない・かぶとで ひっさつが 早く 出る）

          ' kamae=' + ($('.enemy__kamae') ? 'ok' : '-') + ' clone=' + ($('.enemy--clone') ? 'ok' : '-') +
          ' called=' + (MQ.battle.current().called ? 'ok' : '-') + ' msg=' + $('.arena__msg').textContent);
      if (kind === 'kamae' || kind === 'clone' || kind === 'call') { dump(); return; }

      const hp0 = MQ.battle.bossHp();

      let b = $('.counterbanner');

      say(mode + ': banner2=' + (b ? b.textContent : 'MISSING') + ' hp=' + hp1 + '→' + MQ.battle.bossHp() + ' dmg=' + ($('.dmg') ? $('.dmg').textContent : 'MISSING') + ' msg=' + $('.arena__msg').textContent);

    /* ごちゃまぜ バトル（v7.3）
       #mix   … 地図の 下の むらさきの バー

    // リベンジ（v3.1）：#revenge = 2日前に にげた敵が 1体目に もどってくる／#revenge:fresh = きょう にげた敵は もどらない

      $$('.arena__dusk, .arena__bg .bgfar, .arena__bg .cloud--c').forEach(function (el) { el.style.transition = 'none'; });   // virtual-time では transition が 進まない
      await wait(1800);
      say('bossdark: cls=' + $('.arena__bg').className + ' dusk-opacity=' + getComputedStyle($('.arena__dusk')).opacity);

    }
    if (mode === 'last') {

    if (mode === 'last6' || mode === 'last6map') {

      MQ.ui.battle.start('tower6');

    }
    if (mode === 'last5' || mode === 'last5map') {
      fresh({ frags: {} });
      MQ.save.update(function (pl) { pl.grade = 5; pl.playGrade = 5; ['sansu', 'kokugo', 'rika', 'shakai', 'eigo'].forEach(function (id) { pl.frags[MQ.save.areaKey(id, pl)] = true; }); });
      if (mode === 'last5map') { MQ.ui.goMap(); await wait(300); dismissTowerPop(); MQ.ui.map.paint(); const sc = $('#screen-map .map__scroll'); if (sc) sc.scrollTop = 99999; return; }
      MQ.ui.battle.start('tower5');
      await wait(3200);
      say('tower5: ' + (MQ.battle.current() ? MQ.battle.current().unit : 'none') + ' boss=' + MQ.content.lastBoss().name);

    // 小1・小2の さいごの とう（v6.4）：#last1 #last2 バトル／#last1map #last2map 塔が 開いた 地図
    if (/^last[12](map)?$/.test(mode)) {

      MQ.save.update(function (pl) {

      MQ.ui.battle.start('tower' + g);

    }
    // 小4の さいごの塔（v4.8）：#last4 バトル／#last4map 塔が 開いた 地図
    if (mode === 'last4' || mode === 'last4map') {
      fresh({ frags: {} });
      MQ.save.update(function (pl) {
        pl.grade = 4; pl.playGrade = 4;
        ['sansu', 'kokugo', 'rika', 'shakai', 'eigo'].forEach(function (id) { pl.frags[MQ.save.areaKey(id, pl)] = true; });
      });
      if (mode === 'last4map') { MQ.ui.goMap(); await wait(300); dismissTowerPop(); MQ.ui.map.paint(); const sc = $('#screen-map .map__scroll'); if (sc) sc.scrollTop = 99999; return; }
      MQ.ui.battle.start('tower4');

    /* さいごの塔が ひらいた！の ポップ（v9.3）
       #toweropen  … かけらを ぜんぶ そろえて 地図へ → ポップが 出る
       #toweropen2 … もう 1回 地図へ → 2回目は 出ない
       #toweropen3 … もう ラスボスを たおして いる → 出ない（見たことに して とじる） */
    if (mode.indexOf('toweropen') === 0) {
      fresh({ frags: {} });
      MQ.save.update(function (pl) {
        MQ.content.subjectAreas().forEach(function (a) { pl.frags[MQ.save.areaKey(a.id, pl)] = true; });
        if (mode === 'toweropen3') {
          const last = MQ.content.lastBoss();

        }
      });
      MQ.ui.goMap();
      await wait(320);
      say('toweropen: かけら ' + MQ.content.fragCount(MQ.save.current()) + ' / ' + MQ.content.subjectAreas().length
        + '・ポップ ' + (MQ.ui.towerPopOpen() ? 'でた' : 'なし'));
      if (mode === 'toweropen2') {
        const x = $('.towerpop .btn--stone'); if (x) x.click();

        MQ.ui.goMap();

    /* よみあげ（v5.3）
       #speak     … 英語ステージ。カードの「きく」を おして 何を 読むか 見る
       #speak2    … 正解の あとの ふきだしの「きく」
       #speak1    … 小1（問題文を 日本語で）
       #speakoff  … せっていを 切った とき ＝ ボタンが 出ない
       #speaknone … 声が 入って いない 端末 ＝ ボタンが 出ない */
    if (mode.indexOf('speak') === 0) {
      const off = (mode === 'speakoff');
      const none = (mode === 'speaknone');
      const g1 = (mode === 'speak1');
      fakeVoices(none);                      // none の ときは 声 0こ
      fresh(g1 ? { grade: 1 } : {});
      if (g1) MQ.save.setPlayGrade(1);
      if (off) MQ.save.setSetting('speech', false);
      MQ.ui.battle.start(g1 ? 'sansu1-1' : 'eigo3-1');

      const btn = $('.card__listen .listen');

      say('speak: 問題=' + (q ? MQ.speech.plain(q.prompt).slice(0, 34) : 'なし'));
      say('speak: きくボタン=' + (btn ? 'ある' : 'ない') +

        say('speak: ' + (off ? 'せっていを 切った' : '声が ない') + ' ときに ボタンが ' +

      }
      if (!btn) { say('speak: きくボタン MISSING'); dump(); freeze(); return; }
      btn.click();
      await wait(120);
      const sp = (window.__spoke || [])[0];
      say('speak: 読んだ="' + (sp ? sp.text : 'MISSING') + '" ことば=' + (sp ? sp.lang : '-') +
          ' はやさ=' + (sp ? sp.rate : '-') + ' 光る=' + (btn.classList.contains('is-playing') ? 'ok' : 'no'));
      if (mode === 'speak2') {
        // 正解して ふきだしを 出す。つぎの 問題に 進む 前に 止める
        answerViaUI(true);
        await wait(400);
        freeze();
        // ふきだしは 予約ずみの タイマーで 消える（freeze は 予約ずみを 止められない）
        // → 見つけた すぐ あとに 写しを とって おく
        const fbox = document.querySelector('.feedback');
        const panel = document.querySelector('.battle__body');
        if (fbox && panel) {
          const c = fbox.cloneNode(true);
          c.style.animation = 'none';
          c.setAttribute('data-copy', '1');
          panel.appendChild(c);
        }
        const fb = $('.feedback .listen');
        say('speak2: ふきだしの きく=' + (fb ? 'ある' : 'ない') +
            ' 文=' + ($('.feedback__note') ? $('.feedback__note').textContent.slice(0, 30) : '-'));
        if (fb) { fb.click(); await wait(120);
          const sp2 = (window.__spoke || [])[1];
          say('speak2: 読んだ="' + (sp2 ? sp2.text : 'MISSING') + '"'); }

      }
      dump();
      freeze();
      return;
    }

    /* #news … あたらしい こと！（お知らせ・v8.3）
         #news    ひさしぶりに 開いた 子（たまった ぶんを 3つずつ）
         #news:2  2ページめ（「つぎ ▶」を 1回 おす）
         #news2   1つの 版だけ 新しい 子
         #news3   もう 見た 子（出ない） */
    if (mode.indexOf('news') === 0) {
      const arg = mode.split(':')[1];
      const kind = mode.split(':')[0];
      fresh();
      const N = MQ.news;
      MQ.save.update(function (pl) {
        if (kind === 'news2') pl.seenNews = N.list[N.list.length - 2].v;   // さいごの 1版だけ 新しい
        else if (kind === 'news3') pl.seenNews = N.latest();               // ぜんぶ 見た
        else pl.seenNews = null;                                           // ひさしぶり
      });
      MQ.ui.news.reset();
      MQ.ui.goMap();
      await wait(300);
      const card = $('.newscard');
      const p0 = MQ.save.current();
      say('news: 版 ' + N.list.length + '／出す お知らせ ' + N.items(p0).length + 'こ・ページ ' + N.pages(p0).length +
          '／モーダル ' + (card ? 'ok' : 'なし'));
      if (kind === 'news3') {
        say('news3: もう 見た 子 → ' + (card ? 'MISSING（出て しまう）' : 'OK（出ない）'));
        dump(); return;
      }
      if (!card) { say('news: モーダルが 出ない MISSING'); dump(); return; }
      say('news: みだし ' + ($('.news__title') ? $('.news__title').textContent : 'MISSING') +
          '／サブ ' + ($('.bagcard__sub') ? $('.bagcard__sub').textContent : 'MISSING') +
          '／ドット ' + $$('.news__dot').length);
      function rows() {
        return $$('.newsrow').map(function (r) {
          return r.querySelector('.newsrow__t').textContent + '（絵 ' + (r.querySelector('.newsrow__art').children.length ? 'ok' : 'なし') + '）';
        });
      }
      say('news 1ページめ: ' + rows().join(' / '));
      // 絵は ぜんぶ 出て いるか（からっぽの 四角に なって いないか）
      const empty = $$('.newsrow__art').filter(function (a) { return !a.children.length; }).length;
      say('news: 絵が ない 行 ' + empty + '（0 が OK）');
      // カードが 画面に おさまって いるか（たて700 でも）
      const st = document.getElementById('stage').getBoundingClientRect();
      const cr = card.getBoundingClientRect();
      say('news: カード ' + Math.round(cr.height) + 'px / ステージ ' + Math.round(st.height) + 'px → ' +
          (cr.top >= st.top - 1 && cr.bottom <= st.bottom + 1 ? 'おさまる OK' : 'はみ出し MISSING'));
      const want = parseInt(arg, 10);   // #news:3 で 3ページめ
      if (want >= 2) {
        for (let i = 1; i < want && $('.news__next') && $('.news__nexttx').textContent.indexOf(MQ.text.fit('つぎ')) === 0; i++) { $('.news__next').click(); await wait(150); }
        say('news ' + want + 'ページめ: ' + rows().join(' / ') + '／ボタン ' + $('.news__nexttx').textContent);
        dump(); freeze(); return;
      }
      // さいごまで めくって とじる → seenNews が つく・2回目は 出ない
      let guard = 0;
      while ($('.news__next') && $('.news__nexttx').textContent.indexOf(MQ.text.fit('つぎ')) === 0 && guard++ < 10) {
        $('.news__next').click(); await wait(120);
      }
      const last = $('.news__nexttx') ? $('.news__nexttx').textContent : 'MISSING';
      if ($('.news__next')) $('.news__next').click();
      await wait(200);
      say('news: さいごの ボタン「' + last + '」→ とじた ' + ($('.newscard') ? 'MISSING' : 'OK') +
          '／seenNews ' + MQ.save.current().seenNews + ' → ' + (MQ.save.current().seenNews === N.latest() ? 'OK' : 'MISSING'));
      MQ.ui.news.reset();

      // 撮る 用に もう一度 出す
      MQ.save.update(function (pl) { pl.seenNews = null; });

    /* #streak … スタンプカレンダー（つづけた 日・v8.4）
         #streak       きょう ふくめて 3日め（コイン +1 を もらう ところ）
         #streak:7     7日め（コイン +3）

    /* #firstplay … はじめての 子の さいしょの 5分（v11.1）
         地図は からっぽ（帯・ごちゃまぜ・タイムアタックなし）＋「ここを おしてね」

    if (mode.indexOf('firstplay') === 0) {
      const arg = mode.split(':')[1] || '';
      try { localStorage.clear(); } catch (e) {}
      MQ.save.load();
      MQ.save.setSetting('sfx', false);
      MQ.save.setSetting('bgm', false);
      MQ.save.createPlayer('はじめて', { hair: 'gold', skin: 'mid', style: 'short' }, 3);

      say('firstplay: battles ' + (MQ.save.current().battles || 0) + '／seenUnlock ' + MQ.save.current().seenUnlock);
      say('firstplay: 帯 ' + ($('.mapobi') ? 'あり MISSING' : 'なし OK') +

          '／メニュー ' + ($$('.maptab').some(function (b) { return b.textContent.indexOf('メニュー') >= 0; }) ? 'あり OK' : 'なし MISSING'));
      const g = $('.mapguide');
      say('firstplay: ふきだし ' + (g ? '「' + g.textContent + '」OK' : 'なし MISSING') +
          '／ノード ' + $$('.node').length + '／いま ここ ' + ($('.node--now') ? 'ok' : 'MISSING'));

      const topEl = $('.maptop');
      if (topEl) say('firstplay: 上の 高さ ' + Math.round(topEl.getBoundingClientRect().height / MQ.stage.size().scale) + 'px');
      if (arg === 'measure') {
        const sc = MQ.stage.size().scale;
        function box(sel, lbl) { const e = document.querySelector(sel); if (!e) { say(lbl + ": なし"); return; } const r = e.getBoundingClientRect(); const p = document.querySelector(".map__layer").getBoundingClientRect(); say(lbl + ": x " + Math.round((r.left-p.left)/sc) + "〜" + Math.round((r.right-p.left)/sc) + " y " + Math.round((r.top-p.top)/sc) + "〜" + Math.round((r.bottom-p.top)/sc)); }
        box(".node--now", "いま ここ ノード");
        box(".node--now .node__name", "ステージ名");
        box(".biome", "ゾーン見出し");
        box(".mapguide", "ふきだし");
        const ns = Array.prototype.slice.call(document.querySelectorAll(".node"));
        if (ns[1]) { const r = ns[1].getBoundingClientRect(); const p = document.querySelector(".map__layer").getBoundingClientRect(); say("2つめの ノード: x " + Math.round((r.left-p.left)/sc) + "〜" + Math.round((r.right-p.left)/sc) + " y " + Math.round((r.top-p.top)/sc) + "〜" + Math.round((r.bottom-p.top)/sc)); }
        if (ns[3]) { const r = ns[3].getBoundingClientRect(); const p = document.querySelector(".map__layer").getBoundingClientRect(); say("つぎの 行: y " + Math.round((r.top-p.top)/sc)); }
        dump(); freeze(); return;
      }
      if (arg === 'map') { dump(); freeze(); return; }

      // さいしょの たたかい（本物の 画面を 通す）
      const now = $('.node--now'); if (now) now.click();

      say('firstplay: ザコ ' + MQ.battle.mobTotal() + '体（ふつうは 12）／てきの ため ' + (MQ.battle.chargeInfo() ? 'あり MISSING' : 'なし OK'));
      const gd = $('.qguide');
      say('firstplay: こたえ方の 案内 ' + (gd && !gd.hidden ? '「' + gd.textContent + '」OK' : 'なし MISSING'));
      // 案内の ふきだし＋サポートの ヒントで つまって いないか（たて700の 端末が いちばん きつい）
      (function () {

        say('firstplay: はみ出し カード ' + oc + 'px／ぜんたい ' + ob + 'px' + (Math.max(oc, ob) > 1 ? ' MISSING' : ' OK') +

      MQ.ui.goMap();
      await wait(480);
      const pop = $('.unlockpop');
      say('firstplay: できる ことが ふえた ' + (pop ? 'あり OK・' + $$('.unlockpop__t').map(function (e) { return e.textContent; }).join('／') : 'なし MISSING'));
      if (arg === 'pop') { dump(); freeze(); return; }
      const okb = pop ? pop.querySelector('.btn') : null;
      if (okb) okb.click();
      await wait(220);
      MQ.ui.goMap();
      await wait(420);
      dismissTowerPop();
      say('firstplay: 2回目の 地図 → 帯 ' + ($('.mapobi') ? 'あり OK' : 'なし MISSING') +
          '／ごちゃまぜ ' + ($('.mixbtn') ? 'あり OK' : 'なし MISSING') +
          '／タイムアタック ' + ($$('.maptab').some(function (bb) { return bb.textContent.indexOf('タイム') >= 0; }) ? 'あり OK' : 'なし MISSING') +
          '／ふきだし ' + ($('.mapguide') ? 'あり MISSING' : 'なし OK') +
          '／カード ' + ($('.unlockpop') ? 'また 出た MISSING' : '2回目は 出ない OK'));

    /* #review … ふくしゅう（v11.1）
         まえに 1回めで まちがえた 問題が つぎの たたかいで もどって くる
       #review    1問 わざと まちがえる → ためられる → つぎの たたかいに 出る（リボンを 撮る）
       #review2   その 問題に 1回めで 正解 → 消える（けっか画面に「ふくしゅう」）
       ※ 本物の 画面を 通して たたかう（applyRewards が 走らないと p.review に たまらない） */
    /* #dojo … しゅぎょうば（v13.0）：相棒が 指導して くれる 予習・復習
         #dojo         一覧（よしゅう／いまの ステージ／ふくしゅう）
         #dojo:lesson  せつめいの 画面
         #dojo:step    「まず なにを する？」の 3たく
         #dojo:miss    ひとりで やってみる で まちがえた ときの 声かけ
         #dojo:done    合格の 画面（けいけんち・学期で 閉じて いた ステージが 開く）
         #dojomap      修行で 開いた ステージの「よしゅう」リボン（地図）
       1学期まで に して、2学期の「大きい 数」（sansu3-7）を 予習する */
    if (mode.indexOf('dojo') === 0) {
      fresh();
      MQ.save.update(function (pl) { pl.seenNews = MQ.news.latest(); pl.term = 1; pl.units = {}; pl.stars['sansu3-5'] = 3; pl.stars['sansu3-6'] = 2; });
      const sub = mode.split(':')[1] || '';
      /* #dojo:g2 / #dojo:g5 … 小3 いがいで あそんで いても 地図に バーが 出る → 一覧 → 自動の 指導（v13.1）
           #dojo:g2:map（地図）#dojo:g2:list（一覧）#dojo:g2:ex（せつめい）#dojo:g2（ひとりで まで 通す） */
      if (/^g\d$/.test(sub)) {
        const g = Number(sub.slice(1));
        MQ.save.setPlayGrade(g);
        MQ.ui.goMap();
        await wait(250);
        const bar = $('.dojobtn');
        say('dojo:' + sub + ' 地図の バー ' + (bar ? 'あり OK' : 'なし MISSING'));
        const step = mode.split(':')[2] || '';
        if (step === 'map') { dump(); freeze(); return; }
        if (bar) bar.click();
        await wait(150);

    if (mode.indexOf('atk') === 0) {
