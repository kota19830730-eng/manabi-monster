      let guard = 0;
      if (fin) {
        // さいごの ザコの 手前まで 進む。ひっさつと かさならない ように、
        // 1回 わざと まちがえて コンボを 0に もどしてから とどめを さす
        while (MQ.battle.mobIndex() < MQ.battle.mobTotal() - 2 && guard++ < 30) {
          answerViaUI(true); await wait(1700);
        }
        answerViaUI(false); await wait(1700);   // コンボを 切る（1回目の まちがい）
        answerViaUI(true);  await wait(1700);   // 2回目で 正解 → つぎが さいごの ザコ
      } else {
        while (MQ.battle.combo() < n - 1 && guard++ < 30) {
          answerViaUI(true); await wait(1700);
        }
      }
      // たからばこの ときは こうげきが 出ない ので、ザコに なるまで 送る
      guard = 0;
      while (MQ.battle.current() && MQ.battle.current().chest && guard++ < 5) {
        answerViaUI(true); await wait(1700);
      }
      // さいごの 1発。当たる ころで アニメを 止める
      answerViaUI(true);
      await wait(holdAt);
      const st = document.createElement('style');
      // 写しは アニメが 0% から 始まる（0% は とうめい）ので、見える ところまで 進めて 止める
      st.textContent = '.hero, .hero *, .arena, .enemy__img, .stamp, .combo { animation-play-state: paused !important; }'
        + '.slash { animation-delay: -.16s !important; animation-play-state: paused !important; }'
        + '.sparks__p { animation-delay: -.14s !important; animation-play-state: paused !important; }';
      document.head.appendChild(st);
      const arcs = document.querySelectorAll('.slash');
      // 弧・つぶは 予約ずみの タイマーで 消え、つぎの 問題で 敵ごと 作り直される。
      // → 敵の かたまりを まるごと 写して .arena に のこす（写しには タイマーが つかない）
      const foes = document.querySelector('.foes');
      const arena = document.querySelector('.arena');
      if (foes && arena) {
        const c = foes.cloneNode(true);
        c.setAttribute('data-copy', '1');
        c.style.zIndex = '9';
        arena.appendChild(c);
      }
      say('atk: モーション=' + (document.querySelector('.hero').className.match(/atk--\w+/) || ['なし'])[0] +
          ' とどめ=' + (document.querySelector('.hero').classList.contains('is-finish') ? 'yes' : 'no') +
          ' 弧=' + arcs.length + '本' +
          ' つぶ=' + document.querySelectorAll('.sparks__p').length +
          ' まっ白=' + (document.querySelector('.enemy__img.is-white') ? 'yes' : 'no') +
          ' 画面の 寄り=' + (document.querySelector('.arena.is-punch, .arena.is-punch-big') ? 'yes' : 'no') +
          ' コンボ=' + MQ.battle.combo());
      dump();
      freeze();
      return;
    }

    /* ⑧ 合体こうげき（v7.5）：ひっさつわざと 相棒の 追い打ちが かさなった とき。
       なかまゲージは 3問ごと、ひっさつは 6コンボ（かぶと 外す）なので 6問めで かさなる。
       #palfx[:<秒>] */
    if (mode.indexOf('palfx') === 0) {
      const at = parseFloat(mode.split(':')[1] || '0.35');
      fresh();
      MQ.save.update(function (pl) {
        pl.equipped.helm = null;                       // ひっさつを 早く 出す そうびを 外す
        MQ.pals.add(pl, 'drago-1');
        MQ.pals.setActive(pl, 'drago-1');
      });
      MQ.ui.battle.start('sansu3-2');
      await wait(400);
      // なかまゲージが 3の ばいすう かつ ひっさつが 出る ところまで 正解を つづける
      let guard = 0, hit = false;
      while (guard++ < 24) {
        answerViaUI(true);
        await wait(200);
        if (document.querySelector('.ci--pal')) { hit = true; break; }   // v13.6：カットインは .ci（相棒と いっしょ＝.ci--pal）
        await wait(1500);
      }
      // v10.5：カットインの あいだは .arena に is-cutin が ついて、ふきだしと 相棒が 消える。
      //        headless の virtual-time では script が まって いる あいだ アニメの 時計が 進まない（transition が currentTime 0 の まま）ので、
      //        transition を いったん 切って「行き先の 値」を はかる（本物の 端末では .12秒で そこに つく）
      const arenaEl = document.querySelector('#screen-battle .arena');
      const quiet = !!(arenaEl && arenaEl.classList.contains('is-cutin'));
      const goal = ['.arena__msg'].map(function (s) {   // v12.2.1：相棒は 消えない（③で 走る）ので ふきだしだけ
        const e = document.querySelector('#screen-battle ' + s); if (!e) return s + '=なし';
        e.style.transition = 'none'; void e.offsetWidth;
        const v = getComputedStyle(e).opacity; e.style.transition = '';
        return s + '=' + v;
      });
      say('palfx: is-cutin=' + (quiet ? 'ok' : 'MISSING') + ' 消える先 ' + goal.join(' ') + '（0 が 正）');
      const palScn = document.querySelector('#screen-battle .pal .v3scene');
      say('palfx: 相棒の 器=' + moOf(palScn) + ' 体=' + moOf(document.querySelector('#screen-battle .pal .v3')) + ' 2D の is-hit=' + (document.querySelector('#screen-battle .pal.is-hit') ? 'あり' : 'なし') + '（③：器=mo-pal-follow/flank・体=mo-pal-sp・is-hit なし が 正）');
      // カットインは 0.62秒で 消える タイマーが ある → 写しを のこして 撮る
      const cut = document.querySelector('.ci');
      // 写しを 撮る ときも 消した ままに する（本物の 0.62秒の タイマーは もう 予約ずみで freeze では 止まらず
      // is-cutin を 外して しまう ので、写真用に inline で 消す。しくみの 検査は 上の ログ）
      ['.arena__msg'].forEach(function (s) { const e = document.querySelector(s); if (e) e.style.opacity = '0'; });
      // 写しは .fxscreen の 外へ（.fxscreen は わざの おわりに 空に される）
      if (cut) { const c = cut.cloneNode(true); c.setAttribute('data-copy','1'); c.style.animation='none'; c.style.zIndex='99'; document.getElementById('screen-battle').appendChild(c); }
      say('palfx: 合体=' + (hit ? 'ok' : 'MISSING') +
          ' カットイン=' + (cut ? 'ある' : 'ない') +
          ' 文=' + (cut && cut.querySelector('.ci__tx') ? cut.querySelector('.ci__tx').textContent : '-') +
          ' 相棒の 絵=' + (cut && cut.querySelector('.ci__pal') ? 'ある' : 'ない') +
          ' コンボ=' + MQ.battle.combo());
      dump();
      // 見える ところで 止めて 撮る
      void document.body.offsetWidth;
      document.getAnimations().forEach(function (a) { a.pause(); try { a.currentTime = at * 1000; } catch (e) {} });
      freeze();
      return;
    }

    /* なかま（相棒・v4.3）
       #pals        … 図かんの「なかま」タブ（相棒 3体＋コイン 20）
       #palbattle   … 相棒を 連れて バトル（3問 れんぞく 正解で 追い打ち）
       #palresult   … けっか画面（そだった ぶん＋なかまに なりたい）
       #palname     … なまえを つける（図かんの なかまタブ・v5.2）
       #palgauge    … なかまゲージ（正解で たまる・まちがえても へらない・v5.2） */
    if (mode.indexOf('pal') === 0) {
      fresh();
      MQ.save.update(function (pl) {
        pl.coins = 20;
        ['drago-1', 'mecha-2', 'ninja-1'].forEach(function (id) { MQ.pals.add(pl, id); });
        MQ.pals.setActive(pl, 'drago-1');
        // コインで こうかんできる ように、会った ことに する
        ['serp-1', 'krak-1', 'hawk-2', 'bolt-3'].forEach(function (id) { pl.dex[id] = (pl.dex[id] || 0) + 1; });
        if (mode === 'palresult') pl.pals['drago-1'].exp = MQ.pals.expFor(10) - 30;   // あと少しで しんか
      });
      // #palname … なまえを つける（v5.2）
      if (mode === 'palname') {
        MQ.ui.dex.render('pals');
        MQ.ui.show('screen-dex');
        await wait(200);
        const btn = $('.palnow__rename');
        if (!btn) { say('palname: なまえボタン MISSING'); return; }
        btn.click();
        await wait(250);
        const input = $('.palname__input');
        if (input) { input.value = 'ドラちゃん'; }
        const ok = $('.palname .btn--gold');
        if (ok) ok.click();
        await wait(300);
        const cur = MQ.pals.active(MQ.save.current());
        say('palname: なまえ=' + (cur ? cur.name : 'なし') + ' もとの名前=' + (cur ? cur.baseName : '-') +
            ' つけた=' + (cur && cur.named ? 'yes' : 'no') +
            ' カードの 字=' + ($('.palnow__name') ? $('.palnow__name').textContent : 'MISSING'));
        // もう一度 ひらいた ところを 撮る
        const b2 = $('.palnow__rename');
        if (b2) b2.click();
        await wait(250);
        dump();
        freeze();
        return;
      }
      // #palgauge … ゲージは 正解で たまり、まちがえても へらない（v5.2）
      if (mode === 'palgauge') {
        MQ.ui.battle.start('sansu3-2');
        await wait(400);
        const need = MQ.battle.palGaugeNeed();
        const ok1 = answerViaUI(true);  await wait(1800);
        say('  1問め ok=' + ok1 + ' ゲージ=' + MQ.battle.palGauge() + ' コンボ=' + MQ.battle.combo());
        const ok2 = answerViaUI(true);  await wait(1800);
        say('  2問め ok=' + ok2 + ' ゲージ=' + MQ.battle.palGauge() + ' コンボ=' + MQ.battle.combo());
        const before = MQ.battle.palGauge();
        const ok3 = answerViaUI(false); await wait(1800);   // わざと まちがえる
        say('  3問め（わざと ×）ok=' + ok3 + ' ゲージ=' + MQ.battle.palGauge() + ' コンボ=' + MQ.battle.combo());
        const after = MQ.battle.palGauge();
        say('palgauge: 何問で たまる=' + need + ' 2問めで=' + before +
            ' まちがえた あと=' + after + ' → ' + (after === before ? 'へらない OK' : 'へった NG') +
            ' コンボ=' + MQ.battle.combo() +
            ' 玉=' + document.querySelectorAll('.pal__dot.is-on').length + '/' + document.querySelectorAll('.pal__dot').length);
        dump();
        freeze();
        return;
      }
      // #palhit … 3問め（ゲージが たまった ところ）の 追い打ちの 帯を 撮る（v5.2）
      if (mode === 'palhit') {
        MQ.ui.battle.start('sansu3-2');
        await wait(400);
        answerViaUI(true); await wait(1800);
        answerViaUI(true); await wait(1800);
        answerViaUI(true); await wait(260);          // 帯が 出ている あいだに 止める
        // 帯は 0.9秒で 消える タイマーが ついている → 写しに おきかえて アニメを 止める
        const st = document.createElement('style');
        st.textContent = '.palbanner { animation-delay: -.25s !important; animation-play-state: paused !important; }';
        document.head.appendChild(st);
        const bn = document.querySelector('.palbanner');
        // .fx は つぎの 問題を 出す ときに 空に される → 写しは .arena に おく
        const arena = document.querySelector('.arena');
        if (bn && arena) { arena.appendChild(bn.cloneNode(true)); }
        say('palhit: 帯=' + (bn ? bn.textContent : 'MISSING') +
            ' ゲージ=' + MQ.battle.palGauge() + '（たまったら 0に もどる）' +
            ' 玉=' + document.querySelectorAll('.pal__dot.is-on').length + '/' + document.querySelectorAll('.pal__dot').length);
        dump();
        freeze();
        return;
      }
      if (mode === 'pals') {
        MQ.ui.dex.render('pals');
        MQ.ui.show('screen-dex');
        await wait(200);
        const cur = MQ.pals.active(MQ.save.current());
        say('pals: いまの相棒=' + (cur ? cur.name + ' Lv.' + cur.lv : 'なし') +
            ' もっている=' + MQ.pals.own(MQ.save.current()).length +
            ' お店=' + document.querySelectorAll('.palshop__row').length + ' 相棒カード=' + ($('.palnow') ? 'ok' : 'MISSING'));
        return;
      }
      // #palresult2 … かならず「なかまに なりたい」が 出る（いちばん つまった 画面の 検査）
      if (mode === 'palresult2') { const real = MQ.pals.offerFrom; MQ.pals.offerFrom = function (p, def) { return real(p, def, function () { return 0; }); }; }
      MQ.ui.battle.start('sansu3-2');
      await wait(400);
      say('palbattle: 画面の 相棒=' + ($('.pal') && !$('.pal').hidden ? $('.pal .pal__name').textContent : 'MISSING'));
      if (mode === 'palbattle') {
        // 3問 れんぞく 正解 → 追い打ち
        for (let i = 0; i < 3; i++) { answerViaUI(true); await wait(1800); }
        say('palbattle: 追い打ち=' + (MQ.battle.summaryNow ? '?' : '') + ' コンボ=' + MQ.battle.combo());
        freeze();
        return;
      }
      await playBattle('palresult');
      await wait(900);
      const rs = $('.rs');
      say('palresult: 画面=' + (rs ? 'ok' : 'MISSING') +
          ' 相棒の帯=' + ($('.rs__pal') ? $('.rs__pal .rs__palname').textContent : 'なし') +
          ' なかま候補=' + ($('.rs__paloffer') ? $('.rs__paloffer .rs__palotext').textContent : 'なし'));
      return;
    }

    if (mode === 'result' || mode === 'result2' || mode === 'result3') {
      // #result  … ボスを たおして レベルアップも する にぎやかな ケース
      // #result2 … ボスに にげられて ★0 の さみしい ケース
      fresh();
      MQ.save.update(function (pl) {
        // つぎの 1戦で かならず レベルアップ するように、あと 40 で 上がる XP に する
        let xp = pl.xp;
        while (MQ.hero.progress(xp).need - MQ.hero.progress(xp).into > 40) xp++;
        pl.xp = xp;
      });
      MQ.ui.battle.start(mode === 'result3' ? 'sansu3-4' : 'sansu3-6');   // result3 … つぎの ステージが ある
      await wait(400);
      if (mode === 'result2') {
        let g = 0;
        while (!MQ.battle.isOver() && g++ < 60) { answerViaUI(false); await wait(60); if (MQ.battle.isRetry()) { answerViaUI(false); await wait(60); } await wait(3300); }
      } else {
        await playBattle('result');
      }
      await wait(800);
      say('result: ' + ($('.rs') ? 'ok' : 'MISSING') + ' / ボス: ' + ($('.rs__boss') ? 'ok' : 'MISSING'));
      return;
    }

    /* レベルの ごほうび・そうびを きたえる（v13.15）
         #forge        … メニュー「じぶん」の レベルの みち＋かじや（けん +3・マント +5）
         #forge:hit    … 「きたえる」ボタンを 本当に click() した あと（光る・コインが へる）
         #forge:poor   … コインが たりない
         #lvgift       … けっか画面：Lv9 → Lv10（コイン・むりょう券・ブロンズ バッジ）
         #lvgift:50    … Lv49 → Lv50（レインボー）の HUD と けっか画面
         #capticket    … カプセル：むりょう券 2まい・コイン 3まい → 「むりょうで まわす」を click() */
    if (mode.indexOf('forge') === 0) {
      const what = mode.split(':')[1] || '';
      fresh();
      MQ.save.update(function (pl) {
        pl.coins = what === 'poor' ? 3 : 84;
        if (what === 'top') { pl.xp = MQ.hero.xpForLevel(23) + 50; pl.lvPaid = 23; }
        pl.forge = { weapon: 3, shield: 1, helm: 0, armor: 2, cape: 5 };
        pl.capsule.tickets = 1;
      });
      MQ.ui.dex.render('hero'); MQ.ui.show('screen-dex');
      await wait(120);
      const wrap = $('#screen-dex .wrap');
      const road = $('.lvroad');
      if (road && wrap && what !== 'top') wrap.scrollTop = road.offsetTop - 60;
      const before = MQ.save.current();
      say('forge: road ' + $$('.lvroad__one').length + ' / rows ' + $$('.forge__row').length + ' / max ' + $$('.forge__row.is-max').length + ' / coins ' + before.coins);
      $$('.forge__row').forEach(function (r) { say('  ' + r.getAttribute('data-slot') + ': ' + r.textContent.replace(/\s+/g, ' ')); });
      if (what === 'hit') {
        const btn = $('.forge__row[data-slot="weapon"] .forge__btn');
        btn.click();
        await wait(60);
        const p2 = MQ.save.current();
        const row = $('.forge__row[data-slot="weapon"]');
        say('hit: weapon +' + MQ.forge.level(p2, 'weapon') + ' / coins ' + p2.coins + ' / is-forged ' + (row && row.classList.contains('is-forged') ? 'yes' : 'no') + ' / title ' + ((p2.titles || []).indexOf('t-forge1') >= 0 ? 'かじやの でし' : 'なし'));
        // 光る ところを 撮る（アニメの まんなかで 止める）
        freeze();
        const fw = $('#screen-dex .wrap'), fr = $('.forge');
        if (fr && fw) fw.scrollTop = fr.offsetTop - 60;
        document.getAnimations().forEach(function (a) { try { a.currentTime = 160; a.pause(); } catch (e) {} });
      }
      if (what === 'poor') {
        const btns = $$('.forge__btn');
        say('poor: 暗い ボタン ' + btns.filter(function (b) { return b.classList.contains('is-short'); }).length + ' / ' + btns.length);
        btns[0].click(); await wait(40);
        say('poor: 押すと ' + (document.getElementById('toast') ? document.getElementById('toast').textContent : 'トーストなし') + ' / コイン ' + MQ.save.current().coins);
        const fr = $('.forge');
        if (fr && wrap) wrap.scrollTop = fr.offsetTop - 60;
      }
      return;
    }
    if (mode.indexOf('lvgift') === 0) {
      const to = Number(mode.split(':')[1]) || 10;
      fresh();
      MQ.save.update(function (pl) {
        pl.xp = MQ.hero.xpForLevel(to) - 30;          // つぎの 1戦で かならず Lv が 上がる
        pl.lvPaid = to - 1;
        pl.capsule.tickets = 0;
      });
      MQ.ui.battle.start('sansu3-6');
      await wait(400);
      await playBattle('lvgift');
      await wait(900);
      const p3 = MQ.save.current();
      say('lvgift: ' + ($('.rs__lvgift') ? $('.rs__lvgift').textContent.replace(/\s+/g, ' ') : 'MISSING') + ' / Lv' + MQ.hero.progress(p3.xp).level + ' / 券 ' + MQ.levelup.tickets(p3) + ' / lvPaid ' + p3.lvPaid);
      freeze();
      $$('.rs__in').forEach(function (el) { el.classList.add('is-in'); });
      document.getAnimations().forEach(function (a) { try { a.finish(); } catch (e) {} });
      return;
    }
    if (mode === 'capticket' || mode === 'capticket:see') {
      fresh();
      MQ.save.update(function (pl) { pl.coins = 3; pl.capsule.tickets = 2; });
      MQ.ui.capsule.open({ kind: 'mon' });
      await wait(150);
      const b = $('.capgo');
      say('capticket: ' + (b ? b.textContent.replace(/\s+/g, ' ') : 'MISSING') + ' / ticket-class ' + (b && b.classList.contains('capgo--ticket') ? 'yes' : 'no') + ' / disabled ' + (b ? b.disabled : '-'));
      if (mode === 'capticket:see') return;
      b.click();
      await wait(80);
      const p4 = MQ.save.current();
      say('after: 券 ' + MQ.levelup.tickets(p4) + ' / coins ' + p4.coins + ' / pulls ' + p4.capsule.pulls);
      if (MQ.ui.capsule.skip) MQ.ui.capsule.skip();
      await wait(200);
      return;
    }

    /* ぴかぴか あつめ・しゅうまつ イベント（v13.16）
         #pika          … 地図：ステージの すみの たからもの・ゾーンの ✦
         #pika:all      … 国語の森の たからものが ぜんぶ ぴかぴか → かんむり
         #pika:dex      … メニュー「もちもの」の ぴかぴか あつめの カード
         #pika:result   … 5こめの ぴかぴか → けっか画面に むりょうけん
         #pika:hint     … 1問 まちがえて クリア → 「パーフェクトで ぴかぴかに！」
         #weekend[:golden|chest|pal|coin] … 土よう日の 地図と ポップ（2回めの 地図では 出ない）
         #weekend:<id>:chip  … ポップを とじた あとの 地図の ふだ
         #weekend:pre   … 金よう日：帯の パネルの 予告
         #weekend:off   … おうちの人が なしに した
         #weekend:<id>:stay  … ポップを ひらいた まま（撮る 用）
         #wkbattle:<golden|chest|pal|coin> … その まつりで 1回 たたかって けっか画面（:banner で はじめの 帯）*/
    if (mode.indexOf('pika') === 0) {
      const what = mode.split(':')[1] || '';
      const trP = { 'tr-kake': 2, 'tr-wari': 2, 'tr-jikoku': 1, 'tr-yomi': 2, 'tr-kaki': 1 };
      if (what === 'all') {
        MQ.content.subjectAreas().filter(function (a) { return a.id === 'kokugo'; })[0].stages.forEach(function (st) {
          const t = MQ.treasure.forStage(st.id); if (t) trP[t.id] = 2;
        });
      }
      if (what === 'result') trP['tr-kaki'] = 2;              // 4こ ＋ じこくの すなどけい で 5こめ
      const stP = { 'sansu3-1': 3, 'sansu3-2': 3, 'sansu3-3': 2, 'sansu3-4': 2, 'kokugo3-1': 3, 'kokugo3-2': 2, 'kokugo3-3': 1, 'rikashakai3-1': 2, 'eigo3-1': 1 };
      if (what === 'all') MQ.content.subjectAreas().filter(function (a) { return a.id === 'kokugo'; })[0].stages.forEach(function (st) { stP[st.id] = 3; });
      fresh({ treasure: trP, stars: stP });

    MQ.ui.goMap();
    await wait(300);
    say('あたらしい こと: モーダル ' + ($('.newscard') ? 'ok' : 'MISSING') + ' / お知らせ ' + $$('.newsrow').length + 'こ / ページ ' + MQ.news.pages(MQ.save.current()).length);
    let ng = 0;
    while ($('.news__next') && ng++ < 60) { $('.news__next').click(); await wait(120); }   // 版が ふえる たびに ページも ふえる（v12.0 で 13ページ・v13.17 で 25ページ）
    MQ.ui.news.reset();
    MQ.ui.goMap();
    await wait(200);
    say('あたらしい こと: とじた あと ' + ($('.newscard') ? 'MISSING（また 出る）' : 'ok（出ない）') + ' / seenNews ' + MQ.save.current().seenNews);

    // カプセルマシン（v9.0 → 2026-09-13 から メニューの「カプセル」タブ）：タブ → 1回 引く
    MQ.save.update(function (pl) { pl.coins = 40; });
    MQ.ui.dex.render('pals'); MQ.ui.show('screen-dex');
    await wait(150);
    say('カプセル: タブ ' + [].map.call($$('#screen-dex .tab'), function (b) { return b.textContent; }).join('/')
      + ' / カプセルの タブ ' + ($('.tab--capsule') ? 'ok' : 'MISSING'));
    if ($('.tab--capsule')) $('.tab--capsule').click();
    await wait(150);
    say('カプセル: 画面 ' + ($('.capsule') ? 'ok' : 'MISSING') + ' / ' + ($('.capline') ? $('.capline').textContent : 'MISSING'));
    /* **ボタンを ほんとうに click() する。** `MQ.ui.capsule.pull()` を 直に 呼ぶと
       クリックの バブリングが おきず、「まわす を 押した クリックが そのまま
       タップで とばす に 届いて 演出が 消える」バグを 見のがす（2026-09-07） */
    if ($('.capgo')) $('.capgo').click();
    await wait(300);
    say('カプセル: 演出 ' + ($('.capfx') ? 'ok' : 'MISSING（すぐ 消えた）')
      + ' / 結果は まだ ' + ($('.capsule__result').hidden ? 'ok' : 'MISSING（とばされた）'));
    MQ.ui.capsule.skip();
    await wait(150);
    say('カプセル: 出た ' + ($('.capres__name') ? $('.capres__name').textContent + ' / コイン ' + MQ.save.current().coins : 'MISSING'));
    // タブを はなれる（ほかの タブを click()）
    $$('#screen-dex .tab')[0].click();
    await wait(80);
    say('カプセル: とじた ' + ($('.capsule') ? 'MISSING（のこって いる）' : 'ok') + ' / 夜空 ' + ($('.capfx') ? 'MISSING（のこって いる）' : 'とじた'));

    // 地図の 上の「タイトル」ボタン（2026-09-13）→ タイトル → つづき で 地図へ
    MQ.ui.goMap(); await wait(200);
    say('タイトルへ: ボタン ' + ($('#screen-map .hud__home') ? 'ok' : 'MISSING'));
    if ($('#screen-map .hud__home')) $('#screen-map .hud__home').click();
    await wait(200);
    say('タイトルへ: 画面 ' + (document.getElementById('screen-start').classList.contains('is-active') ? 'タイトル ok' : 'MISSING'));
    MQ.ui.goMap(); await wait(200);

    /* しゅぎょうば（v13.0）：一覧 → せつめい → いっしょに → ひとりで まで 通す */
    MQ.save.setPlayGrade(3);   // ここまでの 検査で 学年が 小6 などに なって いる（指導は いま 小3 だけ）
    MQ.ui.dojo.openList();
    await wait(100);
    say('しゅぎょうば: 一覧の 行 ' + ($$('.dojorow').length ? $$('.dojorow').length + ' OK' : 'MISSING'));
    MQ.ui.dojo.open('sansu3-6');
    await wait(80);
    let dg = 0;
    while (dg++ < 20 && !/ひとりで/.test(($('.dojo__label') || {}).textContent || '')) {
      const okb = $$('.dojo__step').filter(function (b) { return !b.disabled && b.getAttribute('data-ok') === '1'; })[0];
      if (okb) { okb.click(); await wait(20); continue; }
      const nb = $('.dojo__next'); if (!nb) break; nb.click(); await wait(20);
    }
    say('しゅぎょうば: ' + (new RegExp(MQ.text.fit('ひとりで')).test(($('.dojo__label') || {}).textContent || '') ? 'ひとりで まで 通った OK' : 'とちゅうで 止まった MISSING'));
    // 小2でも バーが 出て、自動の 指導が 開く（v13.1）
    MQ.save.setPlayGrade(2);
    MQ.ui.goMap();
    await wait(80);
    say('しゅぎょうば 小2: 地図の バー ' + ($('.dojobtn') ? 'あり OK' : 'なし MISSING'));
    MQ.ui.dojo.openList();
    await wait(80);
    const r2 = $$('.dojorow');
    if (r2.length) { r2[r2.length - 1].click(); await wait(60); }
    say('しゅぎょうば 小2: ' + (r2.length && $('.dojo__say') && MQ.ui.dojo.state() ? '一覧 ' + r2.length + '・自動の 指導 OK' : 'MISSING'));
    MQ.save.setPlayGrade(3);
    MQ.ui.goMap();
    await wait(60);

    say('=== エラー: ' + L.filter(function (t) { return t.indexOf('ERROR') === 0 || t.indexOf('MISSING') >= 0; }).length + ' ===');
    dump();
  }

  run().then(dump, function (e) { say('THROW ' + e); dump(); });
  setInterval(dump, 500);
})();
</script>
</body>
</html>
